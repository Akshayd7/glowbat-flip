<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tiny Tower Pop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2b2d42;
      font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      background: #7ec8ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    #score-display {
      font-size: 56px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 0 #ff758f, 0 8px 16px rgba(0, 0, 0, 0.18);
      line-height: 1;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #score-display.pop {
      transform: scale(1.28);
    }

    #combo-badge {
      margin-top: 6px;
      background: #ffbe0b;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      padding: 4px 14px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #fb5607, 0 4px 10px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    #combo-badge.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Mute Button - Always visible top-right */
    #mute-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #ff8fab;
      box-shadow: 0 4px 0 #fb6f92, 0 6px 12px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    #mute-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #fb6f92, 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    #mute-btn svg {
      width: 24px;
      height: 24px;
      fill: #fb6f92;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 4px solid #ffafcc;
      box-shadow: 0 10px 0 #ff8fab, 0 18px 36px rgba(0, 0, 0, 0.18);
      animation: floatCard 3s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .title-logo {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.05;
      color: #ff5d8f;
      text-shadow: 0 3px 0 #ffc2d1;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .title-logo span {
      display: inline-block;
      color: #4cc9f0;
      text-shadow: 0 3px 0 #bde0fe;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 700;
      color: #6c757d;
      margin-bottom: 20px;
    }

    .stats-box {
      background: #fff0f3;
      border: 2px dashed #ff8fab;
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-around;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ff758f;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
      color: #3a0ca3;
    }

    .btn-primary {
      background: linear-gradient(180deg, #70e000 0%, #38b000 100%);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 22px;
      font-weight: 900;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 0 #008000, 0 10px 20px rgba(56, 176, 0, 0.35);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      font-family: inherit;
    }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #008000, 0 4px 10px rgba(56, 176, 0, 0.25);
    }

    .tap-hint {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #ff5d8f;
      animation: pulseText 1.4s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.65; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <!-- Top HUD -->
    <div id="hud">
      <div id="score-display">0</div>
      <div id="combo-badge">PERFECT x1</div>
    </div>

    <!-- Always-visible Mute Button -->
    <button id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
      <svg id="icon-sound-on" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <div class="card" id="start-card">
        <div class="title-logo">Tiny Tower <span>Pop!</span></div>
        <div class="subtitle">Stack cute blocks to the clouds!</div>
        <div class="stats-box">
          <div class="stat-item">
            <span class="stat-label">Best Score</span>
            <span class="stat-value" id="start-best">0</span>
          </div>
        </div>
        <button id="start-btn" class="btn-primary">TAP TO PLAY</button>
        <div class="tap-hint">Tap, Click, or Press Space</div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="card">
        <div class="title-logo">GAME <span>OVER</span></div>
        <div class="subtitle" id="gameover-msg">Awesome stacking!</div>
        <div class="stats-box">
          <div class="stat-item">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="final-score">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="best-score">0</span>
          </div>
        </div>
        <button id="restart-btn" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- Storage Keys ---
      const STORAGE_KEY = 'tinytower_v1';
      const MUTE_KEY = 'tinytower_v1_mute';

      // --- Safe LocalStorage Helpers ---
      function loadBestScore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return 0;
          const parsed = JSON.parse(raw);
          if (typeof parsed === 'number') return parsed;
          if (parsed && typeof parsed.best === 'number') return parsed.best;
          return 0;
        } catch (e) {
          return 0;
        }
      }

      function saveBestScore(val) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ best: val }));
        } catch (e) {
          // Ignore storage quota errors
        }
      }

      function loadMuteState() {
        try {
          return localStorage.getItem(MUTE_KEY) === 'true';
        } catch (e) {
          return false;
        }
      }

      function saveMuteState(muted) {
        try {
          localStorage.setItem(MUTE_KEY, muted ? 'true' : 'false');
        } catch (e) {}
      }

      // --- Pastel Block Palette ---
      const PALETTE = [
        { fill: '#ff8fab', border: '#fb6f92', cheek: '#ff4d6d' }, // Strawberry Pink
        { fill: '#ffca3a', border: '#f4a261', cheek: '#f77f00' }, // Sunny Yellow
        { fill: '#8ac926', border: '#55a630', cheek: '#ff758f' }, // Apple Green
        { fill: '#4cc9f0', border: '#4895ef', cheek: '#ff8fab' }, // Sky Blue
        { fill: '#b5179e', border: '#7209b7', cheek: '#ff99c8', lightFace: true }, // Berry Purple
        { fill: '#ff9f1c', border: '#e76f51', cheek: '#e63946' }, // Tangerine
        { fill: '#9bf6ff', border: '#00bbf9', cheek: '#ff8fab' }, // Mint Aqua
        { fill: '#ffc6ff', border: '#c77dff', cheek: '#ff5d8f' }  // Lavender Candy
      ];

      // --- WebAudio Synthesizer (SFX + Soft Music) ---
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = loadMuteState();
          this.musicTimer = null;
          this.musicStep = 0;
          // Cheerful pentatonic lullaby notes (Hz)
          this.melody = [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33];
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              try {
                this.ctx = new AudioCtx();
              } catch (e) {}
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        setMuted(m) {
          this.muted = m;
          saveMuteState(m);
          if (this.muted) {
            this.stopMusic();
          } else {
            this.init();
            if (gameState === 'PLAYING') {
              this.startMusic();
            }
          }
        }

        startMusic() {
          if (this.muted) return;
          this.stopMusic();
          this.musicTimer = setInterval(() => {
            if (this.muted || gameState !== 'PLAYING' || !this.ctx) return;
            try {
              const now = this.ctx.currentTime;
              const freq = this.melody[this.musicStep % this.melody.length];
              this.musicStep++;

              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);

              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(0.025, now + 0.05);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.45);
            } catch (e) {}
          }, 480);
        }

        stopMusic() {
          if (this.musicTimer) {
            clearInterval(this.musicTimer);
            this.musicTimer = null;
          }
        }

        playDrop(heightIndex) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const baseFreq = 240 + (heightIndex % 12) * 22;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.11);

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
          } catch (e) {}
        }

        playPerfect(combo) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            const pitchBoost = Math.min(combo, 8) * 28;
            notes.forEach((n, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(n + pitchBoost, now + idx * 0.045);

              gain.gain.setValueAtTime(0.12, now + idx * 0.045);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.25);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + idx * 0.045);
              osc.stop(now + idx * 0.045 + 0.26);
            });
          } catch (e) {}
        }

        playGameOver() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const notes = [392.00, 349.23, 329.63, 261.63];
            notes.forEach((n, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(n, now + idx * 0.12);

              gain.gain.setValueAtTime(0.08, now + idx * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.22);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + idx * 0.12);
              osc.stop(now + idx * 0.12 + 0.24);
            });
          } catch (e) {}
        }
      }

      const sound = new SoundEngine();

      // --- DOM Elements ---
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-display');
      const comboEl = document.getElementById('combo-badge');
      const muteBtn = document.getElementById('mute-btn');
      const iconSoundOn = document.getElementById('icon-sound-on');
      const iconSoundOff = document.getElementById('icon-sound-off');

      const startScreen = document.getElementById('start-screen');
      const gameoverScreen = document.getElementById('gameover-screen');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');
      const startBestEl = document.getElementById('start-best');
      const finalScoreEl = document.getElementById('final-score');
      const bestScoreEl = document.getElementById('best-score');
      const gameoverMsgEl = document.getElementById('gameover-msg');

      // --- Game State & Constants ---
      let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
      let width = 360;
      let height = 640;
      let dpr = 1;

      const BLOCK_HEIGHT = 42;
      const PERFECT_TOLERANCE = 9;
      const GOLD_COLOR = { fill: '#ffd700', border: '#d4a017', cheek: '#ff9f1c' };
      const WIDEN_BONUS = 10;

      let score = 0;
      let towerHeight = 0;
      let combo = 0;
      let hearts = 1;
      let perfectStreakTotal = 0;
      let bestScore = loadBestScore();

      let cameraY = 0;
      let targetCameraY = 0;

      let stack = [];
      let activeBlock = null;
      let fallingSlices = [];
      let confetti = [];
      let floatingTexts = [];
      let clouds = [];
      let birds = [];
      let birdTimer = 1.5;
      let curZoneIdx = -1;
      const stars = [];
      for (let i = 0; i < 90; i++) {
        stars.push({ x: Math.random(), y: Math.random() * 0.9, r: 0.6 + Math.random() * 1.7, tw: Math.random() * 6.28 });
      }

      let lastTime = performance.now();

      // --- Initialize UI Mute State ---
      function updateMuteUI() {
        if (sound.muted) {
          iconSoundOn.style.display = 'none';
          iconSoundOff.style.display = 'block';
        } else {
          iconSoundOn.style.display = 'block';
          iconSoundOff.style.display = 'none';
        }
      }
      updateMuteUI();
      startBestEl.textContent = bestScore;

      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.setMuted(!sound.muted);
        updateMuteUI();
      });

      // --- Clouds Setup ---
      function initClouds() {
        clouds = [];
        for (let i = 0; i < 6; i++) {
          clouds.push({
            x: Math.random() * width,
            y: 60 + i * 95 + (Math.random() * 30 - 15),
            scale: 0.65 + Math.random() * 0.55,
            speed: 10 + Math.random() * 16,
            alpha: 0.65 + Math.random() * 0.25
          });
        }
      }

      // --- Sky Zones (evolve with tower height) ---
      const SKY_ZONES = [
        { name: 'SUNRISE MEADOW', top: [255, 183, 197], bot: [255, 229, 180], cloud: [255, 244, 230], cloudA: 0.95, starA: 0.0,  birds: 1.0, sun: '#ffd166' },
        { name: 'BLUE DAY SKY',   top: [126, 200, 255], bot: [227, 246, 255], cloud: [255, 255, 255], cloudA: 1.0,  starA: 0.0,  birds: 1.0, sun: '#ffe066' },
        { name: 'SUNSET GLOW',    top: [255, 140, 105], bot: [255, 209, 102], cloud: [255, 214, 186], cloudA: 0.9,  starA: 0.15, birds: 0.7, sun: '#ff9e5e' },
        { name: 'STARRY NIGHT',   top: [27, 42, 94],    bot: [74, 59, 122],   cloud: [120, 130, 180], cloudA: 0.35, starA: 1.0,  birds: 0.15, sun: '#f4f1de' },
        { name: 'OUTER SPACE',    top: [11, 11, 42],    bot: [42, 26, 74],    cloud: [90, 90, 140],   cloudA: 0.15, starA: 1.0,  birds: 0.0, sun: '#f4f1de' }
      ];
      const ZONE_HEIGHT = 15; // blocks per sky zone

      function lerpN(a, b, t) { return a + (b - a) * t; }
      function lerpColor(a, b, t) {
        return 'rgb(' + Math.round(lerpN(a[0], b[0], t)) + ',' + Math.round(lerpN(a[1], b[1], t)) + ',' + Math.round(lerpN(a[2], b[2], t)) + ')';
      }

      function skyState() {
        const zf = Math.min(SKY_ZONES.length - 0.001, score / ZONE_HEIGHT);
        const i = Math.floor(zf);
        const t = Math.min(1, (zf - i) * 1.5);
        const a = SKY_ZONES[i];
        const b = SKY_ZONES[Math.min(SKY_ZONES.length - 1, i + 1)];
        return {
          idx: i,
          top: lerpColor(a.top, b.top, t),
          bot: lerpColor(a.bot, b.bot, t),
          cloud: lerpColor(a.cloud, b.cloud, t),
          cloudA: lerpN(a.cloudA, b.cloudA, t),
          starA: lerpN(a.starA, b.starA, t),
          birds: lerpN(a.birds, b.birds, t),
          night: i >= 3,
          space: i >= 4
        };
      }

      function spawnFlock() {
        const n = 3 + Math.floor(Math.random() * 3);
        const baseY = 40 + Math.random() * (height * 0.4);
        const dir = Math.random() < 0.5 ? 1 : -1;
        const flock = { x: dir > 0 ? -60 : width + 60, y: baseY, speed: (45 + Math.random() * 40) * dir, birds: [], hue: Math.random() };
        for (let i = 0; i < n; i++) {
          flock.birds.push({
            ox: -i * (22 + Math.random() * 14),
            oy: (Math.random() * 26 - 13),
            ph: Math.random() * 6.28,
            s: 0.75 + Math.random() * 0.5
          });
        }
        birds.push(flock);
      }

      function drawBird(x, y, s, ph, dir, tint) {
        const flap = Math.sin(ph) * 6;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s * dir, s);
        // body
        ctx.fillStyle = tint;
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // head
        ctx.beginPath();
        ctx.arc(8, -4, 4.5, 0, Math.PI * 2);
        ctx.fill();
        // belly
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.ellipse(-1, 2, 5, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
        // wing
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(-3, -2 - flap * 0.4, 6.5, 3, -0.5 - flap * 0.06, 0, Math.PI * 2);
        ctx.fill();
        // beak
        ctx.fillStyle = '#ff9f1c';
        ctx.beginPath();
        ctx.moveTo(12, -4);
        ctx.lineTo(17, -2.5);
        ctx.lineTo(12, -1.5);
        ctx.closePath();
        ctx.fill();
        // eye
        ctx.fillStyle = '#2b2d42';
        ctx.beginPath();
        ctx.arc(9.5, -5, 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // --- Resize Handling ---
      function handleResize() {
        const wrapper = document.getElementById('game-wrapper');
        const rect = wrapper.getBoundingClientRect();
        width = Math.max(280, rect.width);
        height = Math.max(420, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (clouds.length === 0) {
          initClouds();
        }
      }

      window.addEventListener('resize', handleResize);
      handleResize();

      // --- Reset & Start Game ---
      function resetGame() {
        score = 0;
        towerHeight = 0;
        combo = 0;
        hearts = 1;
        perfectStreakTotal = 0;
        cameraY = 0;
        targetCameraY = 0;
        fallingSlices = [];
        confetti = [];
        floatingTexts = [];

        const baseWidth = Math.min(220, width * 0.58);
        const baseY = height - 90;

        // Foundation pedestal block
        stack = [
          {
            x: (width - baseWidth) / 2,
            y: baseY,
            w: baseWidth,
            h: BLOCK_HEIGHT,
            color: PALETTE[0],
            faceType: 0,
            bounce: 0,
            bounceVel: 0
          }
        ];

        updateScoreUI(false);
        updateComboUI();
        spawnNextBlock();
      }

      function spawnNextBlock() {
        const topBlock = stack[stack.length - 1];
        const nextIndex = stack.length;
        const color = PALETTE[nextIndex % PALETTE.length];
        const yPos = topBlock.y - BLOCK_HEIGHT;

        // Fair speed progression (perfect streaks slow the block down)
        const baseSpeed = 145;
        let speed = Math.min(350, baseSpeed + towerHeight * 4.5);
        if (combo >= 4) speed = Math.round(speed * 0.55);
        const startLeft = nextIndex % 2 === 1;

        // Golden WIDE bonus block every 10th: lands full-width, no slicing
        const isWide = nextIndex % 10 === 9;

        activeBlock = {
          x: startLeft ? 16 : width - topBlock.w - 16,
          y: yPos,
          w: topBlock.w,
          h: BLOCK_HEIGHT,
          vx: startLeft ? speed : -speed,
          color: isWide ? GOLD_COLOR : color,
          faceType: nextIndex % 4,
          wide: isWide
        };

        // Scroll camera up smoothly when tower grows past mid-lower screen
        const idealScreenY = height * 0.62;
        if (yPos + targetCameraY < idealScreenY) {
          targetCameraY = idealScreenY - yPos;
        }
      }

      function updateScoreUI(animate) {
        scoreEl.textContent = score;
        if (animate) {
          scoreEl.classList.remove('pop');
          void scoreEl.offsetWidth;
          scoreEl.classList.add('pop');
          setTimeout(() => scoreEl.classList.remove('pop'), 130);
        }
      }

      function updateComboUI() {
        if (combo >= 1) {
          comboEl.textContent = `PERFECT x${combo}!`;
          comboEl.classList.add('active');
        } else {
          comboEl.classList.remove('active');
        }
      }

      // --- Confetti Burst on Perfect Drop ---
      function spawnConfetti(cx, cy) {
        const colors = ['#ff5d8f', '#ffbe0b', '#70e000', '#00bbf9', '#9b5de5', '#ffffff'];
        for (let i = 0; i < 26; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 90 + Math.random() * 210;
          confetti.push({
            x: cx + (Math.random() * 60 - 30),
            y: cy,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 120,
            size: 5 + Math.random() * 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 10,
            life: 1.0
          });
        }
      }

      function spawnFloatingText(text, x, y, color) {
        floatingTexts.push({
          text,
          x,
          y,
          color: color || '#ffffff',
          life: 1.0
        });
      }

      // --- Drop Block Action ---
      function dropActiveBlock() {
        if (gameState !== 'PLAYING' || !activeBlock) return;

        const top = stack[stack.length - 1];
        const curr = activeBlock;
        const diff = curr.x - top.x;
        const absDiff = Math.abs(diff);

        // Missed completely -> spend a Rescue Heart or Game Over
        if (absDiff >= curr.w) {
          if (hearts > 0) {
            hearts--;
            combo++;
            towerHeight++;
            score += 2;
            sound.playPerfect(combo);
            spawnConfetti(top.x + top.w / 2, curr.y + curr.h / 2);
            spawnFloatingText('RESCUED! ❤️', top.x + top.w / 2, curr.y - 10, '#ff5d8f');
            stack.push({
              x: top.x,
              y: curr.y,
              w: top.w,
              h: curr.h,
              color: curr.color,
              faceType: curr.faceType,
              bounce: 1.0,
              bounceVel: 0
            });
            updateScoreUI(true);
            updateComboUI();
            activeBlock = null;
            spawnNextBlock();
            return;
          }
          fallingSlices.push({
            x: curr.x,
            y: curr.y,
            w: curr.w,
            h: curr.h,
            vx: curr.vx * 0.25,
            vy: 40,
            vRot: (diff > 0 ? 1 : -1) * 2.5,
            rot: 0,
            color: curr.color
          });
          activeBlock = null;
          window.triggerGameOver();
          return;
        }

        // Golden WIDE block: any overlap lands full width
        if (curr.wide && absDiff < curr.w) {
          combo++;
          perfectStreakTotal++;
          towerHeight++;
          score += 3;
          sound.playPerfect(combo);
          spawnConfetti(top.x + top.w / 2, curr.y + curr.h / 2);
          spawnFloatingText('WIDE BONUS! +3', top.x + top.w / 2, curr.y - 10, '#ffd700');
          stack.push({
            x: top.x,
            y: curr.y,
            w: top.w,
            h: curr.h,
            color: curr.color,
            faceType: curr.faceType,
            bounce: 1.0,
            bounceVel: 0
          });
          if (perfectStreakTotal % 6 === 0 && hearts < 3) {
            hearts++;
            spawnFloatingText('+1 ❤️ HEART', top.x + top.w / 2, curr.y - 40, '#ff5d8f');
          }
          updateScoreUI(true);
          updateComboUI();
          activeBlock = null;
          spawnNextBlock();
          return;
        }

        let newX = curr.x;
        let newW = curr.w;
        const maxAllowedW = Math.min(240, width * 0.64);

        if (absDiff <= PERFECT_TOLERANCE) {
          // Perfect drop!
          combo++;
          newX = top.x;
          newW = top.w;

          // Slightly widen on combo streak
          if (combo >= 2 && newW < maxAllowedW) {
            newW = Math.min(maxAllowedW, newW + WIDEN_BONUS);
            newX = Math.max(16, Math.min(width - newW - 16, newX - WIDEN_BONUS / 2));
          }

          perfectStreakTotal++;
          towerHeight++;
          const bonusPoints = combo; // Height + combo bonus
          score += 1 + bonusPoints;

          if (perfectStreakTotal % 6 === 0 && hearts < 3) {
            hearts++;
            spawnFloatingText('+1 ❤️ HEART', top.x + top.w / 2, curr.y - 40, '#ff5d8f');
          }
          if (combo === 4) {
            spawnFloatingText('SLOW-MO STREAK!', top.x + top.w / 2, curr.y - 64, '#00bbf9');
          }

          sound.playPerfect(combo);
          spawnConfetti(newX + newW / 2, curr.y + curr.h / 2);
          spawnFloatingText(
            combo > 1 ? `PERFECT! +${1 + bonusPoints}` : 'PERFECT! +2',
            newX + newW / 2,
            curr.y - 10,
            '#ffbe0b'
          );
        } else {
          // Partial overlap: slice overhang off
          combo = 0;
          if (diff > 0) {
            // Overhang on the right
            newX = curr.x;
            newW = top.x + top.w - curr.x;
            const sliceW = curr.w - newW;
            fallingSlices.push({
              x: newX + newW,
              y: curr.y,
              w: sliceW,
              h: curr.h,
              vx: 65,
              vy: -30,
              vRot: 3.2,
              rot: 0,
              color: curr.color
            });
          } else {
            // Overhang on the left
            newX = top.x;
            newW = curr.x + curr.w - top.x;
            const sliceW = curr.w - newW;
            fallingSlices.push({
              x: curr.x,
              y: curr.y,
              w: sliceW,
              h: curr.h,
              vx: -65,
              vy: -30,
              vRot: -3.2,
              rot: 0,
              color: curr.color
            });
          }

          // If block became too tiny to see, spend a heart or end gracefully
          if (newW < 10) {
            if (hearts > 0) {
              hearts--;
              combo = 0;
              towerHeight++;
              score += 1;
              spawnFloatingText('RESCUED! ❤️', top.x + top.w / 2, curr.y - 10, '#ff5d8f');
              stack.push({
                x: top.x,
                y: curr.y,
                w: Math.max(top.w * 0.6, 60),
                h: curr.h,
                color: curr.color,
                faceType: curr.faceType,
                bounce: 1.0,
                bounceVel: 0
              });
              updateScoreUI(true);
              updateComboUI();
              activeBlock = null;
              spawnNextBlock();
              return;
            }
            activeBlock = null;
            window.triggerGameOver();
            return;
          }

          towerHeight++;
          score += 1;
          sound.playDrop(towerHeight);
          spawnFloatingText('+1', newX + newW / 2, curr.y - 8, '#ffffff');
        }

        // Add landed block with squash-and-stretch bounce
        stack.push({
          x: newX,
          y: curr.y,
          w: newW,
          h: curr.h,
          color: curr.color,
          faceType: curr.faceType,
          bounce: 1.0,
          bounceVel: 0
        });

        if (score > bestScore) {
          bestScore = score;
          saveBestScore(bestScore);
        }

        updateScoreUI(true);
        updateComboUI();
        spawnNextBlock();
      }

      // --- Named Global Game Over Function ---
      function triggerGameOver() {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        activeBlock = null;

        sound.stopMusic();
        sound.playGameOver();

        if (score > bestScore) {
          bestScore = score;
          saveBestScore(bestScore);
        }

        finalScoreEl.textContent = score;
        bestScoreEl.textContent = bestScore;
        startBestEl.textContent = bestScore;

        if (score >= 30) {
          gameoverMsgEl.textContent = 'Super Star Master Builder!';
        } else if (score >= 15) {
          gameoverMsgEl.textContent = 'Amazing sky-high tower!';
        } else {
          gameoverMsgEl.textContent = 'Nice try! Stack again!';
        }

        gameoverScreen.classList.remove('hidden');
      }

      window.triggerGameOver = triggerGameOver;

      // --- Start / Restart Flow ---
      function startGame() {
        sound.init();
        startScreen.classList.add('hidden');
        gameoverScreen.classList.add('hidden');
        resetGame();
        gameState = 'PLAYING';
        sound.startMusic();
      }

      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
      });

      restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
      });

      // --- Input Controls (Touch, Mouse, Keyboard) ---
      function handleActionInput(e) {
        if (e && e.target && (e.target.closest('#mute-btn') || e.target.closest('button'))) {
          return;
        }
        if (gameState === 'START') {
          startGame();
        } else if (gameState === 'PLAYING') {
          dropActiveBlock();
        }
      }

      window.addEventListener('pointerdown', (e) => {
        handleActionInput(e);
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          if (gameState === 'START' || gameState === 'GAMEOVER') {
            startGame();
          } else if (gameState === 'PLAYING') {
            dropActiveBlock();
          }
        }
      });

      // --- Drawing Helpers ---
      function drawRoundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function drawCloud(c) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.fillStyle = c.tint || `rgba(255, 255, 255, ${c.alpha})`;
        ctx.globalAlpha = c.tint ? c.alpha : 1;

        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.arc(24, -6, 22, 0, Math.PI * 2);
        ctx.arc(46, 2, 18, 0, Math.PI * 2);
        ctx.arc(-22, 4, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCuteBlock(b, isMoving) {
        ctx.save();

        // Squash & stretch bounce transform
        const bounceOffset = b.bounce ? Math.sin(b.bounce * Math.PI) * 5 : 0;
        const scaleX = b.bounce ? 1 + Math.sin(b.bounce * Math.PI) * 0.06 : 1;
        const scaleY = b.bounce ? 1 - Math.sin(b.bounce * Math.PI) * 0.06 : 1;

        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2 + bounceOffset;

        ctx.translate(cx, cy);
        ctx.scale(scaleX, scaleY);

        const x = -b.w / 2;
        const y = -b.h / 2;

        // Soft drop shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        drawRoundedRect(x + 2, y + 5, b.w, b.h, 12);
        ctx.fill();

        // Main chunky body
        ctx.fillStyle = b.color.fill;
        drawRoundedRect(x, y, b.w, b.h, 12);
        ctx.fill();

        // Top glossy highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        drawRoundedRect(x + 4, y + 3, Math.max(0, b.w - 8), 8, 4);
        ctx.fill();

        // Border
        ctx.lineWidth = 3;
        ctx.strokeStyle = b.color.border;
        drawRoundedRect(x, y, b.w, b.h, 12);
        ctx.stroke();

        // Cute Face (only if block is wide enough)
        if (b.w >= 44) {
          const eyeOffset = Math.min(18, b.w * 0.22);
          const eyeY = -2;
          const featureColor = b.color.lightFace ? '#ffffff' : '#2b2d42';

          // Rosy cheeks
          ctx.fillStyle = b.color.cheek;
          ctx.globalAlpha = 0.55;
          ctx.beginPath();
          ctx.arc(-eyeOffset - 6, eyeY + 6, 4.5, 0, Math.PI * 2);
          ctx.arc(eyeOffset + 6, eyeY + 6, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;

          // Eyes
          ctx.fillStyle = featureColor;
          if (b.faceType === 1 && !isMoving) {
            // Happy wink arcs
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = featureColor;
            ctx.beginPath();
            ctx.arc(-eyeOffset, eyeY + 1, 4, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(eyeOffset, eyeY + 1, 4, Math.PI, 0);
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(-eyeOffset, eyeY, 4, 0, Math.PI * 2);
            ctx.arc(eyeOffset, eyeY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Eye sparkle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-eyeOffset - 1.2, eyeY - 1.2, 1.5, 0, Math.PI * 2);
            ctx.arc(eyeOffset - 1.2, eyeY - 1.2, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Cute Smile
          ctx.strokeStyle = featureColor;
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (isMoving) {
            // Excited 'o' mouth while sliding
            ctx.arc(0, eyeY + 6, 3, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.arc(0, eyeY + 3, 5, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      // --- Main Update & Render Loop ---
      function update(dt) {
        // Drift clouds
        for (let i = 0; i < clouds.length; i++) {
          const c = clouds[i];
          c.x += c.speed * dt;
          if (c.x - 60 > width) {
            c.x = -80;
          }
        }

        // Sky zone banner when the tower reaches a new zone
        const zi = Math.min(SKY_ZONES.length - 1, Math.floor(score / ZONE_HEIGHT));
        if (zi !== curZoneIdx && gameState === 'PLAYING') {
          curZoneIdx = zi;
          floatingTexts.push({ x: width / 2, y: 140 - cameraY, text: SKY_ZONES[zi].name + '!', color: '#ffffff', life: 1.4 });
        }

        // Bird flocks
        const sky = skyState();
        birdTimer -= dt * Math.max(0.05, sky.birds);
        if (birdTimer <= 0) {
          spawnFlock();
          birdTimer = 4 + Math.random() * 5;
        }
        for (let i = birds.length - 1; i >= 0; i--) {
          const f = birds[i];
          f.x += f.speed * dt;
          f.y += Math.sin(f.x * 0.01) * 12 * dt;
          for (let j = 0; j < f.birds.length; j++) f.birds[j].ph += dt * 9;
          if ((f.speed > 0 && f.x - 120 > width) || (f.speed < 0 && f.x + 160 < 0)) {
            birds.splice(i, 1);
          }
        }

        // Smooth camera vertical follow
        cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 8);

        // Update sliding block
        if (gameState === 'PLAYING' && activeBlock) {
          activeBlock.x += activeBlock.vx * dt;
          const leftBound = 12;
          const rightBound = width - activeBlock.w - 12;

          if (activeBlock.x <= leftBound) {
            activeBlock.x = leftBound;
            activeBlock.vx = Math.abs(activeBlock.vx);
          } else if (activeBlock.x >= rightBound) {
            activeBlock.x = rightBound;
            activeBlock.vx = -Math.abs(activeBlock.vx);
          }
        }

        // Update block landing bounce
        for (let i = 0; i < stack.length; i++) {
          if (stack[i].bounce > 0) {
            stack[i].bounce = Math.max(0, stack[i].bounce - dt * 5.5);
          }
        }

        // Update falling overhanging slices
        for (let i = fallingSlices.length - 1; i >= 0; i--) {
          const s = fallingSlices[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vy += 680 * dt; // Gravity
          s.rot += s.vRot * dt;
          if (s.y + cameraY > height + 120) {
            fallingSlices.splice(i, 1);
          }
        }

        // Update confetti particles
        for (let i = confetti.length - 1; i >= 0; i--) {
          const p = confetti[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 420 * dt;
          p.rot += p.vRot * dt;
          p.life -= dt * 1.15;
          if (p.life <= 0) {
            confetti.splice(i, 1);
          }
        }

        // Update floating bonus text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y -= 45 * dt;
          ft.life -= dt * 1.25;
          if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        // Sky: evolving gradient by tower height
        const sky = skyState();
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, sky.top);
        grad.addColorStop(1, sky.bot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Stars (night & space)
        if (sky.starA > 0.02) {
          const tNow = performance.now() * 0.001;
          for (let i = 0; i < stars.length; i++) {
            const st = stars[i];
            const tw = 0.55 + 0.45 * Math.sin(tNow * 2.2 + st.tw);
            ctx.globalAlpha = sky.starA * tw;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(st.x * width, st.y * height * 0.8, st.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          // Moon
          ctx.fillStyle = '#f4f1de';
          ctx.beginPath();
          ctx.arc(width - 64, 74, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,0.08)';
          ctx.beginPath();
          ctx.arc(width - 72, 68, 6, 0, Math.PI * 2);
          ctx.arc(width - 56, 82, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Sun with soft rays
          ctx.save();
          ctx.translate(width - 64, 74);
          ctx.strokeStyle = 'rgba(255, 224, 102, 0.65)';
          ctx.lineWidth = 4;
          const rt = performance.now() * 0.0004;
          for (let i = 0; i < 8; i++) {
            const a = rt + i * Math.PI / 4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 34, Math.sin(a) * 34);
            ctx.lineTo(Math.cos(a) * 44, Math.sin(a) * 44);
            ctx.stroke();
          }
          ctx.fillStyle = '#ffe066';
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Space planets
        if (sky.space) {
          ctx.save();
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#ff8fa3';
          ctx.beginPath();
          ctx.arc(56, 120, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffd6a5';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(56, 120, 24, 7, -0.35, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#8ecae6';
          ctx.beginPath();
          ctx.arc(width * 0.35, 52, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Bird flocks
        for (let i = 0; i < birds.length; i++) {
          const f = birds[i];
          const dir = f.speed > 0 ? 1 : -1;
          const tint = sky.night ? '#3a4a7a' : (f.hue < 0.5 ? '#2b2d42' : '#5e548e');
          for (let j = 0; j < f.birds.length; j++) {
            const bd = f.birds[j];
            drawBird(f.x + bd.ox * dir, f.y + bd.oy, bd.s, bd.ph, dir, tint);
          }
        }

        // Draw drifting clouds in sky (tinted per zone)
        for (let i = 0; i < clouds.length; i++) {
          const c = clouds[i];
          drawCloud({ x: c.x, y: c.y, scale: c.scale, alpha: c.alpha * sky.cloudA, tint: sky.cloud });
        }

        ctx.save();
        ctx.translate(0, cameraY);

        // Draw grassy pastel hill at base
        const groundY = height - 48;
        ctx.fillStyle = '#95d5b2';
        ctx.beginPath();
        ctx.ellipse(width / 2, groundY + 45, width * 0.75, 70, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#74c69d';
        ctx.fillRect(0, groundY, width, 120);

        // Draw stacked tower blocks (only visible ones for 60fps performance)
        for (let i = 0; i < stack.length; i++) {
          const b = stack[i];
          if (b.y + cameraY > -80 && b.y + cameraY < height + 80) {
            drawCuteBlock(b, false);
          }
        }

        // Draw active sliding block (golden aura on WIDE bonus blocks)
        if (activeBlock) {
          if (activeBlock.wide) {
            ctx.save();
            const ax = activeBlock.x + activeBlock.w / 2;
            const ay = activeBlock.y + activeBlock.h / 2;
            const pulse = 1 + Math.sin(performance.now() * 0.006) * 0.08;
            const aura = ctx.createRadialGradient(ax, ay, 8, ax, ay, activeBlock.w * 0.85 * pulse);
            aura.addColorStop(0, 'rgba(255, 215, 0, 0.55)');
            aura.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(ax, ay, activeBlock.w * 0.85 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          drawCuteBlock(activeBlock, true);
        }

        // Draw falling sliced pieces
        for (let i = 0; i < fallingSlices.length; i++) {
          const s = fallingSlices[i];
          ctx.save();
          ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
          ctx.rotate(s.rot);
          ctx.fillStyle = s.color.fill;
          ctx.strokeStyle = s.color.border;
          ctx.lineWidth = 3;
          drawRoundedRect(-s.w / 2, -s.h / 2, s.w, s.h, 8);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Draw confetti
        for (let i = 0; i < confetti.length; i++) {
          const p = confetti[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }

        // Draw floating feedback texts
        for (let i = 0; i < floatingTexts.length; i++) {
          const ft = floatingTexts[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life);
          ctx.font = '900 22px "Fredoka", "Comic Sans MS", sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#ff5d8f';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        ctx.restore();

        // Rescue hearts (top-left, under the score)
        if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
          ctx.save();
          ctx.font = '26px sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          for (let hi = 0; hi < 3; hi++) {
            ctx.globalAlpha = hi < hearts ? 1 : 0.22;
            ctx.fillText('❤️', 16 + hi * 32, 82);
          }
          ctx.restore();
          // Slow-mo chip while streak reward is active
          if (combo >= 4) {
            ctx.save();
            ctx.globalAlpha = 0.95;
            ctx.fillStyle = '#00bbf9';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(14, 106, 118, 30, 15);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 15px "Fredoka", "Comic Sans MS", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SLOW-MO!', 73, 122);
            ctx.restore();
          }
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;

        try {
          update(dt);
          render();
        } catch (err) {
          // Crash-proof guard
        }

        requestAnimationFrame(loop);
      }

      // Initialize preview tower on start screen and start loop
      resetGame();
      gameState = 'START';
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
