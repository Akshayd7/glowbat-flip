<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fruit Slice Frenzy</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #3e200d;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }
  #uiLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px;
    width: 100%;
  }
  .score-box {
    background: #ffeb3b;
    border: 4px solid #3e200d;
    border-radius: 20px;
    padding: 6px 18px;
    box-shadow: 0 6px 0 #3e200d;
    text-align: left;
    transform: rotate(-2deg);
  }
  .score-val {
    font-size: 32px;
    font-weight: 900;
    color: #e65100;
    line-height: 1;
    text-shadow: 2px 2px 0 #fff;
  }
  .best-val {
    font-size: 13px;
    font-weight: 800;
    color: #5d4037;
    text-transform: uppercase;
  }
  .hud-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-right: 64px;
  }
  .hearts {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.25);
    padding: 6px 12px;
    border-radius: 20px;
    border: 3px solid #3e200d;
  }
  .heart {
    width: 28px;
    height: 28px;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.25s;
    filter: drop-shadow(0 3px 0 #3e200d);
  }
  .heart.lost {
    transform: scale(0.65);
    filter: grayscale(100%) opacity(0.35);
  }
  #muteBtn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #4caf50;
    border: 4px solid #3e200d;
    box-shadow: 0 5px 0 #3e200d;
    cursor: pointer;
    pointer-events: auto;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  #muteBtn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #3e200d;
  }
  #muteBtn.muted {
    background: #f44336;
  }
  #muteBtn svg {
    width: 28px;
    height: 28px;
    fill: #fff;
    stroke: #3e200d;
    stroke-width: 1.5px;
  }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(30, 14, 4, 0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    z-index: 10;
    padding: 20px;
  }
  .overlay.hidden {
    display: none;
  }
  .panel {
    background: #fff8e1;
    border: 6px solid #3e200d;
    border-radius: 32px;
    padding: 32px 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 12px 0 #3e200d, 0 20px 30px rgba(0,0,0,0.5);
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .title {
    font-size: 46px;
    font-weight: 900;
    line-height: 1.05;
    color: #ff3d00;
    text-shadow: -3px -3px 0 #3e200d, 3px -3px 0 #3e200d, -3px 3px 0 #3e200d, 3px 3px 0 #3e200d, 0 7px 0 #3e200d;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .title span {
    color: #ffea00;
    display: block;
    font-size: 52px;
  }
  .subtitle {
    font-size: 17px;
    font-weight: 800;
    color: #5d4037;
    margin-bottom: 24px;
  }
  .fruit-parade {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    font-size: 28px;
  }
  .btn {
    background: linear-gradient(to bottom, #76ff03, #64dd17);
    border: 5px solid #3e200d;
    border-radius: 50px;
    padding: 16px 36px;
    font-size: 26px;
    font-weight: 900;
    color: #3e200d;
    cursor: pointer;
    box-shadow: 0 8px 0 #3e200d;
    transition: transform 0.1s, box-shadow 0.1s;
    display: inline-block;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #3e200d;
  }
  .stats-grid {
    background: #ffecb3;
    border: 4px solid #3e200d;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-around;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
  }
  .stat-label {
    font-size: 14px;
    font-weight: 800;
    color: #795548;
    text-transform: uppercase;
  }
  .stat-num {
    font-size: 36px;
    font-weight: 900;
    color: #d84315;
    text-shadow: 2px 2px 0 #fff;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<button id="muteBtn" aria-label="Toggle Sound">
  <svg id="soundIcon" viewBox="0 0 24 24"></svg>
</button>

<div id="uiLayer">
  <div class="hud">
    <div class="score-box">
      <div class="score-val" id="hudScore">0</div>
      <div class="best-val">BEST: <span id="hudBest">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hearts" id="heartsContainer">
        <svg class="heart" viewBox="0 0 24 24"><path fill="#ff1744" stroke="#3e200d" stroke-width="2.5" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <svg class="heart" viewBox="0 0 24 24"><path fill="#ff1744" stroke="#3e200d" stroke-width="2.5" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <svg class="heart" viewBox="0 0 24 24"><path fill="#ff1744" stroke="#3e200d" stroke-width="2.5" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- Start Screen -->
<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="title">FRUIT SLICE<span>FRENZY!</span></div>
    <div class="subtitle">Swipe to slice juicy fruits!<br>Watch out for sneaky bombs!</div>
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Best Score</span>
        <span class="stat-num" id="startBest">0</span>
      </div>
    </div>
    <button class="btn" id="startBtn">TAP TO PLAY</button>
  </div>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen" class="overlay hidden">
  <div class="panel">
    <div class="title">GAME<span>OVER!</span></div>
    <div class="subtitle" id="gameOverReason">Great slicing!</div>
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span class="stat-num" id="finalScore">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Best</span>
        <span class="stat-num" id="finalBest">0</span>
      </div>
    </div>
    <button class="btn" id="replayBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  // --- STORAGE & STATE ---
  const STORAGE_KEY = "fruitslice_v1";
  let savedData = { best: 0, muted: false };

  function loadStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (typeof parsed.best === "number") savedData.best = parsed.best;
        if (typeof parsed.muted === "boolean") savedData.muted = parsed.muted;
      }
    } catch (e) {
      // Fallback if localStorage is blocked
    }
  }

  function saveStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
    } catch (e) {}
  }

  loadStorage();

  // --- AUDIO ENGINE (WebAudio Procedural) ---
  const Sound = {
    ctx: null,
    musicTimer: null,
    noteIdx: 0,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume().catch(() => {});
      }
    },
    swish() {
      if (savedData.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(550, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.11);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      } catch (e) {}
    },
    splat() {
      if (savedData.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        // Juicy pop
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        const pitch = 260 + Math.random() * 180;
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.14);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      } catch (e) {}
    },
    combo(count) {
      if (savedData.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq * (1 + Math.min(count - 3, 3) * 0.08), now + idx * 0.055);
          gain.gain.setValueAtTime(0.2, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.25);
        });
      } catch (e) {}
    },
    miss() {
      if (savedData.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.22);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    },
    explosion() {
      if (savedData.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.55;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.15));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(750, now);
        filter.frequency.linearRampToValueAtTime(70, now + 0.55);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.55);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      } catch (e) {}
    },
    startMusic() {
      if (this.musicTimer) return;
      const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 392.00];
      this.musicTimer = setInterval(() => {
        if (savedData.muted || !this.ctx || gameState !== "PLAYING") return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          const freq = melody[this.noteIdx % melody.length];
          this.noteIdx++;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } catch (e) {}
      }, 280);
    }
  };

  // --- UI ELEMENTS ---
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const hudScore = document.getElementById("hudScore");
  const hudBest = document.getElementById("hudBest");
  const startBest = document.getElementById("startBest");
  const finalScore = document.getElementById("finalScore");
  const finalBest = document.getElementById("finalBest");
  const gameOverReason = document.getElementById("gameOverReason");
  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const startBtn = document.getElementById("startBtn");
  const replayBtn = document.getElementById("replayBtn");
  const muteBtn = document.getElementById("muteBtn");
  const soundIcon = document.getElementById("soundIcon");
  const heartEls = document.querySelectorAll("#heartsContainer .heart");

  function updateMuteIcon() {
    if (savedData.muted) {
      muteBtn.classList.add("muted");
      soundIcon.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
    } else {
      muteBtn.classList.remove("muted");
      soundIcon.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
    }
  }
  updateMuteIcon();

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    Sound.init();
    savedData.muted = !savedData.muted;
    saveStorage();
    updateMuteIcon();
  });

  // --- CANVAS & BACKDROP ---
  let width = window.innerWidth;
  let height = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let woodCanvas = document.createElement("canvas");

  function buildWoodBackdrop() {
    woodCanvas.width = width;
    woodCanvas.height = height;
    const wctx = woodCanvas.getContext("2d");

    const grad = wctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#8d4e25");
    grad.addColorStop(0.5, "#783f1b");
    grad.addColorStop(1, "#5c2e10");
    wctx.fillStyle = grad;
    wctx.fillRect(0, 0, width, height);

    const plankCount = 7;
    const plankW = width / plankCount;
    for (let i = 0; i < plankCount; i++) {
      const x = i * plankW;
      wctx.fillStyle = i % 2 === 0 ? "rgba(255, 255, 255, 0.03)" : "rgba(0, 0, 0, 0.04)";
      wctx.fillRect(x, 0, plankW, height);

      // Wood grain lines
      wctx.strokeStyle = "rgba(45, 20, 5, 0.14)";
      wctx.lineWidth = 2;
      for (let g = 0; g < 6; g++) {
        wctx.beginPath();
        const gx = x + (g + 0.5) * (plankW / 6);
        wctx.moveTo(gx, 0);
        wctx.bezierCurveTo(gx + 12, height * 0.33, gx - 12, height * 0.66, gx, height);
        wctx.stroke();
      }

      if (i > 0) {
        wctx.strokeStyle = "#3a1b08";
        wctx.lineWidth = 3;
        wctx.beginPath();
        wctx.moveTo(x, 0);
        wctx.lineTo(x, height);
        wctx.stroke();
      }
    }

    // Soft vignette
    const rad = wctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.3, width / 2, height / 2, Math.max(width, height) * 0.75);
    rad.addColorStop(0, "rgba(0,0,0,0)");
    rad.addColorStop(1, "rgba(25,10,0,0.45)");
    wctx.fillStyle = rad;
    wctx.fillRect(0, 0, width, height);
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildWoodBackdrop();
  }
  window.addEventListener("resize", resize);
  resize();

  // --- FRUIT DEFINITIONS ---
  const FRUIT_TYPES = [
    {
      name: "watermelon",
      radius: 44,
      rind: "#2e7d32",
      innerRind: "#c8e6c9",
      flesh: "#ff1744",
      juice: "#ff1744",
      seeds: "#212121",
      points: 1
    },
    {
      name: "orange",
      radius: 36,
      rind: "#ff6d00",
      innerRind: "#fff3e0",
      flesh: "#ffab00",
      juice: "#ff9100",
      segments: true,
      points: 1
    },
    {
      name: "apple",
      radius: 36,
      rind: "#d50000",
      innerRind: "#ffebee",
      flesh: "#fff8e1",
      juice: "#ff5252",
      seeds: "#3e2723",
      leaf: true,
      points: 1
    },
    {
      name: "kiwi",
      radius: 33,
      rind: "#6d4c41",
      innerRind: "#8d6e63",
      flesh: "#76ff03",
      core: "#f1f8e9",
      juice: "#64dd17",
      seeds: "#212121",
      points: 1
    },
    {
      name: "strawberry",
      radius: 32,
      rind: "#e91e63",
      innerRind: "#f8bbd0",
      flesh: "#ff4081",
      juice: "#f50057",
      seeds: "#ffeb3b",
      crown: true,
      points: 2
    },
    {
      name: "lemon",
      radius: 34,
      rind: "#ffd600",
      innerRind: "#fffde7",
      flesh: "#ffff00",
      juice: "#ffea00",
      segments: true,
      points: 1
    }
  ];

  // --- GAME STATE & ARRAYS ---
  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let misses = 0;
  const MAX_MISSES = 3;
  let spawnCooldown = 0;
  let elapsedGameTime = 0;
  let screenShake = 0;

  let fruits = [];
  let halves = [];
  let particles = [];
  let splatters = [];
  let popups = [];
  let slashFlashes = [];
  let bladeTrail = [];

  // Update initial UI
  hudBest.textContent = savedData.best;
  startBest.textContent = savedData.best;

  function updateHeartsUI() {
    heartEls.forEach((el, idx) => {
      if (idx < MAX_MISSES - misses) {
        el.classList.remove("lost");
      } else {
        el.classList.add("lost");
      }
    });
  }

  // --- GLOBAL TRIGGER GAME OVER ---
  function triggerGameOver(reasonText) {
    if (gameState === "GAMEOVER") return;
    gameState = "GAMEOVER";

    if (score > savedData.best) {
      savedData.best = score;
      saveStorage();
    }

    hudBest.textContent = savedData.best;
    startBest.textContent = savedData.best;
    finalScore.textContent = score;
    finalBest.textContent = savedData.best;
    gameOverReason.textContent = reasonText || "Out of lives!";

    gameOverScreen.classList.remove("hidden");
  }
  window.triggerGameOver = triggerGameOver;

  function startGame() {
    Sound.init();
    Sound.startMusic();
    score = 0;
    misses = 0;
    elapsedGameTime = 0;
    spawnCooldown = 0.4;
    screenShake = 0;

    fruits = [];
    halves = [];
    particles = [];
    splatters = [];
    popups = [];
    slashFlashes = [];
    bladeTrail = [];

    hudScore.textContent = "0";
    hudBest.textContent = savedData.best;
    updateHeartsUI();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    gameState = "PLAYING";
  }

  startBtn.addEventListener("click", startGame);
  replayBtn.addEventListener("click", startGame);

  // --- SPAWNING LOGIC ---
  function spawnWave() {
    const difficulty = Math.min(elapsedGameTime / 45, 1);
    const count = 1 + Math.floor(Math.random() * (2 + difficulty * 2.2));
    const bombChance = Math.min(0.08 + difficulty * 0.14, 0.25);

    const gravity = height * 0.95;

    for (let i = 0; i < count; i++) {
      const isBomb = Math.random() < bombChance && (count > 1 || elapsedGameTime > 5);
      const type = isBomb ? null : FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
      const radius = isBomb ? 36 : type.radius;

      const margin = Math.max(radius + 20, width * 0.12);
      const x = margin + Math.random() * (width - margin * 2);
      const y = height + radius + 15 + i * 25;

      const targetX = width * 0.22 + Math.random() * (width * 0.56);
      const peakY = height * (0.14 + Math.random() * 0.28);
      const dy = y - peakY;
      const vy = -Math.sqrt(2 * gravity * dy);
      const flightTime = -vy / gravity;
      const vx = (targetX - x) / flightTime;

      fruits.push({
        x,
        y,
        vx,
        vy,
        gravity,
        radius,
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 5,
        isBomb,
        type,
        sliced: false
      });
    }
  }

  // --- DRAWING HELPERS ---
  function drawFruitGraphic(ctx, type, radius, halfMode) {
    ctx.save();
    if (halfMode !== 0) {
      ctx.beginPath();
      if (halfMode === -1) {
        ctx.rect(-radius - 12, -radius - 12, (radius + 12) * 2, radius + 12);
      } else {
        ctx.rect(-radius - 12, 0, (radius + 12) * 2, radius + 12);
      }
      ctx.clip();
    }

    // Stem / Leaf for whole fruit
    if (halfMode === 0 && type.leaf) {
      ctx.fillStyle = "#5d4037";
      ctx.strokeStyle = "#3e200d";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-4, -radius - 10, 8, 14, 3);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#64dd17";
      ctx.beginPath();
      ctx.ellipse(10, -radius - 6, 11, 6, Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    if (halfMode === 0 && type.crown) {
      ctx.fillStyle = "#4caf50";
      ctx.strokeStyle = "#3e200d";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-16, -radius + 4);
      ctx.lineTo(0, -radius - 8);
      ctx.lineTo(16, -radius + 4);
      ctx.lineTo(0, -radius + 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Outer Rind
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fillStyle = type.rind;
    ctx.fill();
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = "#3e200d";
    ctx.stroke();

    // Inner Rind
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.86, 0, Math.PI * 2);
    ctx.fillStyle = type.innerRind;
    ctx.fill();

    // Juicy Flesh
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.78, 0, Math.PI * 2);
    ctx.fillStyle = type.flesh;
    ctx.fill();

    // Citrus segments
    if (type.segments) {
      ctx.strokeStyle = type.innerRind;
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * radius * 0.78, Math.sin(a) * radius * 0.78);
        ctx.stroke();
      }
    }

    // Kiwi core
    if (type.core) {
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = type.core;
      ctx.fill();
    }

    // Seeds
    if (type.seeds) {
      ctx.fillStyle = type.seeds;
      const seedCount = 8;
      for (let i = 0; i < seedCount; i++) {
        const a = (i * Math.PI * 2) / seedCount + 0.3;
        const r = radius * 0.48;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Glossy Cartoon Shine
    ctx.beginPath();
    ctx.ellipse(-radius * 0.34, -radius * 0.34, radius * 0.25, radius * 0.12, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-radius * 0.12, -radius * 0.52, radius * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
    ctx.fill();

    // Cut line border when split
    if (halfMode !== 0) {
      ctx.beginPath();
      ctx.moveTo(-radius, 0);
      ctx.lineTo(radius, 0);
      ctx.strokeStyle = "#3e200d";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBombGraphic(ctx, radius, time) {
    ctx.save();
    // Fuse cord
    ctx.beginPath();
    ctx.moveTo(0, -radius + 2);
    ctx.quadraticCurveTo(14, -radius - 16, 24, -radius - 10);
    ctx.strokeStyle = "#d7ccc8";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.stroke();

    // Spark
    const sparkR = 6 + Math.sin(time * 28) * 3;
    ctx.beginPath();
    ctx.arc(24, -radius - 10, sparkR, 0, Math.PI * 2);
    ctx.fillStyle = "#ffea00";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(24, -radius - 10, sparkR * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3d00";
    ctx.fill();

    // Bomb cap
    ctx.fillStyle = "#455a64";
    ctx.strokeStyle = "#1c262b";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-9, -radius - 4, 18, 10, 3);
    ctx.fill();
    ctx.stroke();

    // Bomb sphere
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 4, 0, 0, radius);
    grad.addColorStop(0, "#546e7a");
    grad.addColorStop(1, "#263238");
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = "#11171a";
    ctx.stroke();

    // Danger cross icon
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 4.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-9, -9);
    ctx.lineTo(9, 9);
    ctx.moveTo(9, -9);
    ctx.lineTo(-9, 9);
    ctx.stroke();

    // Shine
    ctx.beginPath();
    ctx.ellipse(-radius * 0.35, -radius * 0.35, radius * 0.22, radius * 0.1, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fill();

    ctx.restore();
  }

  // --- SLICING & INTERACTION ---
  let isDragging = false;
  let currentSwipeSlices = 0;

  function distToSegment(px, py, x1, y1, x2, y2) {
    const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
    if (l2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = Math.max(0, Math.min(1, t));
    const projX = x1 + t * (x2 - x1);
    const projY = y1 + t * (y2 - y1);
    return Math.hypot(px - projX, py - projY);
  }

  function spawnJuiceAndSplatter(x, y, color) {
    // Background decal splatter
    if (splatters.length > 28) splatters.shift();
    const blobs = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * 24;
      blobs.push({
        ox: Math.cos(a) * d,
        oy: Math.sin(a) * d,
        r: 6 + Math.random() * 14
      });
    }
    splatters.push({ x, y, color, alpha: 0.55, blobs });

    // Flying juice droplets
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 80 + Math.random() * 280;
      particles.push({
        x,
        y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 60,
        r: 4 + Math.random() * 6,
        color,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8,
        isConfetti: false
      });
    }
  }

  function spawnConfetti(x, y) {
    const colors = ["#ff1744", "#ffea00", "#00e676", "#00b0ff", "#d500f9"];
    for (let i = 0; i < 32; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 120 + Math.random() * 340;
      particles.push({
        x,
        y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 140,
        r: 6 + Math.random() * 5,
        color: colors[i % colors.length],
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 12,
        life: 0.9 + Math.random() * 0.4,
        maxLife: 1.3,
        isConfetti: true
      });
    }
  }

  function sliceFruit(f, slashAngle) {
    f.sliced = true;

    if (f.isBomb) {
      Sound.explosion();
      screenShake = 0.45;
      spawnConfetti(f.x, f.y);
      triggerGameOver("BOOM! You sliced a bomb!");
      return;
    }

    Sound.splat();
    score += f.type.points;
    hudScore.textContent = score;
    currentSwipeSlices++;

    // Comic slash flash line
    slashFlashes.push({
      x: f.x,
      y: f.y,
      angle: slashAngle,
      life: 0.18
    });

    // Score popup
    popups.push({
      x: f.x,
      y: f.y - 15,
      text: "+" + f.type.points,
      color: "#ffea00",
      scale: 1,
      life: 0.75
    });

    // Spawn two spinning halves
    const normalAngle = slashAngle - Math.PI / 2;
    const sepSpeed = 95;
    [-1, 1].forEach((dir) => {
      halves.push({
        x: f.x + Math.cos(normalAngle) * dir * 6,
        y: f.y + Math.sin(normalAngle) * dir * 6,
        vx: f.vx + Math.cos(normalAngle) * dir * sepSpeed,
        vy: f.vy * 0.5 - 60 + Math.sin(normalAngle) * dir * sepSpeed,
        gravity: f.gravity,
        angle: slashAngle,
        vAngle: dir * (3.5 + Math.random() * 3),
        type: f.type,
        radius: f.radius,
        halfMode: dir
      });
    });

    spawnJuiceAndSplatter(f.x, f.y, f.type.juice);
  }

  function checkCombo(x, y) {
    if (currentSwipeSlices >= 3 && gameState === "PLAYING") {
      const bonus = currentSwipeSlices;
      score += bonus;
      hudScore.textContent = score;
      Sound.combo(currentSwipeSlices);
      spawnConfetti(x, y);
      popups.push({
        x: Math.max(90, Math.min(width - 90, x)),
        y: Math.max(90, y - 35),
        text: currentSwipeSlices + "x COMBO! +" + bonus,
        color: "#76ff03",
        scale: 1.35,
        life: 1.1
      });
    }
    currentSwipeSlices = 0;
  }

  function addPointerPoint(x, y) {
    const now = performance.now();
    if (bladeTrail.length > 0) {
      const prev = bladeTrail[bladeTrail.length - 1];
      const dist = Math.hypot(x - prev.x, y - prev.y);
      if (dist > 32 && now - prev.time < 60) {
        Sound.swish();
      }
      if (gameState === "PLAYING" && dist > 2) {
        const slashAngle = Math.atan2(y - prev.y, x - prev.x);
        for (let i = 0; i < fruits.length; i++) {
          const f = fruits[i];
          if (!f.sliced) {
            const d = distToSegment(f.x, f.y, prev.x, prev.y, x, y);
            if (d <= f.radius + 10) {
              sliceFruit(f, slashAngle);
            }
          }
        }
      }
    }
    bladeTrail.push({ x, y, time: now });
  }

  // Pointer Events (Mouse + Touch)
  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || e.target.closest(".panel")) return;
    Sound.init();
    isDragging = true;
    currentSwipeSlices = 0;
    bladeTrail = [];
    addPointerPoint(e.clientX, e.clientY);
  });

  window.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    addPointerPoint(e.clientX, e.clientY);
  });

  function endSwipe(e) {
    if (!isDragging) return;
    isDragging = false;
    const lastPt = bladeTrail[bladeTrail.length - 1] || { x: width / 2, y: height / 2 };
    checkCombo(lastPt.x, lastPt.y);
  }

  window.addEventListener("pointerup", endSwipe);
  window.addEventListener("pointercancel", endSwipe);

  // --- MAIN LOOP ---
  let lastFrameTime = performance.now();

  function updateAndRender(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    ctx.save();
    if (screenShake > 0) {
      screenShake -= dt;
      const mag = screenShake * 28;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }

    // 1. Draw Wooden Backdrop
    ctx.drawImage(woodCanvas, 0, 0, width, height);

    // 2. Draw Juice Splatters on Wood
    for (let i = splatters.length - 1; i >= 0; i--) {
      const s = splatters[i];
      s.alpha -= dt * 0.035;
      if (s.alpha <= 0) {
        splatters.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      for (let b = 0; b < s.blobs.length; b++) {
        const blob = s.blobs[b];
        ctx.beginPath();
        ctx.arc(s.x + blob.ox, s.y + blob.oy, blob.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 3. Game Spawning & Active Fruits
    if (gameState === "PLAYING") {
      elapsedGameTime += dt;
      spawnCooldown -= dt;
      if (spawnCooldown <= 0) {
        spawnWave();
        const minWait = Math.max(0.85, 1.9 - elapsedGameTime * 0.018);
        spawnCooldown = minWait + Math.random() * 0.65;
      }
    }

    // Update & Draw Whole Fruits
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      if (f.sliced) {
        fruits.splice(i, 1);
        continue;
      }

      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += f.gravity * dt;
      f.angle += f.vAngle * dt;

      // Bounce gently off side walls
      if ((f.x < f.radius && f.vx < 0) || (f.x > width - f.radius && f.vx > 0)) {
        f.vx *= -0.75;
      }

      // Check if missed falling down
      if (f.y > height + f.radius + 50 && f.vy > 0) {
        if (!f.isBomb && gameState === "PLAYING") {
          misses++;
          Sound.miss();
          updateHeartsUI();
          popups.push({
            x: Math.max(50, Math.min(width - 50, f.x)),
            y: height - 60,
            text: "MISS!",
            color: "#ff1744",
            scale: 1.1,
            life: 0.75
          });
          if (misses >= MAX_MISSES) {
            triggerGameOver("You missed 3 fruits!");
          }
        }
        fruits.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      if (f.isBomb) {
        drawBombGraphic(ctx, f.radius, elapsedGameTime);
      } else {
        drawFruitGraphic(ctx, f.type, f.radius, 0);
      }
      ctx.restore();
    }

    // 4. Update & Draw Sliced Halves
    for (let i = halves.length - 1; i >= 0; i--) {
      const h = halves[i];
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.vy += h.gravity * dt;
      h.angle += h.vAngle * dt;

      if (h.y > height + h.radius + 60) {
        halves.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.angle);
      drawFruitGraphic(ctx, h.type, h.radius, h.halfMode);
      ctx.restore();
    }

    // 5. Update & Draw Juice & Confetti Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 650 * dt;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = "#3e200d";
      ctx.lineWidth = 2;

      if (p.isConfetti) {
        p.angle += p.vAngle * dt;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
        ctx.strokeRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 6. Comic Slash Flashes
    for (let i = slashFlashes.length - 1; i >= 0; i--) {
      const sf = slashFlashes[i];
      sf.life -= dt;
      if (sf.life <= 0) {
        slashFlashes.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.translate(sf.x, sf.y);
      ctx.rotate(sf.angle);
      ctx.globalAlpha = sf.life / 0.18;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(0, 0, 68, 7 * (sf.life / 0.18), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 7. Blade Trail
    bladeTrail = bladeTrail.filter((pt) => now - pt.time < 130);
    if (bladeTrail.length > 1) {
      ctx.save();
      for (let i = 1; i < bladeTrail.length; i++) {
        const p0 = bladeTrail[i - 1];
        const p1 = bladeTrail[i];
        const ratio = i / bladeTrail.length;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineCap = "round";
        ctx.lineWidth = ratio * 16;
        ctx.strokeStyle = "#00e5ff";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineWidth = ratio * 8;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
      }
      ctx.restore();
    }

    // 8. Floating Popups
    for (let i = popups.length - 1; i >= 0; i--) {
      const pop = popups[i];
      pop.life -= dt;
      if (pop.life <= 0) {
        popups.splice(i, 1);
        continue;
      }
      pop.y -= 55 * dt;
      ctx.save();
      ctx.translate(pop.x, pop.y);
      ctx.scale(pop.scale, pop.scale);
      ctx.font = "900 28px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#3e200d";
      ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, 0, 0);
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(updateAndRender);
  }

  requestAnimationFrame(updateAndRender);
})();
</script>
</body>
</html>
