<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Pop Merge</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: linear-gradient(180deg, #1d70db 0%, #52b2ff 50%, #a8e4ff 75%, #76d343 75%, #43a022 100%);
    font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Comic Sans MS', 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #game-stage {
    position: relative;
    width: 480px;
    height: 820px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 22px;
    box-shadow: 0 18px 45px rgba(10, 35, 65, 0.48), 0 0 0 5px #382110;
  }

  /* Round Glossy Golden-Yellow Mute Button Top-Right */
  #mute-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #fff8b8 0%, #ffd426 48%, #f29400 100%);
    border: 4.5px solid #382110;
    box-shadow: 
      0 5px 0 #382110,
      0 9px 16px rgba(0,0,0,0.3),
      inset 0 5px 0 rgba(255,255,255,0.85),
      inset 0 -4px 0 rgba(180, 85, 0, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 200;
    transition: transform 0.1s ease;
  }

  #mute-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #382110, inset 0 3px 0 rgba(255,255,255,0.7);
  }

  #mute-btn svg {
    width: 30px;
    height: 30px;
    fill: #382110;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.65));
  }

  /* Overlay Screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(18, 42, 72, 0.58);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    transition: opacity 0.25s ease;
    border-radius: 22px;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Kawaii Meadow Wooden Plank Modal */
  .modal-card {
    width: 392px;
    background: 
      linear-gradient(180deg, rgba(255,245,220,0.25) 0%, rgba(0,0,0,0.12) 100%),
      repeating-linear-gradient(
        0deg,
        #e29b52 0px,
        #d6893e 50px,
        #96521b 50px,
        #96521b 55px,
        #cc7d35 55px,
        #c0702b 108px
      );
    border-radius: 34px;
    border: 6px solid #382110;
    box-shadow: 
      0 12px 0 #382110,
      0 22px 42px rgba(0, 0, 0, 0.52),
      inset 0 7px 0 rgba(255, 242, 210, 0.7),
      inset 0 -8px 0 rgba(85, 40, 8, 0.7);
    padding: 30px 26px 34px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    animation: popIn 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.55); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .game-title {
    font-size: 48px;
    line-height: 1.02;
    font-weight: 900;
    color: #ffe135;
    -webkit-text-stroke: 3px #382110;
    text-shadow: 
      -3px -3px 0 #382110,
       3px -3px 0 #382110,
      -3px  3px 0 #382110,
       3px  3px 0 #382110,
       0px  7px 0 #382110;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 18px;
    color: #fffdf5;
    font-weight: 900;
    text-shadow: 
      -2px -2px 0 #382110,
       2px -2px 0 #382110,
      -2px  2px 0 #382110,
       2px  2px 0 #382110,
       0px  3px 0 #382110;
    margin-bottom: 18px;
  }

  .fruit-parade {
    display: flex;
    gap: 7px;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #fffdf9 0%, #f7e8d0 100%);
    border: 4.5px solid #382110;
    box-shadow: inset 0 4px 0 rgba(0,0,0,0.1), 0 4px 0 rgba(0,0,0,0.22);
    border-radius: 24px;
    padding: 13px 12px;
    margin-bottom: 24px;
    width: 100%;
  }

  .parade-dot {
    border-radius: 50%;
    border: 2.5px solid #382110;
    box-shadow: 
      inset -2px -3px 0 rgba(0,0,0,0.22),
      inset 2px 3px 0 rgba(255,255,255,0.8);
  }

  .btn-primary {
    background: linear-gradient(180deg, #a8f542 0%, #68d325 45%, #3a9c10 100%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 900;
    padding: 15px 42px;
    border-radius: 50px;
    border: 5.5px solid #382110;
    box-shadow: 
      0 8px 0 #382110,
      0 14px 22px rgba(0, 0, 0, 0.38),
      inset 0 5px 0 rgba(255,255,255,0.8),
      inset 0 -4px 0 rgba(20, 80, 0, 0.45);
    cursor: pointer;
    -webkit-text-stroke: 1.5px #382110;
    text-shadow: 
      -2px -2px 0 #382110,
       2px -2px 0 #382110,
      -2px  2px 0 #382110,
       2px  2px 0 #382110,
       0 4px 0 #382110;
    letter-spacing: 1px;
    transition: transform 0.1s;
    animation: pulseBtn 1.5s infinite ease-in-out;
  }

  .btn-primary:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #382110, inset 0 3px 0 rgba(255,255,255,0.6);
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .score-box-group {
    display: flex;
    gap: 14px;
    width: 100%;
    margin: 12px 0 26px;
  }

  .score-card {
    flex: 1;
    background: linear-gradient(180deg, #fffdf7 0%, #f5e4c8 100%);
    border: 4.5px solid #382110;
    box-shadow: 0 5px 0 #382110, inset 0 -4px 0 #dec39d, inset 0 4px 0 #ffffff;
    border-radius: 22px;
    padding: 12px 8px;
  }

  .score-card.best {
    background: linear-gradient(180deg, #fffbe0 0%, #ffe680 100%);
    box-shadow: 0 5px 0 #382110, inset 0 -4px 0 #e6ac40, inset 0 4px 0 #ffffff;
  }

  .score-label {
    font-size: 15px;
    font-weight: 900;
    color: #6f3d16;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .score-card.best .score-label {
    color: #9c4200;
  }

  .score-val {
    font-size: 35px;
    font-weight: 900;
    color: #ffe135;
    text-shadow: 
      -2px -2px 0 #382110,
       2px -2px 0 #382110,
      -2px  2px 0 #382110,
       2px  2px 0 #382110,
       0 3px 0 #382110;
  }

  .score-card.best .score-val {
    color: #ffaa00;
  }
</style>
</head>
<body>

<div id="app-wrapper">
  <!-- Round Glossy Golden-Yellow Mute Button Top-Right -->
  <button id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <div id="game-stage">
    <canvas id="game-canvas" width="480" height="820"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
      <div class="modal-card">
        <div class="game-title">BERRY POP<br>MERGE!</div>
        <div class="subtitle">Drop &amp; merge cute kawaii fruits in the jar!</div>
        <div class="fruit-parade">
          <div class="parade-dot" style="width:14px;height:14px;background:radial-gradient(circle at 35% 30%, #ff859c, #e0113d);"></div>
          <div class="parade-dot" style="width:18px;height:18px;background:radial-gradient(circle at 35% 30%, #ff9ebb, #f22e62);"></div>
          <div class="parade-dot" style="width:22px;height:22px;background:radial-gradient(circle at 35% 30%, #ffea61, #ff8400);"></div>
          <div class="parade-dot" style="width:26px;height:26px;background:radial-gradient(circle at 35% 30%, #90b8ff, #3858d6);"></div>
          <div class="parade-dot" style="width:30px;height:30px;background:radial-gradient(circle at 35% 30%, #ffc8dd, #ff5d8f);"></div>
          <div class="parade-dot" style="width:34px;height:34px;background:radial-gradient(circle at 35% 30%, #ff7582, #cc1429);"></div>
          <div class="parade-dot" style="width:38px;height:38px;background:radial-gradient(circle at 35% 30%, #fff394, #f59000);"></div>
          <div class="parade-dot" style="width:42px;height:42px;background:radial-gradient(circle at 35% 30%, #c7f9cc, #48b868);"></div>
          <div class="parade-dot" style="width:48px;height:48px;background:radial-gradient(circle at 35% 30%, #9ef01a, #1f7a34);"></div>
        </div>
        <button id="start-btn" class="btn-primary">TAP TO PLAY</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="modal-card">
        <div class="game-title" style="font-size:44px;">GAME OVER</div>
        <div class="subtitle" style="margin-bottom:6px;">The jar is overflowing!</div>
        <div class="score-box-group">
          <div class="score-card">
            <div class="score-label">Score</div>
            <div id="final-score" class="score-val">0</div>
          </div>
          <div class="score-card best">
            <div class="score-label">Best</div>
            <div id="final-best" class="score-val">0</div>
          </div>
        </div>
        <button id="replay-btn" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ==========================================
     CONFIGURATION & KAWAII FRUIT LADDER
  ========================================== */
  const STORAGE_KEY = "berrypop_v1";
  const MUTE_KEY = "berrypop_mute_v1";

  const STAGE_W = 480;
  const STAGE_H = 820;
  const OUTLINE_COLOR = "#382110"; // Soft dark warm brown-black cartoon outline

  // Jar boundaries (Unchanged physics dimensions)
  const JAR = {
    x: 45,
    y: 195,
    w: 390,
    h: 565,
    wall: 12,
    bottomRadius: 38,
    dangerY: 225,
    dropY: 148
  };

  // 9 Kawaii Cartoon Fruit Tiers
  // Ladder order: Cherry < Strawberry < Orange < Blueberry < Peach < Apple < Pineapple < Melon < Watermelon
  // (Preserves watermelon > melon > apple > peach > blueberry > orange)
  const FRUITS = [
    {
      name: "Cherry",
      radius: 20,
      color: "#ff2247",
      gradTop: "#ff8fa3",
      gradMid: "#ff2247",
      gradBot: "#b00024",
      rimLight: "#ffd6df",
      score: 2,
      faceScale: 0.68,
      winks: false
    },
    {
      name: "Strawberry",
      radius: 28,
      color: "#ff4772",
      gradTop: "#ffa6bd",
      gradMid: "#ff3d6b",
      gradBot: "#c20c3c",
      rimLight: "#ffe5ec",
      score: 4,
      faceScale: 0.80,
      winks: true
    },
    {
      name: "Orange",
      radius: 38,
      color: "#ff9100",
      gradTop: "#ffea70",
      gradMid: "#ff8c00",
      gradBot: "#cc5200",
      rimLight: "#fff5ba",
      score: 8,
      faceScale: 0.94,
      winks: false
    },
    {
      name: "Blueberry",
      radius: 49,
      color: "#4361ee",
      gradTop: "#9bf6ff",
      gradMid: "#4868f5",
      gradBot: "#242f9b",
      rimLight: "#caf0f8",
      score: 16,
      faceScale: 1.08,
      winks: false
    },
    {
      name: "Peach",
      radius: 61,
      color: "#ff759f",
      gradTop: "#ffe5ec",
      gradMid: "#ff7aa2",
      gradBot: "#d62865",
      rimLight: "#fff0f5",
      score: 32,
      faceScale: 1.22,
      winks: true
    },
    {
      name: "Apple",
      radius: 75,
      color: "#e6192e",
      gradTop: "#ff7582",
      gradMid: "#e6192e",
      gradBot: "#8c0014",
      rimLight: "#ffccd2",
      score: 64,
      faceScale: 1.38,
      winks: false
    },
    {
      name: "Pineapple",
      radius: 90,
      color: "#ffbe0b",
      gradTop: "#fff899",
      gradMid: "#ffbe0b",
      gradBot: "#cf6a00",
      rimLight: "#fffacc",
      score: 128,
      faceScale: 1.56,
      winks: true
    },
    {
      name: "Melon",
      radius: 107,
      color: "#57cc99",
      gradTop: "#d8f3dc",
      gradMid: "#57cc99",
      gradBot: "#226f54",
      rimLight: "#e9fceb",
      score: 256,
      faceScale: 1.76,
      winks: false
    },
    {
      name: "Watermelon",
      radius: 126,
      color: "#2b9348",
      gradTop: "#aacc00",
      gradMid: "#2b9348",
      gradBot: "#004b23",
      rimLight: "#d9f99d",
      score: 512,
      faceScale: 2.02,
      winks: false
    }
  ];

  /* ==========================================
     STATE VARIABLES
  ========================================== */
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const gameStage = document.getElementById("game-stage");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const startBtn = document.getElementById("start-btn");
  const replayBtn = document.getElementById("replay-btn");
  const muteBtn = document.getElementById("mute-btn");
  const iconSoundOn = document.getElementById("icon-sound-on");
  const iconSoundOff = document.getElementById("icon-sound-off");
  const finalScoreEl = document.getElementById("final-score");
  const finalBestEl = document.getElementById("final-best");

  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let displayScore = 0;
  let bestScore = 0;
  let isMuted = false;

  let fruits = [];
  let particles = [];
  let floatingTexts = [];
  let confetti = [];
  let bgClouds = [];
  let butterflies = [];
  let impactRings = [];
  let dustPuffs = [];

  let currentFruitType = 0;
  let nextFruitType = 0;
  let dropperX = STAGE_W / 2;
  let targetDropperX = STAGE_W / 2;
  let canDrop = true;
  let dropCooldown = 0;
  let dangerTimer = 0; // seconds fruits stay above top line
  let nextFruitId = 1;
  let stageScale = 1;
  let windmillAngle = 0;

  /* ==========================================
     LOCAL STORAGE HELPERS (CRASH-PROOF)
  ========================================== */
  function loadStorage() {
    try {
      const savedBest = localStorage.getItem(STORAGE_KEY);
      if (savedBest !== null) {
        bestScore = parseInt(savedBest, 10) || 0;
      }
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedMute !== null) {
        isMuted = savedMute === "1";
      }
    } catch (e) {
      bestScore = 0;
    }
    updateMuteUI();
  }

  function saveBestScore() {
    try {
      localStorage.setItem(STORAGE_KEY, String(bestScore));
    } catch (e) {}
  }

  function saveMuteState() {
    try {
      localStorage.setItem(MUTE_KEY, isMuted ? "1" : "0");
    } catch (e) {}
  }

  /* ==========================================
     WEBAUDIO SYNTHESIS & BACKGROUND MUSIC
  ========================================== */
  let audioCtx = null;
  let bgmTimer = null;
  let bgmStep = 0;

  const MELODY_NOTES = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 587.33
  ];

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playDropSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) {}
  }

  function playMergeSound(tier) {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const baseFreq = 320 + tier * 55;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.75, now + 0.14);
      gain1.gain.setValueAtTime(0.24, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.17);

      if (tier >= 3) {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.06);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.28);
        gain2.gain.setValueAtTime(0.16, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.31);
      }
    } catch (e) {}
  }

  function playGameOverSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const notes = [440, 392, 349.23, 293.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.15);
        gain.gain.setValueAtTime(0.2, now + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.15);
        osc.stop(now + idx * 0.15 + 0.26);
      });
    } catch (e) {}
  }

  function startSoftMusic() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (isMuted || gameState !== "PLAYING" || !audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const freq = MELODY_NOTES[bgmStep % MELODY_NOTES.length];
        bgmStep++;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.038, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }, 380);
  }

  function updateMuteUI() {
    if (isMuted) {
      iconSoundOn.style.display = "none";
      iconSoundOff.style.display = "block";
    } else {
      iconSoundOn.style.display = "block";
      iconSoundOff.style.display = "none";
    }
  }

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    ensureAudio();
    isMuted = !isMuted;
    updateMuteUI();
    saveMuteState();
  });

  /* ==========================================
     GLOBAL GAME OVER FUNCTION (REQUIRED)
  ========================================== */
  function triggerGameOver() {
    if (gameState === "GAMEOVER") return;
    gameState = "GAMEOVER";
    playGameOverSound();

    if (score > bestScore) {
      bestScore = score;
      saveBestScore();
    }

    finalScoreEl.textContent = String(score);
    finalBestEl.textContent = String(bestScore);
    gameoverScreen.classList.remove("hidden");
  }
  window.triggerGameOver = triggerGameOver;

  /* ==========================================
     GAMEPLAY & PHYSICS INITIALIZATION
  ========================================== */
  function initMeadowScene() {
    bgClouds = [
      { x: 75, y: 125, scale: 0.95, speed: 0.16 },
      { x: 265, y: 88, scale: 1.15, speed: 0.11 },
      { x: 420, y: 162, scale: 0.82, speed: 0.20 },
      { x: 165, y: 215, scale: 0.70, speed: 0.14 }
    ];

    butterflies = [
      { x: 60, baseY: 310, vx: 0.45, phase: 0.5, color1: "#ff85a1", color2: "#ffea00", scale: 0.85 },
      { x: 430, baseY: 260, vx: -0.38, phase: 2.1, color1: "#72efdd", color2: "#ff9f1c", scale: 0.78 },
      { x: 35, baseY: 510, vx: 0.32, phase: 4.0, color1: "#ffd166", color2: "#ff477e", scale: 0.80 }
    ];
  }

  function randomSpawnFruitType() {
    const weights = [0.38, 0.32, 0.20, 0.10];
    const r = Math.random();
    let sum = 0;
    for (let i = 0; i < weights.length; i++) {
      sum += weights[i];
      if (r <= sum) return i;
    }
    return 0;
  }

  function resetGame() {
    ensureAudio();
    startSoftMusic();

    fruits = [];
    particles = [];
    floatingTexts = [];
    confetti = [];
    impactRings = [];
    dustPuffs = [];
    score = 0;
    displayScore = 0;
    dangerTimer = 0;
    canDrop = true;
    dropCooldown = 0;
    dropperX = STAGE_W / 2;
    targetDropperX = STAGE_W / 2;

    currentFruitType = randomSpawnFruitType();
    nextFruitType = randomSpawnFruitType();

    gameState = "PLAYING";
    startScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
  }

  function clampDropperX(x, type) {
    const r = FRUITS[type].radius;
    const minX = JAR.x + JAR.wall + r + 2;
    const maxX = JAR.x + JAR.w - JAR.wall - r - 2;
    return Math.max(minX, Math.min(maxX, x));
  }

  function spawnFruit(x, y, type, isMerged) {
    const def = FRUITS[type];
    const fruit = {
      id: nextFruitId++,
      type: type,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 0.6,
      vy: isMerged ? -2.2 : 1.5,
      radius: def.radius,
      angle: 0,
      va: 0,
      scaleX: isMerged ? 1.42 : 0.84,
      scaleY: isMerged ? 0.64 : 1.20,
      vScaleX: 0,
      vScaleY: 0,
      blinkTimer: 100 + Math.random() * 240,
      happyTimer: isMerged ? 0.95 : 0,
      isWinking: def.winks || (isMerged && Math.random() < 0.35),
      hasLanded: isMerged,
      isMerged: !!isMerged,
      age: 0,
      mergedFlag: false
    };
    fruits.push(fruit);
    return fruit;
  }

  function dropCurrentFruit() {
    if (gameState !== "PLAYING" || !canDrop) return;
    ensureAudio();

    const spawnX = clampDropperX(dropperX, currentFruitType);
    spawnFruit(spawnX, JAR.dropY, currentFruitType, false);
    playDropSound();

    canDrop = false;
    dropCooldown = 0.42;

    currentFruitType = nextFruitType;
    nextFruitType = randomSpawnFruitType();
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
  }

  /* ==========================================
     PARTICLES, RINGS & CONFETTI EFFECTS
  ========================================== */
  function createDustPuff(x, y, radius, intensity) {
    const count = Math.min(7, Math.max(3, Math.floor(radius * 0.12)));
    for (let i = 0; i < count; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const spdX = dir * (1.0 + Math.random() * 2.4) * intensity;
      const spdY = -0.4 - Math.random() * 1.2;
      dustPuffs.push({
        x: x + dir * (Math.random() * radius * 0.32),
        y: y,
        vx: spdX,
        vy: spdY,
        r: (5 + Math.random() * 6) * Math.min(1.3, intensity),
        life: 0.30 + Math.random() * 0.16,
        maxLife: 0.46
      });
    }
  }

  function createMergeBurst(x, y, type) {
    const def = FRUITS[type];

    // 1. Soft Glossy Expanding Ring
    impactRings.push({
      x: x,
      y: y,
      r: def.radius * 0.4,
      maxR: def.radius * 2.1,
      color: def.gradTop,
      life: 0.32,
      maxLife: 0.32
    });

    // 2. Kawaii Sparkle Stars & Juice Droplets
    const count = 15 + type * 3;
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const spd = 2.4 + Math.random() * 6.0;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.4,
        r: 4.5 + Math.random() * (4.2 + type * 0.75),
        color: i % 3 === 0 ? "#ffe135" : (i % 2 === 0 ? def.gradTop : "#ffffff"),
        isStar: i % 3 === 0,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.24,
        alpha: 1,
        life: 0.48 + Math.random() * 0.25
      });
    }

    // 3. Floating Score Popup
    floatingTexts.push({
      x: x,
      y: y - 16,
      text: "+" + def.score,
      color: "#ffe135",
      alpha: 1,
      vy: -1.8,
      scale: 1.25
    });

    // 4. Big Merge Confetti
    if (type >= 4) {
      const confettiColors = ["#ff477e", "#ffe135", "#52b788", "#48cae4", "#ff9f1c", "#b5179e"];
      const cCount = type >= 6 ? 48 : 26;
      for (let i = 0; i < cCount; i++) {
        confetti.push({
          x: x,
          y: y - 20,
          vx: (Math.random() - 0.5) * 11.5,
          vy: -4.2 - Math.random() * 7.0,
          w: 9 + Math.random() * 6,
          h: 6 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.26,
          color: confettiColors[i % confettiColors.length],
          life: 1.25 + Math.random() * 0.6
        });
      }
    }
  }

  /* ==========================================
     PHYSICS & MERGE UPDATE STEP
  ========================================== */
  function updatePhysics(dt) {
    const subSteps = 6;
    const gravity = 0.46;
    const innerLeft = JAR.x + JAR.wall;
    const innerRight = JAR.x + JAR.w - JAR.wall;
    const innerBottom = JAR.y + JAR.h - JAR.wall;

    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      f.age += dt;

      // Bouncy squash-and-stretch spring
      const stiffness = 0.24;
      const damping = 0.72;
      f.vScaleX = (f.vScaleX + (1 - f.scaleX) * stiffness) * damping;
      f.vScaleY = (f.vScaleY + (1 - f.scaleY) * stiffness) * damping;
      f.scaleX += f.vScaleX;
      f.scaleY += f.vScaleY;

      if (f.happyTimer > 0) f.happyTimer = Math.max(0, f.happyTimer - dt);

      f.blinkTimer--;
      if (f.blinkTimer < -8) {
        f.blinkTimer = 120 + Math.random() * 220;
      }
    }

    const mergesToProcess = [];

    for (let step = 0; step < subSteps; step++) {
      // 1. Apply forces & move
      for (let i = 0; i < fruits.length; i++) {
        const f = fruits[i];
        f.vy += gravity / subSteps;
        f.vx *= 0.996;
        f.vy *= 0.996;

        f.x += f.vx / subSteps;
        f.y += f.vy / subSteps;
        f.angle += f.va / subSteps;
        f.va *= 0.96;

        // Wall boundaries
        if (f.x - f.radius < innerLeft) {
          f.x = innerLeft + f.radius;
          if (f.vx < -2.4 && step === 0) {
            f.scaleX = 0.86;
            f.scaleY = 1.14;
            createDustPuff(innerLeft + 4, f.y, f.radius * 0.6, 0.65);
          }
          if (f.vx < 0) f.vx = -f.vx * 0.25;
        } else if (f.x + f.radius > innerRight) {
          f.x = innerRight - f.radius;
          if (f.vx > 2.4 && step === 0) {
            f.scaleX = 0.86;
            f.scaleY = 1.14;
            createDustPuff(innerRight - 4, f.y, f.radius * 0.6, 0.65);
          }
          if (f.vx > 0) f.vx = -f.vx * 0.25;
        }

        // Floor boundary
        if (f.y + f.radius > innerBottom) {
          f.y = innerBottom - f.radius;
          if (f.vy > 1.8 && step === 0) {
            const squash = Math.min(0.26, f.vy * 0.024);
            f.scaleX = 1 + squash;
            f.scaleY = 1 - squash;

            if (!f.hasLanded || f.vy > 3.2) {
              f.hasLanded = true;
              createDustPuff(f.x, innerBottom - 2, f.radius, Math.min(1.3, f.vy * 0.2));
            }
          }
          if (f.vy > 0) f.vy = -f.vy * 0.18;
          f.vx *= 0.92;
          f.va = f.vx * 0.015;
        }
      }

      // 2. Circle-to-Circle Collisions
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.mergedFlag) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.mergedFlag) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = a.radius + b.radius;
          const distSq = dx * dx + dy * dy;

          if (distSq < minDist * minDist) {
            if (a.type === b.type) {
              a.mergedFlag = true;
              b.mergedFlag = true;
              mergesToProcess.push({ a, b });
              break;
            }

            const dist = Math.sqrt(distSq) || 0.001;
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            const totalR = a.radius + b.radius;
            const weightA = b.radius / totalR;
            const weightB = a.radius / totalR;

            a.x -= nx * overlap * weightA * 0.85;
            a.y -= ny * overlap * weightA * 0.85;
            b.x += nx * overlap * weightB * 0.85;
            b.y += ny * overlap * weightB * 0.85;

            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const restitution = 0.15;
              const impulse = -(1 + restitution) * velAlongNormal;
              a.vx -= impulse * nx * weightA;
              a.vy -= impulse * ny * weightA;
              b.vx += impulse * nx * weightB;
              b.vy += impulse * ny * weightB;

              const tangentX = -ny;
              const tangentY = nx;
              const slip = rvx * tangentX + rvy * tangentY;
              a.va -= slip * 0.0012;
              b.va += slip * 0.0012;

              if (Math.abs(velAlongNormal) > 3.0 && step === 0) {
                a.scaleX = 1.14; a.scaleY = 0.87;
                b.scaleX = 1.14; b.scaleY = 0.87;

                if (!a.hasLanded || !b.hasLanded || Math.abs(velAlongNormal) > 4.2) {
                  a.hasLanded = true;
                  b.hasLanded = true;
                  const cx = a.x + nx * a.radius;
                  const cy = a.y + ny * a.radius;
                  createDustPuff(cx, cy, Math.min(a.radius, b.radius) * 0.8, 0.75);
                }
              }
            }
          }
        }
      }
    }

    // 3. Execute Merges
    if (mergesToProcess.length > 0) {
      fruits = fruits.filter(f => !f.mergedFlag);

      for (let i = 0; i < mergesToProcess.length; i++) {
        const { a, b } = mergesToProcess[i];
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const nextType = Math.min(FRUITS.length - 1, a.type + 1);

        const gained = FRUITS[nextType].score;
        score += gained;
        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }

        if (a.type < FRUITS.length - 1) {
          const newF = spawnFruit(mx, my, nextType, true);
          newF.x = clampDropperX(newF.x, nextType);
        } else {
          score += 500;
        }

        for (let k = 0; k < fruits.length; k++) {
          const other = fruits[k];
          const d = Math.hypot(other.x - mx, other.y - my);
          if (d < 155) {
            other.happyTimer = Math.max(other.happyTimer, 0.58);
          }
        }

        playMergeSound(nextType);
        createMergeBurst(mx, my, nextType);
      }
    }

    // 4. Check Danger Line (Fruits staying above JAR.dangerY for 2 seconds)
    let anyAboveLine = false;
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      if (f.age > 0.65 && (f.y - f.radius) < JAR.dangerY) {
        anyAboveLine = true;
        break;
      }
    }

    if (anyAboveLine) {
      dangerTimer += dt;
      if (dangerTimer >= 2.0) {
        triggerGameOver();
      }
    } else {
      dangerTimer = Math.max(0, dangerTimer - dt * 2.2);
    }
  }

  function updateEffects(dt) {
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
    dropperX += (targetDropperX - dropperX) * 0.35;

    if (!canDrop) {
      dropCooldown -= dt;
      if (dropCooldown <= 0) {
        canDrop = true;
      }
    }

    if (displayScore < score) {
      displayScore += Math.ceil((score - displayScore) * 0.2);
    }

    // Rotate distant windmill blades
    windmillAngle += dt * 0.75;

    // Drifting fluffy clouds
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      c.x += c.speed;
      if (c.x - 95 > STAGE_W) {
        c.x = -95;
      }
    }

    // Fluttering meadow butterflies
    for (let i = 0; i < butterflies.length; i++) {
      const bf = butterflies[i];
      bf.phase += dt * 7.5;
      bf.x += bf.vx;
      bf.y = bf.baseY + Math.sin(bf.phase * 0.45) * 16;
      if (bf.vx > 0 && bf.x > STAGE_W + 30) bf.x = -30;
      if (bf.vx < 0 && bf.x < -30) bf.x = STAGE_W + 30;
    }

    // Dust puffs
    for (let i = dustPuffs.length - 1; i >= 0; i--) {
      const dp = dustPuffs[i];
      dp.x += dp.vx;
      dp.y += dp.vy;
      dp.vx *= 0.92;
      dp.r += dt * 15;
      dp.life -= dt;
      if (dp.life <= 0) dustPuffs.splice(i, 1);
    }

    // Impact rings
    for (let i = impactRings.length - 1; i >= 0; i--) {
      const ir = impactRings[i];
      ir.life -= dt;
      const progress = 1 - Math.max(0, ir.life / ir.maxLife);
      ir.currentR = ir.r + (ir.maxR - ir.r) * (1 - Math.pow(1 - progress, 3));
      if (ir.life <= 0) impactRings.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22;
      p.rot += p.vRot;
      p.life -= dt;
      p.alpha = Math.max(0, p.life * 2.2);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating score texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.alpha -= dt * 1.1;
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.24;
      c.vx *= 0.98;
      c.rot += c.vRot;
      c.life -= dt;
      if (c.life <= 0) confetti.splice(i, 1);
    }
  }

  /* ==========================================
     VERSION 4 KAWAII MEADOW & WOODEN VINE ART
  ========================================== */
  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawSmallDaisy(ctx, x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    // 6 white petals with soft dark outline
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 2.0;
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI * 2) / 6;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.72, Math.sin(a) * r * 0.72, r * 0.52, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // Golden-yellow center
    ctx.fillStyle = "#ffd60a";
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawVineLeaf(ctx, x, y, angle, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    ctx.fillStyle = "#68d325";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.quadraticCurveTo(0, -6.5, 8, 0);
    ctx.quadraticCurveTo(0, 6.5, -7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawWoodenPlankWithVines(ctx, x, y, w, h, r, withDaisies) {
    ctx.save();

    // Soft cartoon drop shadow
    drawRoundedRect(ctx, x, y + 5, w, h, r);
    ctx.fillStyle = "rgba(35, 18, 5, 0.55)";
    ctx.fill();

    // Warm wood gradient fill
    drawRoundedRect(ctx, x, y, w, h, r);
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, "#f0af68");
    grad.addColorStop(0.18, "#dc8e44");
    grad.addColorStop(0.75, "#b86b25");
    grad.addColorStop(1, "#8c4a12");
    ctx.fillStyle = grad;
    ctx.fill();

    // Clipped wood grain & bevels
    ctx.save();
    ctx.clip();

    // Top warm shine bevel
    ctx.fillStyle = "rgba(255, 245, 220, 0.55)";
    ctx.fillRect(x, y, w, 6);

    // Bottom shadow bevel
    ctx.fillStyle = "rgba(60, 24, 0, 0.4)";
    ctx.fillRect(x, y + h - 7, w, 7);

    // Visible wood grain lines & knots
    ctx.strokeStyle = "rgba(95, 42, 6, 0.36)";
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x - 4, y + h * 0.34);
    ctx.bezierCurveTo(x + w * 0.3, y + h * 0.20, x + w * 0.7, y + h * 0.48, x + w + 4, y + h * 0.32);
    ctx.moveTo(x - 4, y + h * 0.70);
    ctx.bezierCurveTo(x + w * 0.35, y + h * 0.84, x + w * 0.65, y + h * 0.58, x + w + 4, y + h * 0.74);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x + w * 0.80, y + h * 0.52, 7, 4, 0.1, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    // Thick soft dark outline around wooden plank
    drawRoundedRect(ctx, x, y, w, h, r);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Metal nails in the 4 corners
    const nails = [
      [x + 10, y + 10],
      [x + w - 10, y + 10],
      [x + 10, y + h - 10],
      [x + w - 10, y + h - 10]
    ];
    for (let i = 0; i < nails.length; i++) {
      const nx = nails[i][0];
      const ny = nails[i][1];
      ctx.fillStyle = "#94a3b8";
      ctx.beginPath();
      ctx.arc(nx, ny, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(nx - 1, ny - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Green vines & white daisies wrapped around the plank
    if (withDaisies) {
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 3);
      ctx.quadraticCurveTo(x + 26, y - 5, x + 44, y + 4);
      ctx.stroke();
      ctx.strokeStyle = "#52b788";
      ctx.lineWidth = 2.8;
      ctx.stroke();

      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      ctx.moveTo(x + w - 42, y + h - 3);
      ctx.quadraticCurveTo(x + w - 24, y + h + 5, x + w - 8, y + h - 4);
      ctx.stroke();
      ctx.strokeStyle = "#52b788";
      ctx.lineWidth = 2.8;
      ctx.stroke();

      drawVineLeaf(ctx, x + 22, y - 2, -0.4, 0.85);
      drawVineLeaf(ctx, x + 38, y + 2, 0.35, 0.8);
      drawVineLeaf(ctx, x + w - 22, y + h + 2, 0.3, 0.85);

      drawSmallDaisy(ctx, x + 15, y + 2, 6.2);
      drawSmallDaisy(ctx, x + w - 15, y + h - 2, 5.8);
    }

    ctx.restore();
  }

  function drawFluffyCloud(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.beginPath();
    ctx.arc(-38, 10, 22, Math.PI * 0.52, Math.PI * 1.48);
    ctx.arc(-14, -10, 29, Math.PI * 1.02, Math.PI * 1.92);
    ctx.arc(22, -5, 25, Math.PI * 1.12, Math.PI * 1.95);
    ctx.arc(45, 11, 19, Math.PI * 1.42, Math.PI * 0.48);
    ctx.closePath();

    const cGrad = ctx.createLinearGradient(0, -35, 0, 28);
    cGrad.addColorStop(0, "#ffffff");
    cGrad.addColorStop(0.75, "#f8fdff");
    cGrad.addColorStop(1, "#d0eeff");
    ctx.fillStyle = cGrad;
    ctx.fill();

    ctx.lineWidth = 4.2;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineJoin = "round";
    ctx.stroke();

    // Glossy white top puff shine
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-14, -14, 15, 0, Math.PI * 2);
    ctx.arc(20, -9, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawDistantWindmill(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Windmill tower body
    ctx.fillStyle = "#fff8eb";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-9, -48);
    ctx.lineTo(9, -48);
    ctx.lineTo(14, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Red domed roof
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.arc(0, -48, 11, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Little arched door & window
    ctx.fillStyle = "#8c4a12";
    ctx.beginPath();
    ctx.arc(0, -8, 5, Math.PI, 0);
    ctx.lineTo(5, 0);
    ctx.lineTo(-5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Rotating windmill sails
    ctx.save();
    ctx.translate(0, -44);
    ctx.rotate(windmillAngle);
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = "#ffdd75";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.rect(-3, -38, 6, 34);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawDistantCottage(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Chimney
    ctx.fillStyle = "#c95b3c";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 3.2;
    ctx.fillRect(10, -44, 8, 18);
    ctx.strokeRect(10, -44, 8, 18);

    // Cozy cottage walls
    ctx.fillStyle = "#fff3d6";
    ctx.beginPath();
    ctx.rect(-22, -26, 44, 26);
    ctx.fill();
    ctx.stroke();

    // Red pitched roof
    ctx.fillStyle = "#ff4d6d";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-28, -24);
    ctx.lineTo(0, -46);
    ctx.lineTo(28, -24);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Round wooden door
    ctx.fillStyle = "#9c5218";
    ctx.beginPath();
    ctx.arc(-6, -10, 6, Math.PI, 0);
    ctx.lineTo(0, 0);
    ctx.lineTo(-12, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Warm glowing window
    ctx.fillStyle = "#ffe135";
    ctx.fillRect(6, -18, 10, 9);

    ctx.restore();
  }

  function drawButterfly(ctx, bf) {
    ctx.save();
    ctx.translate(bf.x, bf.y);
    const dir = bf.vx >= 0 ? 1 : -1;
    ctx.scale(dir * bf.scale, bf.scale);
    ctx.rotate(Math.sin(bf.phase * 0.5) * 0.15);

    const flap = 0.45 + 0.55 * Math.abs(Math.sin(bf.phase));

    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 2.5;

    // Upper wing
    ctx.save();
    ctx.scale(1, flap);
    ctx.fillStyle = bf.color1;
    ctx.beginPath();
    ctx.ellipse(-4, -8, 9, 7, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Lower wing
    ctx.fillStyle = bf.color2;
    ctx.beginPath();
    ctx.ellipse(-7, 4, 6.5, 5.5, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Cute body
    ctx.fillStyle = OUTLINE_COLOR;
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 2.2, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawMeadowFlower(ctx, x, y, scale, petalColor, centerColor) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Stem
    ctx.strokeStyle = "#2b7a18";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(3, 10, 0, 18);
    ctx.stroke();

    // 5 cheerful petals
    ctx.fillStyle = petalColor;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 2.8;
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 2) / 5;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 7.5, Math.sin(a) * 7.5, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // Center
    ctx.fillStyle = centerColor;
    ctx.beginPath();
    ctx.arc(0, 0, 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawPolishedGrassTuft(ctx, x, y, scale, flip) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -scale : scale, scale);

    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.quadraticCurveTo(-26, -18, -35, -27);
    ctx.quadraticCurveTo(-16, -18, -10, -6);
    ctx.quadraticCurveTo(-8, -27, -1, -38);
    ctx.quadraticCurveTo(5, -22, 7, -6);
    ctx.quadraticCurveTo(17, -22, 30, -24);
    ctx.quadraticCurveTo(22, -10, 18, 0);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, -38, 0, 0);
    grad.addColorStop(0, "#b8f53d");
    grad.addColorStop(0.5, "#68d325");
    grad.addColorStop(1, "#2d8a14");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();
    ctx.restore();
  }

  function drawSummerMeadowBackdrop() {
    ctx.save();

    // 1. Deep Blue to Sunny Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, STAGE_H * 0.72);
    skyGrad.addColorStop(0, "#1565c0");
    skyGrad.addColorStop(0.38, "#3898ff");
    skyGrad.addColorStop(0.75, "#8ae0ff");
    skyGrad.addColorStop(1, "#d4f5ff");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);

    // Soft cheerful sunbeams
    ctx.save();
    ctx.translate(STAGE_W * 0.5, JAR.y + 180);
    ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
    for (let i = 0; i < 14; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = (i * Math.PI * 2) / 14;
      const a2 = a1 + Math.PI / 14;
      ctx.arc(0, 0, 680, a1, a2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 2. Fluffy White Clouds
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      drawFluffyCloud(ctx, c.x, c.y, c.scale);
    }

    // 3. Distant Green Rolling Hills with Small Windmill & Cottage
    // Far left hill
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 560);
    ctx.quadraticCurveTo(95, 515, 230, 568);
    ctx.lineTo(230, STAGE_H);
    ctx.closePath();
    ctx.fillStyle = "#78d952";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Small Windmill on far left hill
    drawDistantWindmill(ctx, 25, 542, 0.68);

    // Far right hill
    ctx.beginPath();
    ctx.moveTo(210, STAGE_H);
    ctx.lineTo(210, 575);
    ctx.quadraticCurveTo(370, 512, STAGE_W + 10, 558);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    ctx.fillStyle = "#65c93e";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Small Cottage on far right hill
    drawDistantCottage(ctx, 456, 546, 0.62);

    // Midground Rolling Meadow Hill
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 638);
    ctx.quadraticCurveTo(140, 592, 265, 640);
    ctx.quadraticCurveTo(385, 675, STAGE_W + 10, 622);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    const midHillGrad = ctx.createLinearGradient(0, 600, 0, 730);
    midHillGrad.addColorStop(0, "#88e847");
    midHillGrad.addColorStop(1, "#3a9c18");
    ctx.fillStyle = midHillGrad;
    ctx.fill();
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Foreground Bright Flower Meadow
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 706);
    ctx.quadraticCurveTo(240, 670, STAGE_W + 10, 706);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    const frontMeadowGrad = ctx.createLinearGradient(0, 675, 0, STAGE_H);
    frontMeadowGrad.addColorStop(0, "#a8f542");
    frontMeadowGrad.addColorStop(0.4, "#5ac422");
    frontMeadowGrad.addColorStop(1, "#26730d");
    ctx.fillStyle = frontMeadowGrad;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Colorful Meadow Flowers & Grass Tufts
    drawMeadowFlower(ctx, 18, 665, 0.72, "#ffffff", "#ffd60a");
    drawMeadowFlower(ctx, 462, 658, 0.72, "#ff759f", "#ffd60a");
    drawPolishedGrassTuft(ctx, 26, 724, 0.88, false);
    drawPolishedGrassTuft(ctx, 454, 724, 0.90, true);
    drawMeadowFlower(ctx, 20, 745, 0.80, "#ff4d6d", "#ffe135");
    drawMeadowFlower(ctx, 45, 765, 0.68, "#ffffff", "#ff9f1c");
    drawMeadowFlower(ctx, 460, 748, 0.80, "#72efdd", "#ffe135");
    drawMeadowFlower(ctx, 435, 768, 0.68, "#ffe135", "#ff4d6d");

    // 4. Fluttering Butterflies
    for (let i = 0; i < butterflies.length; i++) {
      drawButterfly(ctx, butterflies[i]);
    }

    ctx.restore();
  }

  /* ==========================================
     VERSION 4 KAWAII CARTOON FRUIT CHARACTERS
  ========================================== */
  function drawFruitCrownAndStem(ctx, radius, type) {
    ctx.save();
    if (type === 0) {
      // Cherry curved stem + cute green leaf
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.78);
      ctx.quadraticCurveTo(6, -radius * 1.48, 15, -radius * 1.6);
      ctx.stroke();

      ctx.strokeStyle = "#68d325";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.translate(8, -radius * 1.32);
      ctx.rotate(0.35);
      ctx.fillStyle = "#68d325";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 6.5, 3.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (type === 1) {
      // Strawberry cute green leafy cap
      ctx.fillStyle = "#5ac422";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3.6;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-15, -radius * 0.78);
      ctx.quadraticCurveTo(-11, -radius * 1.15, -4, -radius * 0.92);
      ctx.quadraticCurveTo(0, -radius * 1.22, 4, -radius * 0.92);
      ctx.quadraticCurveTo(11, -radius * 1.15, 15, -radius * 0.78);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 2 || type === 4 || type === 5) {
      // Orange, Peach, Apple: brown stem + glossy green leaf
      drawRoundedRect(ctx, -3, -radius * 1.16, 6, radius * 0.32, 3);
      ctx.fillStyle = "#8c4a12";
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      ctx.save();
      ctx.translate(9, -radius * 0.96);
      ctx.rotate(-0.3);
      ctx.fillStyle = "#68d325";
      ctx.beginPath();
      ctx.moveTo(-11, 0);
      ctx.quadraticCurveTo(0, -9, 12, 0);
      ctx.quadraticCurveTo(0, 9, -11, 0);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();
      ctx.restore();
    } else if (type === 3) {
      // Blueberry cute 3-point star crown calyx on top
      ctx.fillStyle = "#2d3a8c";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3.5;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-12, -radius * 0.84);
      ctx.lineTo(-7, -radius * 1.12);
      ctx.lineTo(-2, -radius * 0.92);
      ctx.lineTo(0, -radius * 1.16);
      ctx.lineTo(2, -radius * 0.92);
      ctx.lineTo(7, -radius * 1.12);
      ctx.lineTo(12, -radius * 0.84);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 6) {
      // Pineapple cheerful spiky green tuft
      ctx.lineJoin = "round";
      ctx.lineWidth = 4.2;
      ctx.strokeStyle = OUTLINE_COLOR;

      ctx.fillStyle = "#3a9c10";
      ctx.beginPath();
      ctx.moveTo(-24, -radius * 0.80);
      ctx.quadraticCurveTo(-20, -radius * 1.22, -9, -radius * 0.94);
      ctx.quadraticCurveTo(0, -radius * 1.34, 9, -radius * 0.94);
      ctx.quadraticCurveTo(20, -radius * 1.22, 24, -radius * 0.80);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#76d343";
      ctx.beginPath();
      ctx.moveTo(-16, -radius * 0.80);
      ctx.quadraticCurveTo(-11, -radius * 1.15, -4, -radius * 0.90);
      ctx.quadraticCurveTo(0, -radius * 1.25, 4, -radius * 0.90);
      ctx.quadraticCurveTo(11, -radius * 1.15, 16, -radius * 0.80);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 7 || type === 8) {
      // Melon & Watermelon cute curly vine stem
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 8.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.90);
      ctx.bezierCurveTo(-13, -radius * 1.22, 17, -radius * 1.26, 6, -radius * 1.04);
      ctx.stroke();

      ctx.strokeStyle = "#68d325";
      ctx.lineWidth = 4.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawKawaiiFruit(ctx, x, y, radius, type, angle, scaleX, scaleY, isBlinking, isWinking, isExtraHappy) {
    const def = FRUITS[type];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    // 1. Subtle Soft Drop Shadow
    ctx.fillStyle = "rgba(25, 12, 0, 0.22)";
    ctx.beginPath();
    ctx.arc(0, 5, radius, 0, Math.PI * 2);
    ctx.fill();

    // 2. Top Stems / Leaves / Crown
    drawFruitCrownAndStem(ctx, radius, type);

    // 3. Saturated Cheerful Radial Gradient Body
    const grad = ctx.createRadialGradient(
      -radius * 0.30,
      -radius * 0.34,
      radius * 0.08,
      0,
      0,
      radius
    );
    grad.addColorStop(0, def.gradTop);
    grad.addColorStop(0.55, def.gradMid);
    grad.addColorStop(1, def.gradBot);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    // 4. Clipped Fruit Surface Details & Rim Bounce Light
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, radius - 2, 0, Math.PI * 2);
    ctx.clip();

    if (type === 1) {
      // Strawberry cute yellow seeds
      ctx.fillStyle = "#ffe135";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 1.4;
      const seeds = [[-14, -12], [14, -12], [-18, 5], [18, 5], [-10, 17], [10, 17]];
      for (let i = 0; i < seeds.length; i++) {
        ctx.beginPath();
        ctx.ellipse(seeds[i][0], seeds[i][1], 2.1, 3.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    } else if (type === 2) {
      // Orange citrus dimples
      ctx.fillStyle = "rgba(180, 70, 0, 0.26)";
      ctx.beginPath();
      ctx.arc(-radius * 0.58, -radius * 0.16, 2.8, 0, Math.PI * 2);
      ctx.arc(radius * 0.58, -radius * 0.12, 3.0, 0, Math.PI * 2);
      ctx.arc(radius * 0.50, radius * 0.20, 2.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 4) {
      // Peach soft top cleft contour
      ctx.strokeStyle = "rgba(210, 35, 95, 0.28)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-radius * 0.12, -radius * 0.28, radius * 0.62, -0.55 * Math.PI, -0.15 * Math.PI);
      ctx.stroke();
    } else if (type === 6) {
      // Pineapple subtle diamond pattern
      ctx.strokeStyle = "rgba(180, 80, 0, 0.25)";
      ctx.lineWidth = 3.8;
      for (let d = -radius; d <= radius; d += 28) {
        ctx.beginPath();
        ctx.moveTo(d - radius, -radius);
        ctx.lineTo(d + radius, radius);
        ctx.moveTo(d + radius, -radius);
        ctx.lineTo(d - radius, radius);
        ctx.stroke();
      }
    } else if (type === 7) {
      // Melon soft netted stripes
      ctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(-radius * 0.34, 0, radius * 0.90, -0.85, 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(radius * 0.34, 0, radius * 0.90, Math.PI - 0.85, Math.PI + 0.85);
      ctx.stroke();
    } else if (type === 8) {
      // Watermelon dark green stripes
      ctx.strokeStyle = "#004b23";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      for (let sx = -radius * 0.68; sx <= radius * 0.68; sx += radius * 0.45) {
        ctx.beginPath();
        ctx.moveTo(sx, -radius);
        ctx.quadraticCurveTo(sx * 1.25, 0, sx, radius);
        ctx.stroke();
      }
    }

    // Soft bottom inner shading
    ctx.strokeStyle = "rgba(0, 0, 0, 0.20)";
    ctx.lineWidth = radius * 0.14;
    ctx.beginPath();
    ctx.arc(0, -radius * 0.05, radius, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();

    // Luminous bottom-right rim highlight
    ctx.strokeStyle = def.rimLight;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = radius * 0.07;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.90, 0.15 * Math.PI, 0.42 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();

    // 5. Glossy White Shine Highlights (Top-Left)
    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
    ctx.beginPath();
    ctx.ellipse(-radius * 0.35, -radius * 0.38, radius * 0.25, radius * 0.13, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
    ctx.beginPath();
    ctx.arc(-radius * 0.12, -radius * 0.56, radius * 0.065, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 6. Thick Soft Dark Outline Around Fruit
    const outlineW = Math.max(3.8, Math.min(7.5, radius * 0.11));
    ctx.lineWidth = outlineW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.beginPath();
    ctx.arc(0, 0, radius - outlineW * 0.4, 0, Math.PI * 2);
    ctx.stroke();

    // 7. KAWAII CARTOON FACE: Big Round Sparkling Eyes, Pink Blush Cheeks, Open Happy Smile, Some Winking!
    const fs = def.faceScale;
    const eyeSpan = 9.5 * fs;
    const eyeY = -0.5 * fs;
    const eyeR = 5.4 * fs;

    // Pink Blush Cheeks with tiny cute highlight oval
    ctx.fillStyle = "rgba(255, 105, 155, 0.68)";
    ctx.beginPath();
    ctx.ellipse(-eyeSpan * 1.38, eyeY + 5.8 * fs, 5.4 * fs, 3.4 * fs, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeSpan * 1.38, eyeY + 5.8 * fs, 5.4 * fs, 3.4 * fs, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- LEFT EYE ---
    if (isBlinking || isExtraHappy) {
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.4, 3.0 * fs);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-eyeSpan, eyeY + 1 * fs, eyeR * 0.85, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else {
      // Big round dark kawaii eye with multiple sparkling catchlights
      ctx.fillStyle = "#261208";
      ctx.beginPath();
      ctx.arc(-eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fill();

      // Big top-left sparkle
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-eyeSpan - eyeR * 0.30, eyeY - eyeR * 0.30, eyeR * 0.42, 0, Math.PI * 2);
      ctx.fill();

      // Small bottom-right sparkle
      ctx.beginPath();
      ctx.arc(-eyeSpan + eyeR * 0.32, eyeY + eyeR * 0.32, eyeR * 0.20, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- RIGHT EYE (Winking or Sparkling!) ---
    if (isBlinking || isExtraHappy || isWinking) {
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.4, 3.0 * fs);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      // Cute happy wink (> or curved arch)
      ctx.arc(eyeSpan, eyeY + 1.2 * fs, eyeR * 0.85, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#261208";
      ctx.beginPath();
      ctx.arc(eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(eyeSpan - eyeR * 0.30, eyeY - eyeR * 0.30, eyeR * 0.42, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(eyeSpan + eyeR * 0.32, eyeY + eyeR * 0.32, eyeR * 0.20, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tiny cute arched kawaii eyebrows above eyes
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = Math.max(1.8, 2.1 * fs);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(-eyeSpan, eyeY - eyeR * 1.15, eyeR * 0.65, Math.PI * 1.2, Math.PI * 1.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(eyeSpan, eyeY - eyeR * 1.15, eyeR * 0.65, Math.PI * 1.2, Math.PI * 1.8);
    ctx.stroke();

    // --- OPEN HAPPY KAWAII SMILE ---
    const mouthY = eyeY + 4.2 * fs;
    const mouthR = (isExtraHappy ? 6.8 : 5.6) * fs;

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, mouthY, mouthR, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = "#7a1228";
    ctx.fill();

    // Cute pink tongue clipped inside open mouth
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#ff6b9d";
    ctx.beginPath();
    ctx.arc(0, mouthY + mouthR * 0.85, mouthR * 0.72, Math.PI, 0);
    ctx.fill();
    ctx.restore();

    ctx.lineWidth = Math.max(2.0, 2.4 * fs);
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawStrokedText(ctx, text, x, y, font, fill, strokeW) {
    ctx.save();
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;

    ctx.fillStyle = OUTLINE_COLOR;
    ctx.fillText(text, x, y + 3);

    ctx.lineWidth = strokeW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.strokeText(text, x, y);

    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();

    // 1. Left Wooden Plank with Vines & Daisies: SCORE
    drawWoodenPlankWithVines(ctx, 20, 16, 146, 76, 18, true);
    drawStrokedText(ctx, "SCORE", 93, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);
    drawStrokedText(ctx, String(displayScore), 93, 76, "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ffe135", 6.5);

    // 2. Middle Wooden Plank with Vines & Daisies: BEST
    drawWoodenPlankWithVines(ctx, 178, 16, 132, 76, 18, true);
    drawStrokedText(ctx, "BEST", 244, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);
    drawStrokedText(ctx, String(bestScore), 244, 76, "900 28px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ffe135", 6.5);

    // 3. Right Wooden Plank with Vines & Daisies: NEXT
    drawWoodenPlankWithVines(ctx, 322, 16, 92, 76, 18, true);
    drawStrokedText(ctx, "NEXT", 368, 36, "900 13px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);

    const previewRadius = Math.min(20, FRUITS[nextFruitType].radius * 0.72);
    const scaleRatio = previewRadius / FRUITS[nextFruitType].radius;
    drawKawaiiFruit(
      ctx,
      368,
      65,
      FRUITS[nextFruitType].radius,
      nextFruitType,
      0,
      scaleRatio,
      scaleRatio,
      false,
      FRUITS[nextFruitType].winks,
      false
    );

    ctx.restore();
  }

  function drawJarBack() {
    ctx.save();

    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // 1. Wooden Border Posts Framing the Glass Jar
    const postW = 19;
    drawWoodenPlankWithVines(ctx, x - postW + 4, y - 4, postW, h + 12, 9, false);
    drawWoodenPlankWithVines(ctx, x + w - 4, y - 4, postW, h + 12, 9, false);

    // Wooden Base Under the Jar
    drawWoodenPlankWithVines(ctx, 22, y + h - 8, STAGE_W - 44, 34, 13, false);

    // 2. Clear Glass Jar Interior with Soft Sky Reflection
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y);
    ctx.closePath();

    const glassGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.50)");
    glassGrad.addColorStop(0.5, "rgba(230, 250, 255, 0.28)");
    glassGrad.addColorStop(1, "rgba(255, 255, 255, 0.55)");
    ctx.fillStyle = glassGrad;
    ctx.fill();

    // 3. Dashed Red Horizontal Fill Limit Line Near the Rim
    const dangerPulse = dangerTimer > 0 ? 0.55 + 0.45 * Math.sin(performance.now() * 0.02) : 0.82;
    ctx.save();
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = dangerTimer > 0 ? 7 : 5;
    ctx.setLineDash([12, 9]);
    ctx.beginPath();
    ctx.moveTo(JAR.x + JAR.wall + 4, JAR.dangerY);
    ctx.lineTo(JAR.x + JAR.w - JAR.wall - 4, JAR.dangerY);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 38, 68, ${dangerPulse})`;
    ctx.lineWidth = dangerTimer > 0 ? 4.5 : 3;
    ctx.stroke();
    ctx.restore();

    // Warning progress bar if fruits are above danger line
    if (dangerTimer > 0.1) {
      const pct = Math.min(1, dangerTimer / 2.0);
      drawRoundedRect(ctx, JAR.x + 80, JAR.dangerY - 26, JAR.w - 160, 14, 7);
      ctx.fillStyle = OUTLINE_COLOR;
      ctx.fill();

      drawRoundedRect(ctx, JAR.x + 82, JAR.dangerY - 24, (JAR.w - 164) * pct, 10, 5);
      ctx.fillStyle = "#ff2247";
      ctx.fill();
    }

    ctx.restore();
  }

  function drawJarFront() {
    ctx.save();
    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // 1. Strong Glossy White Shine Streaks and Highlight Reflections on Glass Jar
    ctx.fillStyle = "rgba(255, 255, 255, 0.62)";
    drawRoundedRect(ctx, x + 18, y + 28, 17, h - 90, 8.5);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.40)";
    drawRoundedRect(ctx, x + 42, y + 55, 7, h - 150, 3.5);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.50)";
    drawRoundedRect(ctx, x + w - 32, y + 48, 11, h - 115, 5.5);
    ctx.fill();

    // Diagonal glossy reflection slash across glass
    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 12, y + 12, w - 24, h - 24);
    ctx.clip();
    ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
    ctx.beginPath();
    ctx.moveTo(x - 20, y + 180);
    ctx.lineTo(x + 160, y);
    ctx.lineTo(x + 215, y);
    ctx.lineTo(x - 20, y + 235);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 2. Glass Jar Rim / Lip at Top
    drawRoundedRect(ctx, x - 10, y - 15, w + 20, 19, 9.5);
    const rimGrad = ctx.createLinearGradient(x, y - 15, x, y + 4);
    rimGrad.addColorStop(0, "#ffffff");
    rimGrad.addColorStop(0.55, "#d8f5ff");
    rimGrad.addColorStop(1, "#9ee0ff");
    ctx.fillStyle = rimGrad;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    drawRoundedRect(ctx, x + 14, y - 12, w - 28, 5, 2.5);
    ctx.fill();

    // 3. Clear Glass Jar Outline
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y + 4);

    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    ctx.lineWidth = 3.8;
    ctx.strokeStyle = "#d0f4ff";
    ctx.stroke();

    // 4. Green Vines & White Daisies Wrapping Around the Wooden Jar Border Posts
    // Left post vine
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 6.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x - 8, y + 60);
    ctx.bezierCurveTo(x - 22, y + 150, x + 6, y + 240, x - 12, y + 340);
    ctx.bezierCurveTo(x - 24, y + 420, x + 4, y + 490, x - 10, y + 545);
    ctx.stroke();
    ctx.strokeStyle = "#48b838";
    ctx.lineWidth = 3.5;
    ctx.stroke();

    drawVineLeaf(ctx, x - 15, y + 110, -0.6, 1.0);
    drawVineLeaf(ctx, x - 2, y + 215, 0.5, 0.95);
    drawVineLeaf(ctx, x - 16, y + 320, -0.5, 1.0);
    drawVineLeaf(ctx, x - 4, y + 440, 0.6, 0.95);
    drawSmallDaisy(ctx, x - 8, y + 165, 7.5);
    drawSmallDaisy(ctx, x - 10, y + 380, 7.2);
    drawSmallDaisy(ctx, x - 6, y + 515, 6.8);

    // Right post vine
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 6.5;
    ctx.beginPath();
    ctx.moveTo(x + w + 8, y + 75);
    ctx.bezierCurveTo(x + w + 22, y + 165, x + w - 6, y + 255, x + w + 12, y + 355);
    ctx.bezierCurveTo(x + w + 24, y + 435, x + w - 4, y + 500, x + w + 10, y + 548);
    ctx.stroke();
    ctx.strokeStyle = "#48b838";
    ctx.lineWidth = 3.5;
    ctx.stroke();

    drawVineLeaf(ctx, x + w + 15, y + 125, 0.6, 1.0);
    drawVineLeaf(ctx, x + w + 2, y + 240, -0.5, 0.95);
    drawVineLeaf(ctx, x + w + 16, y + 340, 0.5, 1.0);
    drawVineLeaf(ctx, x + w + 4, y + 455, -0.6, 0.95);
    drawSmallDaisy(ctx, x + w + 8, y + 185, 7.5);
    drawSmallDaisy(ctx, x + w + 10, y + 395, 7.2);
    drawSmallDaisy(ctx, x + w + 6, y + 520, 6.8);

    // 5. Wooden Plank Bar Along Bottom of Jar Showing the Fruit Ladder Separated by Tiny Dots
    const stripY = STAGE_H - 30;
    drawWoodenPlankWithVines(ctx, 36, stripY - 21, STAGE_W - 72, 40, 18, true);

    const startX = 68;
    const gap = 43;
    for (let i = 0; i < FRUITS.length; i++) {
      const cx = startX + i * gap;
      const dotR = 7.2 + i * 0.65;

      // Small glossy round fruit icon
      const g = ctx.createRadialGradient(cx - dotR * 0.3, stripY - 1 - dotR * 0.3, 1, cx, stripY - 1, dotR);
      g.addColorStop(0, FRUITS[i].gradTop);
      g.addColorStop(0.55, FRUITS[i].gradMid);
      g.addColorStop(1, FRUITS[i].gradBot);
      ctx.fillStyle = g;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, stripY - 1, dotR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Tiny green leaf on fruit ladder icon
      ctx.fillStyle = "#68d325";
      ctx.beginPath();
      ctx.arc(cx + 1, stripY - 1 - dotR, 2.4, 0, Math.PI * 2);
      ctx.fill();

      // Glossy white shine dot
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.beginPath();
      ctx.arc(cx - dotR * 0.32, stripY - 1 - dotR * 0.32, dotR * 0.30, 0, Math.PI * 2);
      ctx.fill();

      // Separated by tiny dots
      if (i < FRUITS.length - 1) {
        const midX = cx + gap * 0.5;
        ctx.fillStyle = "#ffe135";
        ctx.strokeStyle = OUTLINE_COLOR;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(midX, stripY - 1, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawDropper() {
    if (gameState !== "PLAYING" || !canDrop) return;

    const x = clampDropperX(dropperX, currentFruitType);
    const y = JAR.dropY;
    const r = FRUITS[currentFruitType].radius;

    // Thin dashed vertical aim line going down into the container
    ctx.save();
    ctx.strokeStyle = "rgba(56, 33, 16, 0.55)";
    ctx.lineWidth = 4.2;
    ctx.setLineDash([7, 8]);
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x, JAR.y + JAR.h - 16);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();

    // Cute floating kawaii fruit preview about to drop
    const floatBob = Math.sin(performance.now() * 0.005) * 2.5;
    drawKawaiiFruit(
      ctx,
      x,
      y + floatBob,
      r,
      currentFruitType,
      0,
      1,
      1,
      false,
      FRUITS[currentFruitType].winks,
      false
    );
  }

  function drawPopEffects() {
    // 1. Soft Dust Puffs on Landing
    for (let i = 0; i < dustPuffs.length; i++) {
      const dp = dustPuffs[i];
      const alpha = Math.max(0, dp.life / dp.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#fffdf5";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(dp.x, dp.y, dp.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 2. Expanding Merge Rings
    for (let i = 0; i < impactRings.length; i++) {
      const ir = impactRings[i];
      const alpha = Math.max(0, ir.life / ir.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 8 * alpha;
      ctx.beginPath();
      ctx.arc(ir.x, ir.y, ir.currentR || ir.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4 * alpha;
      ctx.stroke();
      ctx.restore();
    }

    // 3. Sparkle Stars & Glossy Droplets
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.4;

      if (p.isStar) {
        ctx.beginPath();
        for (let s = 0; s < 10; s++) {
          const rad = s % 2 === 0 ? p.r * 1.35 : p.r * 0.55;
          const ang = (s * Math.PI) / 5;
          const px = Math.cos(ang) * rad;
          const py = Math.sin(ang) * rad;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 4. Confetti
    for (let i = 0; i < confetti.length; i++) {
      const c = confetti[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2;
      ctx.fillRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.strokeRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.restore();
    }

    // 5. Floating Merge Score Popups
    for (let i = 0; i < floatingTexts.length; i++) {
      const ft = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      drawStrokedText(
        ctx,
        ft.text,
        ft.x,
        ft.y,
        "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif",
        ft.color,
        6
      );
      ctx.restore();
    }
  }

  function render() {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    // 1. Summer Flower Meadow, Deep Blue Sky, Fluffy Clouds, Windmill, Cottage & Butterflies
    drawSummerMeadowBackdrop();

    // 2. Three Wooden Plank HUD Panels with Vines & White Daisies
    drawHUD();

    // 3. Wooden Jar Frame, Clear Glass Back & Floating Kawaii Fruit Preview
    drawJarBack();
    drawDropper();

    // 4. Kawaii Cartoon Fruits inside the Jar
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      drawKawaiiFruit(
        ctx,
        f.x,
        f.y,
        f.radius,
        f.type,
        f.angle,
        f.scaleX,
        f.scaleY,
        f.blinkTimer < 0,
        f.isWinking,
        f.happyTimer > 0
      );
    }

    // 5. Glossy Glass Reflections, Vine-Wrapped Frame & Bottom Fruit Ladder Plank
    drawJarFront();

    // 6. Sparkle Bursts, Confetti & Score Popups
    drawPopEffects();
  }

  /* ==========================================
     INPUT CONTROLS (MOUSE & TOUCH)
  ========================================== */
  function clientToStageX(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return STAGE_W / 2;
    return ((clientX - rect.left) / rect.width) * STAGE_W;
  }

  let isPointerDown = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (gameState !== "PLAYING") return;
    e.preventDefault();
    ensureAudio();
    isPointerDown = true;
    targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    dropperX = targetDropperX;
  });

  window.addEventListener("pointermove", (e) => {
    if (gameState !== "PLAYING") return;
    if (isPointerDown || e.pointerType === "mouse") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    }
  });

  window.addEventListener("pointerup", (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    if (gameState === "PLAYING") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
      dropperX = targetDropperX;
      dropCurrentFruit();
    }
  });

  window.addEventListener("contextmenu", (e) => e.preventDefault());

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  replayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  /* ==========================================
     RESPONSIVE STAGE SCALING
  ========================================== */
  function handleResize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scaleX = vw / STAGE_W;
    const scaleY = vh / STAGE_H;
    stageScale = Math.min(scaleX, scaleY) * 0.98;
    gameStage.style.transform = `scale(${stageScale})`;
  }

  window.addEventListener("resize", handleResize);

  /* ==========================================
     MAIN 60FPS GAME LOOP
  ========================================== */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    try {
      if (gameState === "PLAYING") {
        updatePhysics(dt);
      }
      updateEffects(dt);
      render();
    } catch (err) {
      // Crash-proof recovery
    }

    requestAnimationFrame(loop);
  }

  // Initialize
  loadStorage();
  initMeadowScene();
  handleResize();
  requestAnimationFrame(loop);
})();
</script>
</body>
