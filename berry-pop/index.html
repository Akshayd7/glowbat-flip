<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Pop Merge</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: linear-gradient(180deg, #0077b6 0%, #00b4d8 42%, #90e0ef 78%, #52b788 78%, #2d6a4f 100%);
    font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Comic Sans MS', 'Impact', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #game-stage {
    position: relative;
    width: 480px;
    height: 820px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 22px;
    box-shadow: 0 18px 45px rgba(0, 15, 35, 0.55), 0 0 0 5px #1a0f07;
  }

  /* Mute Button Always Visible Top-Right */
  #mute-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #fff3b0 0%, #ffbe0b 45%, #fb5607 100%);
    border: 5px solid #1a0f07;
    box-shadow: 
      0 6px 0 #1a0f07,
      0 10px 18px rgba(0,0,0,0.35),
      inset 0 5px 0 rgba(255,255,255,0.75),
      inset 0 -4px 0 rgba(140, 40, 0, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 200;
    transition: transform 0.1s ease;
  }

  #mute-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1a0f07, inset 0 3px 0 rgba(255,255,255,0.6);
  }

  #mute-btn svg {
    width: 31px;
    height: 31px;
    fill: #1a0f07;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.6));
  }

  /* Overlay Screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10, 22, 38, 0.68);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    transition: opacity 0.25s ease;
    border-radius: 22px;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Polished Carved Wooden Plank Modal */
  .modal-card {
    width: 396px;
    background: 
      linear-gradient(180deg, rgba(255,235,200,0.28) 0%, rgba(0,0,0,0.18) 100%),
      repeating-linear-gradient(
        0deg,
        #e09850 0px,
        #d4873c 52px,
        #8c4a15 52px,
        #8c4a15 57px,
        #c97a32 57px,
        #bd6d28 110px
      );
    border-radius: 34px;
    border: 7px solid #1a0f07;
    box-shadow: 
      0 14px 0 #1a0f07,
      0 24px 45px rgba(0, 0, 0, 0.65),
      inset 0 7px 0 rgba(255, 240, 200, 0.65),
      inset 0 -9px 0 rgba(75, 32, 5, 0.75);
    padding: 30px 26px 34px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    animation: popIn 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.5) rotate(-4deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .game-title {
    font-size: 49px;
    line-height: 1.0;
    font-weight: 900;
    color: #ffdd00;
    -webkit-text-stroke: 3.5px #1a0f07;
    text-shadow: 
      -3px -3px 0 #1a0f07,
       3px -3px 0 #1a0f07,
      -3px  3px 0 #1a0f07,
       3px  3px 0 #1a0f07,
       0px  8px 0 #1a0f07;
    margin-bottom: 10px;
    letter-spacing: 1.5px;
    transform: rotate(-2deg);
  }

  .subtitle {
    font-size: 18px;
    color: #fffdf5;
    font-weight: 900;
    text-shadow: 
      -2px -2px 0 #1a0f07,
       2px -2px 0 #1a0f07,
      -2px  2px 0 #1a0f07,
       2px  2px 0 #1a0f07,
       0px  4px 0 #1a0f07;
    margin-bottom: 18px;
  }

  .fruit-parade {
    display: flex;
    gap: 7px;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #fffdf7 0%, #f4e2c6 100%);
    border: 5px solid #1a0f07;
    box-shadow: inset 0 5px 0 rgba(0,0,0,0.12), 0 5px 0 rgba(0,0,0,0.3);
    border-radius: 24px;
    padding: 13px 12px;
    margin-bottom: 24px;
    width: 100%;
  }

  .parade-dot {
    border-radius: 50%;
    border: 3px solid #1a0f07;
    box-shadow: 
      inset -2px -3px 0 rgba(0,0,0,0.3),
      inset 2px 3px 0 rgba(255,255,255,0.78),
      0 2px 0 rgba(0,0,0,0.2);
  }

  .btn-primary {
    background: linear-gradient(180deg, #9ef01a 0%, #52b788 12%, #38b000 52%, #007200 100%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 900;
    padding: 16px 42px;
    border-radius: 50px;
    border: 6px solid #1a0f07;
    box-shadow: 
      0 9px 0 #1a0f07,
      0 15px 24px rgba(0, 0, 0, 0.45),
      inset 0 6px 0 rgba(255,255,255,0.75),
      inset 0 -5px 0 rgba(0, 65, 0, 0.55);
    cursor: pointer;
    -webkit-text-stroke: 1.8px #1a0f07;
    text-shadow: 
      -2px -2px 0 #1a0f07,
       2px -2px 0 #1a0f07,
      -2px  2px 0 #1a0f07,
       2px  2px 0 #1a0f07,
       0 4px 0 #1a0f07;
    letter-spacing: 1.5px;
    transition: transform 0.1s;
    animation: pulseBtn 1.4s infinite ease-in-out;
  }

  .btn-primary:active {
    transform: translateY(6px);
    box-shadow: 0 3px 0 #1a0f07, inset 0 3px 0 rgba(255,255,255,0.5);
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06) rotate(1deg); }
  }

  .score-box-group {
    display: flex;
    gap: 14px;
    width: 100%;
    margin: 12px 0 26px;
  }

  .score-card {
    flex: 1;
    background: linear-gradient(180deg, #fffdf5 0%, #f3dfc1 100%);
    border: 5px solid #1a0f07;
    box-shadow: 0 6px 0 #1a0f07, inset 0 -5px 0 #d9be9b, inset 0 4px 0 #ffffff;
    border-radius: 22px;
    padding: 12px 8px;
  }

  .score-card.best {
    background: linear-gradient(180deg, #fff9d6 0%, #ffe169 100%);
    box-shadow: 0 6px 0 #1a0f07, inset 0 -5px 0 #e09f3e, inset 0 4px 0 #ffffff;
  }

  .score-label {
    font-size: 15px;
    font-weight: 900;
    color: #6f3d16;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .score-card.best .score-label {
    color: #9c3d00;
  }

  .score-val {
    font-size: 35px;
    font-weight: 900;
    color: #ff1635;
    text-shadow: 
      -2px -2px 0 #1a0f07,
       2px -2px 0 #1a0f07,
      -2px  2px 0 #1a0f07,
       2px  2px 0 #1a0f07,
       0 3px 0 #1a0f07;
  }

  .score-card.best .score-val {
    color: #ff9100;
  }
</style>
</head>
<body>

<div id="app-wrapper">
  <!-- Mute Button Top-Right -->
  <button id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">

    </svg>
  </button>

  <div id="game-stage">
    <canvas id="game-canvas" width="480" height="820"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
      <div class="modal-card">
        <div class="game-title">BERRY POP<br>MERGE!</div>
        <div class="subtitle">Drop &amp; smash feisty fruits in the jar!</div>
        <div class="fruit-parade">
          <div class="parade-dot" style="width:14px;height:14px;background:radial-gradient(circle at 35% 30%, #ff758f, #d90429);"></div>
          <div class="parade-dot" style="width:18px;height:18px;background:radial-gradient(circle at 35% 30%, #ff8fa3, #e6194b);"></div>
          <div class="parade-dot" style="width:22px;height:22px;background:radial-gradient(circle at 35% 30%, #ffea00, #ff7b00);"></div>
          <div class="parade-dot" style="width:26px;height:26px;background:radial-gradient(circle at 35% 30%, #ff5964, #a30015);"></div>
          <div class="parade-dot" style="width:30px;height:30px;background:radial-gradient(circle at 35% 30%, #d9ed92, #6a994e);"></div>
          <div class="parade-dot" style="width:34px;height:34px;background:radial-gradient(circle at 35% 30%, #ffc2d1, #fb6f92);"></div>
          <div class="parade-dot" style="width:38px;height:38px;background:radial-gradient(circle at 35% 30%, #fff3b0, #f77f00);"></div>
          <div class="parade-dot" style="width:42px;height:42px;background:radial-gradient(circle at 35% 30%, #b7efc5, #2d6a4f);"></div>
          <div class="parade-dot" style="width:48px;height:48px;background:radial-gradient(circle at 35% 30%, #80ed99, #004b23);"></div>
        </div>
        <button id="start-btn" class="btn-primary">TAP TO PLAY</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="modal-card">
        <div class="game-title" style="font-size:44px;">GAME OVER</div>
        <div class="subtitle" style="margin-bottom:6px;">The jar is overflowing!</div>
        <div class="score-box-group">
          <div class="score-card">
            <div class="score-label">Score</div>
            <div id="final-score" class="score-val">0</div>
          </div>
          <div class="score-card best">
            <div class="score-label">Best</div>
            <div id="final-best" class="score-val">0</div>
          </div>
        </div>
        <button id="replay-btn" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {

  /* ==========================================

    },
    {

      bellyColor: "#fff8d6",

      score: 128,

    },
    {

      radius: 107,

      bellyColor: "#e2f7e6",
      eyeSocket: "#1e4d38",
      score: 256,
      faceScale: 1.78,
      browStyle: "angry",
      browColor: "#06140e",
      mouthType: "grit"
    },
    {
      name: "Watermelon",
      radius: 126,
      color: "#2b9348",
      gradTop: "#9ef01a",
      gradMid: "#2b9348",
      gradBot: "#003818",
      rimLight: "#ccff99",
      bellyColor: "#c7f9cc",
      eyeSocket: "#004d25",
      score: 512,
      faceScale: 2.04,
      browStyle: "boss",
      browColor: "#001c0b",
      mouthType: "big_grin"
    }
  ];

  const COMIC_WORDS = ["POW!", "POP!", "BAM!", "SMASH!", "ZAP!", "BOOM!"];

  /* ==========================================
     STATE VARIABLES
  ========================================== */
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const gameStage = document.getElementById("game-stage");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const startBtn = document.getElementById("start-btn");
  const replayBtn = document.getElementById("replay-btn");
  const muteBtn = document.getElementById("mute-btn");
  const iconSoundOn = document.getElementById("icon-sound-on");
  const iconSoundOff = document.getElementById("icon-sound-off");
  const finalScoreEl = document.getElementById("final-score");
  const finalBestEl = document.getElementById("final-best");

  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let displayScore = 0;
  let bestScore = 0;
  let isMuted = false;

  let fruits = [];
  let particles = [];
  let floatingTexts = [];
  let confetti = [];
  let bgClouds = [];
  let starbursts = [];
  let impactRings = [];
  let dustPuffs = [];

  let currentFruitType = 0;
  let nextFruitType = 0;
  let dropperX = STAGE_W / 2;
  let targetDropperX = STAGE_W / 2;
  let canDrop = true;
  let dropCooldown = 0;
  let dangerTimer = 0; // seconds fruits stay above top line
  let nextFruitId = 1;
  let stageScale = 1;

  /* ==========================================
     LOCAL STORAGE HELPERS (CRASH-PROOF)
  ========================================== */
  function loadStorage() {
    try {
      const savedBest = localStorage.getItem(STORAGE_KEY);
      if (savedBest !== null) {
        bestScore = parseInt(savedBest, 10) || 0;
      }
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedMute !== null) {
        isMuted = savedMute === "1";
      }
    } catch (e) {
      bestScore = 0;
    }
    updateMuteUI();
  }

  function saveBestScore() {
    try {
      localStorage.setItem(STORAGE_KEY, String(bestScore));
    } catch (e) {}
  }

  function saveMuteState() {
    try {
      localStorage.setItem(MUTE_KEY, isMuted ? "1" : "0");
    } catch (e) {}
  }

  /* ==========================================
     WEBAUDIO SYNTHESIS & BACKGROUND MUSIC
  ========================================== */
  let audioCtx = null;
  let bgmTimer = null;
  let bgmStep = 0;

  const MELODY_NOTES = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 587.33
  ];

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playDropSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) {}
  }

  function playMergeSound(tier) {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const baseFreq = 320 + tier * 55;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.75, now + 0.14);
      gain1.gain.setValueAtTime(0.24, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.17);

      if (tier >= 3) {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.06);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.28);
        gain2.gain.setValueAtTime(0.16, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.31);
      }
    } catch (e) {}
  }

  function playGameOverSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const notes = [440, 392, 349.23, 293.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.15);
        gain.gain.setValueAtTime(0.2, now + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.15);
        osc.stop(now + idx * 0.15 + 0.26);
      });
    } catch (e) {}
  }

  function startSoftMusic() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (isMuted || gameState !== "PLAYING" || !audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const freq = MELODY_NOTES[bgmStep % MELODY_NOTES.length];
        bgmStep++;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.038, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }, 380);
  }

  function updateMuteUI() {
    if (isMuted) {
      iconSoundOn.style.display = "none";
      iconSoundOff.style.display = "block";
    } else {
      iconSoundOn.style.display = "block";
      iconSoundOff.style.display = "none";
    }
  }

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    ensureAudio();
    isMuted = !isMuted;
    updateMuteUI();
    saveMuteState();
  });

  /* ==========================================
     GLOBAL GAME OVER FUNCTION (REQUIRED)
  ========================================== */
  function triggerGameOver() {
    if (gameState === "GAMEOVER") return;
    gameState = "GAMEOVER";
    playGameOverSound();

    if (score > bestScore) {
      bestScore = score;
      saveBestScore();
    }

    finalScoreEl.textContent = String(score);
    finalBestEl.textContent = String(bestScore);
    gameoverScreen.classList.remove("hidden");
  }
  window.triggerGameOver = triggerGameOver;

  /* ==========================================
     GAMEPLAY & PHYSICS INITIALIZATION
  ========================================== */
  function initBgClouds() {
    bgClouds = [
      { x: 75, y: 120, scale: 0.92, speed: 0.18 },
      { x: 265, y: 82, scale: 1.15, speed: 0.12 },
      { x: 420, y: 158, scale: 0.80, speed: 0.22 },
      { x: 165, y: 215, scale: 0.68, speed: 0.15 }
    ];
  }

  function randomSpawnFruitType() {
    const weights = [0.38, 0.32, 0.20, 0.10];
    const r = Math.random();
    let sum = 0;
    for (let i = 0; i < weights.length; i++) {
      sum += weights[i];
      if (r <= sum) return i;
    }
    return 0;
  }

  function resetGame() {
    ensureAudio();
    startSoftMusic();

    fruits = [];
    particles = [];
    floatingTexts = [];
    confetti = [];
    starbursts = [];
    impactRings = [];
    dustPuffs = [];
    score = 0;
    displayScore = 0;
    dangerTimer = 0;
    canDrop = true;
    dropCooldown = 0;
    dropperX = STAGE_W / 2;
    targetDropperX = STAGE_W / 2;

    currentFruitType = randomSpawnFruitType();
    nextFruitType = randomSpawnFruitType();

    gameState = "PLAYING";
    startScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
  }

  function clampDropperX(x, type) {
    const r = FRUITS[type].radius;
    const minX = JAR.x + JAR.wall + r + 2;
    const maxX = JAR.x + JAR.w - JAR.wall - r - 2;
    return Math.max(minX, Math.min(maxX, x));
  }

  function spawnFruit(x, y, type, isMerged) {
    const def = FRUITS[type];
    const fruit = {
      id: nextFruitId++,
      type: type,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 0.6,
      vy: isMerged ? -2.2 : 1.5,
      radius: def.radius,
      angle: 0,
      va: 0,
      scaleX: isMerged ? 1.45 : 0.82,
      scaleY: isMerged ? 0.62 : 1.22,
      vScaleX: 0,
      vScaleY: 0,
      blinkTimer: 100 + Math.random() * 240,
      happyTimer: isMerged ? 0.95 : 0,
      dizzyTimer: 0,
      hasLanded: isMerged,
      isMerged: !!isMerged,
      age: 0,
      mergedFlag: false
    };
    fruits.push(fruit);
    return fruit;
  }

  function dropCurrentFruit() {
    if (gameState !== "PLAYING" || !canDrop) return;
    ensureAudio();

    const spawnX = clampDropperX(dropperX, currentFruitType);
    spawnFruit(spawnX, JAR.dropY, currentFruitType, false);
    playDropSound();

    canDrop = false;
    dropCooldown = 0.42;

    currentFruitType = nextFruitType;
    nextFruitType = randomSpawnFruitType();
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
  }

  /* ==========================================
     COMIC POP EFFECTS (POW, RINGS, DUST, CONFETTI)
  ========================================== */
  function createDustPuff(x, y, radius, intensity) {
    const count = Math.min(8, Math.max(4, Math.floor(radius * 0.14)));
    for (let i = 0; i < count; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const spdX = dir * (1.2 + Math.random() * 2.8) * intensity;
      const spdY = -0.5 - Math.random() * 1.4;
      dustPuffs.push({
        x: x + dir * (Math.random() * radius * 0.35),
        y: y,
        vx: spdX,
        vy: spdY,
        r: (6 + Math.random() * 7) * Math.min(1.4, intensity),
        life: 0.32 + Math.random() * 0.18,
        maxLife: 0.5
      });
    }
  }

  function createMergeBurst(x, y, type) {
    const def = FRUITS[type];

    // 1. Expanding Comic Impact Ring
    impactRings.push({
      x: x,
      y: y,
      r: def.radius * 0.4,
      maxR: def.radius * 2.2,
      color: def.gradTop,
      life: 0.32,
      maxLife: 0.32
    });

    // 2. Jagged Comic Starburst ("POW!", "POP!", "BAM!")
    const word = COMIC_WORDS[(type + Math.floor(Math.random() * 3)) % COMIC_WORDS.length];
    starbursts.push({
      x: x,
      y: y,
      scale: 0.25,
      targetScale: 0.88 + type * 0.12,
      rot: (Math.random() - 0.5) * 0.35,
      color: type % 2 === 0 ? "#ffdd00" : "#ff4d6d",
      word: word,
      life: 0.44,
      maxLife: 0.44
    });

    // 3. Glossy Juice Droplets & Star Particles
    const count = 15 + type * 3;
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const spd = 2.6 + Math.random() * 6.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.5,
        r: 5 + Math.random() * (4.5 + type * 0.8),
        color: i % 3 === 0 ? "#ffdd00" : (i % 2 === 0 ? def.gradTop : "#ffffff"),
        isStar: i % 4 === 0,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        alpha: 1,
        life: 0.48 + Math.random() * 0.25
      });
    }

    // 4. Floating Comic Score Text
    floatingTexts.push({
      x: x,
      y: y - 16,
      text: "+" + def.score,
      color: "#ffdd00",
      alpha: 1,
      vy: -1.9,
      scale: 1.3
    });

    // 5. Big Merge Confetti
    if (type >= 4) {
      const confettiColors = ["#ff1635", "#ffdd00", "#38b000", "#00bbf9", "#ff8800", "#9b5de5"];
      const cCount = type >= 6 ? 48 : 26;
      for (let i = 0; i < cCount; i++) {
        confetti.push({
          x: x,
          y: y - 20,
          vx: (Math.random() - 0.5) * 12,
          vy: -4.5 - Math.random() * 7.5,
          w: 9 + Math.random() * 6,
          h: 6 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.28,
          color: confettiColors[i % confettiColors.length],
          life: 1.25 + Math.random() * 0.6
        });
      }
    }
  }

  /* ==========================================
     PHYSICS & MERGE UPDATE STEP
  ========================================== */
  function updatePhysics(dt) {
    const subSteps = 6;
    const gravity = 0.46;
    const innerLeft = JAR.x + JAR.wall;
    const innerRight = JAR.x + JAR.w - JAR.wall;
    const innerBottom = JAR.y + JAR.h - JAR.wall;

    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      f.age += dt;

      // Elastic springy squash-and-stretch recovery
      const stiffness = 0.24;
      const damping = 0.72;
      f.vScaleX = (f.vScaleX + (1 - f.scaleX) * stiffness) * damping;
      f.vScaleY = (f.vScaleY + (1 - f.scaleY) * stiffness) * damping;
      f.scaleX += f.vScaleX;
      f.scaleY += f.vScaleY;

      if (f.happyTimer > 0) f.happyTimer = Math.max(0, f.happyTimer - dt);
      if (f.dizzyTimer > 0) f.dizzyTimer = Math.max(0, f.dizzyTimer - dt);

      f.blinkTimer--;
      if (f.blinkTimer < -8) {
        f.blinkTimer = 120 + Math.random() * 220;
      }
    }

    const mergesToProcess = [];

    for (let step = 0; step < subSteps; step++) {
      // 1. Apply forces & move
      for (let i = 0; i < fruits.length; i++) {
        const f = fruits[i];
        f.vy += gravity / subSteps;
        f.vx *= 0.996;
        f.vy *= 0.996;

        f.x += f.vx / subSteps;
        f.y += f.vy / subSteps;
        f.angle += f.va / subSteps;
        f.va *= 0.96;

        // Wall boundaries
        if (f.x - f.radius < innerLeft) {
          f.x = innerLeft + f.radius;
          if (f.vx < -2.4 && step === 0) {
            f.dizzyTimer = 0.45;
            f.scaleX = 0.84;
            f.scaleY = 1.16;
            createDustPuff(innerLeft + 4, f.y, f.radius * 0.6, 0.7);
          }
          if (f.vx < 0) f.vx = -f.vx * 0.25;
        } else if (f.x + f.radius > innerRight) {
          f.x = innerRight - f.radius;
          if (f.vx > 2.4 && step === 0) {
            f.dizzyTimer = 0.45;
            f.scaleX = 0.84;
            f.scaleY = 1.16;
            createDustPuff(innerRight - 4, f.y, f.radius * 0.6, 0.7);
          }
          if (f.vx > 0) f.vx = -f.vx * 0.25;
        }

        // Floor boundary
        if (f.y + f.radius > innerBottom) {
          f.y = innerBottom - f.radius;
          if (f.vy > 1.8 && step === 0) {
            const squash = Math.min(0.28, f.vy * 0.026);
            f.scaleX = 1 + squash;
            f.scaleY = 1 - squash;

            if (!f.hasLanded || f.vy > 3.2) {
              f.hasLanded = true;
              createDustPuff(f.x, innerBottom - 2, f.radius, Math.min(1.4, f.vy * 0.22));
            }
            if (f.vy > 4.2) {
              f.dizzyTimer = 0.5;
            }
          }
          if (f.vy > 0) f.vy = -f.vy * 0.18;
          f.vx *= 0.92;
          f.va = f.vx * 0.015;
        }
      }

      // 2. Circle-to-Circle Collisions
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.mergedFlag) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.mergedFlag) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = a.radius + b.radius;
          const distSq = dx * dx + dy * dy;

          if (distSq < minDist * minDist) {
            if (a.type === b.type) {
              a.mergedFlag = true;
              b.mergedFlag = true;
              mergesToProcess.push({ a, b });
              break;
            }

            const dist = Math.sqrt(distSq) || 0.001;
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            const totalR = a.radius + b.radius;
            const weightA = b.radius / totalR;
            const weightB = a.radius / totalR;

            a.x -= nx * overlap * weightA * 0.85;
            a.y -= ny * overlap * weightA * 0.85;
            b.x += nx * overlap * weightB * 0.85;
            b.y += ny * overlap * weightB * 0.85;

            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const restitution = 0.15;
              const impulse = -(1 + restitution) * velAlongNormal;
              a.vx -= impulse * nx * weightA;
              a.vy -= impulse * ny * weightA;
              b.vx += impulse * nx * weightB;
              b.vy += impulse * ny * weightB;

              const tangentX = -ny;
              const tangentY = nx;
              const slip = rvx * tangentX + rvy * tangentY;
              a.va -= slip * 0.0012;
              b.va += slip * 0.0012;

              if (Math.abs(velAlongNormal) > 3.0 && step === 0) {
                a.scaleX = 1.15; a.scaleY = 0.86;
                b.scaleX = 1.15; b.scaleY = 0.86;

                if (!a.hasLanded || !b.hasLanded || Math.abs(velAlongNormal) > 4.2) {
                  a.hasLanded = true;
                  b.hasLanded = true;
                  const cx = a.x + nx * a.radius;
                  const cy = a.y + ny * a.radius;
                  createDustPuff(cx, cy, Math.min(a.radius, b.radius) * 0.85, 0.85);
                }

                if (Math.abs(velAlongNormal) > 3.6) {
                  a.dizzyTimer = 0.55;
                  b.dizzyTimer = 0.55;
                }
              }
            }
          }
        }
      }
    }

    // 3. Execute Merges
    if (mergesToProcess.length > 0) {
      fruits = fruits.filter(f => !f.mergedFlag);

      for (let i = 0; i < mergesToProcess.length; i++) {
        const { a, b } = mergesToProcess[i];
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const nextType = Math.min(FRUITS.length - 1, a.type + 1);

        const gained = FRUITS[nextType].score;
        score += gained;
        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }

        if (a.type < FRUITS.length - 1) {
          const newF = spawnFruit(mx, my, nextType, true);
          newF.x = clampDropperX(newF.x, nextType);
        } else {
          score += 500;
        }

        for (let k = 0; k < fruits.length; k++) {
          const other = fruits[k];
          const d = Math.hypot(other.x - mx, other.y - my);
          if (d < 155) {
            other.happyTimer = Math.max(other.happyTimer, 0.58);
          }
        }

        playMergeSound(nextType);
        createMergeBurst(mx, my, nextType);
      }
    }

    // 4. Check Danger Line (Fruits staying above JAR.dangerY for 2 seconds)
    let anyAboveLine = false;
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      if (f.age > 0.65 && (f.y - f.radius) < JAR.dangerY) {
        anyAboveLine = true;
        break;
      }
    }

    if (anyAboveLine) {
      dangerTimer += dt;
      if (dangerTimer >= 2.0) {
        triggerGameOver();
      }
    } else {
      dangerTimer = Math.max(0, dangerTimer - dt * 2.2);
    }
  }

  function updateEffects(dt) {
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
    dropperX += (targetDropperX - dropperX) * 0.35;

    if (!canDrop) {
      dropCooldown -= dt;
      if (dropCooldown <= 0) {
        canDrop = true;
      }
    }

    if (displayScore < score) {
      displayScore += Math.ceil((score - displayScore) * 0.2);
    }

    // Drifting cartoon clouds
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      c.x += c.speed;
      if (c.x - 95 > STAGE_W) {
        c.x = -95;
      }
    }

    // Dust puffs
    for (let i = dustPuffs.length - 1; i >= 0; i--) {
      const dp = dustPuffs[i];
      dp.x += dp.vx;
      dp.y += dp.vy;
      dp.vx *= 0.92;
      dp.r += dt * 16;
      dp.life -= dt;
      if (dp.life <= 0) dustPuffs.splice(i, 1);
    }

    // Impact rings
    for (let i = impactRings.length - 1; i >= 0; i--) {
      const ir = impactRings[i];
      ir.life -= dt;
      const progress = 1 - Math.max(0, ir.life / ir.maxLife);
      ir.currentR = ir.r + (ir.maxR - ir.r) * (1 - Math.pow(1 - progress, 3));
      if (ir.life <= 0) impactRings.splice(i, 1);
    }

    // Comic Starbursts
    for (let i = starbursts.length - 1; i >= 0; i--) {
      const sb = starbursts[i];
      sb.life -= dt;
      sb.scale += (sb.targetScale - sb.scale) * 0.35;
      if (sb.life <= 0) starbursts.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22;
      p.rot += p.vRot;
      p.life -= dt;
      p.alpha = Math.max(0, p.life * 2.2);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating score texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.alpha -= dt * 1.1;
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.24;
      c.vx *= 0.98;
      c.rot += c.vRot;
      c.life -= dt;
      if (c.life <= 0) confetti.splice(i, 1);
    }
  }

  /* ==========================================
     VERSION 3 POLISHED CARTOON DRAWING ROUTINES
  ========================================== */
  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawPolishedWoodBox(ctx, x, y, w, h, r) {
    ctx.save();
    // Solid cartoon drop shadow
    drawRoundedRect(ctx, x, y + 6, w, h, r);
    ctx.fillStyle = OUTLINE_COLOR;
    ctx.fill();

    // Rich warm wood gradient
    drawRoundedRect(ctx, x, y, w, h, r);
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, "#f3b36b");
    grad.addColorStop(0.15, "#df9246");
    grad.addColorStop(0.75, "#b86924");
    grad.addColorStop(1, "#85420c");
    ctx.fillStyle = grad;
    ctx.fill();

    // Wood grain & inner bevels clipped
    ctx.save();
    ctx.clip();

    // Top glossy rim highlight
    ctx.fillStyle = "rgba(255, 245, 215, 0.55)";
    ctx.fillRect(x, y, w, 7);

    // Bottom dark bevel
    ctx.fillStyle = "rgba(55, 20, 0, 0.45)";
    ctx.fillRect(x, y + h - 8, w, 8);

    // Stylized wood grain swirls
    ctx.strokeStyle = "rgba(90, 38, 5, 0.35)";
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x - 5, y + h * 0.36);
    ctx.bezierCurveTo(x + w * 0.28, y + h * 0.22, x + w * 0.72, y + h * 0.48, x + w + 5, y + h * 0.33);
    ctx.moveTo(x - 5, y + h * 0.70);
    ctx.bezierCurveTo(x + w * 0.35, y + h * 0.84, x + w * 0.65, y + h * 0.58, x + w + 5, y + h * 0.74);
    ctx.stroke();

    // Wood knot detail
    ctx.beginPath();
    ctx.ellipse(x + w * 0.78, y + h * 0.52, 8, 4.5, 0.1, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    // Thick clean dark outline
    drawRoundedRect(ctx, x, y, w, h, r);
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Glossy metallic bolts in corners
    const bolts = [
      [x + 11, y + 11],
      [x + w - 11, y + 11],
      [x + 11, y + h - 11],
      [x + w - 11, y + h - 11]
    ];
    for (let i = 0; i < bolts.length; i++) {
      const bx = bolts[i][0];
      const by = bolts[i][1];
      ctx.fillStyle = "#8d99ae";
      ctx.beginPath();
      ctx.arc(bx, by, 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(bx - 1, by - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPolishedCloud(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Outer cloud silhouette
    ctx.beginPath();
    ctx.arc(-38, 10, 22, Math.PI * 0.52, Math.PI * 1.48);
    ctx.arc(-14, -10, 29, Math.PI * 1.02, Math.PI * 1.92);
    ctx.arc(22, -5, 25, Math.PI * 1.12, Math.PI * 1.95);
    ctx.arc(45, 11, 19, Math.PI * 1.42, Math.PI * 0.48);
    ctx.closePath();

    // Soft sky-tinted vertical gradient inside cloud
    const cGrad = ctx.createLinearGradient(0, -35, 0, 30);
    cGrad.addColorStop(0, "#ffffff");
    cGrad.addColorStop(0.7, "#f0f9ff");
    cGrad.addColorStop(1, "#bae6fd");
    ctx.fillStyle = cGrad;
    ctx.fill();

    // Crisp inner rim highlight on top puffs
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(-14, -8, 26, Math.PI * 1.1, Math.PI * 1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(22, -3, 22, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();

    // Thick cartoon outline
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineJoin = "round";
    ctx.stroke();

    ctx.restore();
  }

  function drawPolishedGrassTuft(ctx, x, y, scale, flip) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -scale : scale, scale);

    ctx.beginPath();
    ctx.moveTo(-24, 0);
    ctx.quadraticCurveTo(-28, -20, -38, -29);
    ctx.quadraticCurveTo(-17, -20, -10, -6);
    ctx.quadraticCurveTo(-8, -29, -1, -40);
    ctx.quadraticCurveTo(5, -24, 7, -6);
    ctx.quadraticCurveTo(18, -24, 32, -26);
    ctx.quadraticCurveTo(24, -11, 20, 0);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, -40, 0, 0);
    grad.addColorStop(0, "#ccff33");
    grad.addColorStop(0.5, "#70e000");
    grad.addColorStop(1, "#2b9348");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 4.5;
    ctx.lineJoin = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();
    ctx.restore();
  }

  function drawCartoonFlower(ctx, x, y, scale, petalColor) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = petalColor;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 3.5;
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 2) / 5;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 8, Math.sin(a) * 8, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.fillStyle = "#ffdd00";
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawSkyAndBackdrop() {
    ctx.save();

    // 1. Vibrant Tropical Cartoon Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, STAGE_H);
    skyGrad.addColorStop(0, "#0077b6");
    skyGrad.addColorStop(0.38, "#00b4d8");
    skyGrad.addColorStop(0.72, "#90e0ef");
    skyGrad.addColorStop(1, "#caf0f8");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);

    // Dynamic radial sunbeams behind jar
    ctx.save();
    ctx.translate(STAGE_W * 0.5, JAR.y + 220);
    ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
    for (let i = 0; i < 14; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = (i * Math.PI * 2) / 14;
      const a2 = a1 + Math.PI / 14;
      ctx.arc(0, 0, 680, a1, a2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 2. Fluffy Outlined Cartoon Clouds
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      drawPolishedCloud(ctx, c.x, c.y, c.scale);
    }

    // 3. Distant Lush Rolling Hills & Foliage Bushes
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 635);
    ctx.quadraticCurveTo(115, 580, 255, 635);
    ctx.quadraticCurveTo(385, 675, STAGE_W + 10, 618);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    const backHillGrad = ctx.createLinearGradient(0, 590, 0, 720);
    backHillGrad.addColorStop(0, "#70e000");
    backHillGrad.addColorStop(1, "#2b9348");
    ctx.fillStyle = backHillGrad;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Foreground Sunlit Meadow Hill
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 706);
    ctx.quadraticCurveTo(240, 668, STAGE_W + 10, 706);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    const frontGrassGrad = ctx.createLinearGradient(0, 675, 0, STAGE_H);
    frontGrassGrad.addColorStop(0, "#9ef01a");
    frontGrassGrad.addColorStop(0.35, "#52b788");
    frontGrassGrad.addColorStop(1, "#1b4332");
    ctx.fillStyle = frontGrassGrad;
    ctx.fill();
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Little cartoon flowers & grass tufts flanking the jar
    drawPolishedGrassTuft(ctx, 26, 722, 0.92, false);
    drawPolishedGrassTuft(ctx, 454, 722, 0.95, true);
    drawCartoonFlower(ctx, 22, 742, 0.72, "#ff4d6d");
    drawCartoonFlower(ctx, 458, 745, 0.72, "#ffbe0b");

    ctx.restore();
  }

  /* ==========================================
     VERSION 3 POLISHED GLOSSY FRUIT CHARACTERS
  ========================================== */
  function drawCrownAndStem(ctx, radius, type) {
    ctx.save();
    if (type === 0) {
      // Cherry curved glossy stem + bright leaf
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 8.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.78);
      ctx.quadraticCurveTo(7, -radius * 1.52, 16, -radius * 1.65);
      ctx.stroke();

      ctx.strokeStyle = "#70e000";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Tiny leaf at top of cherry stem
      ctx.translate(8, -radius * 1.35);
      ctx.rotate(0.4);
      ctx.fillStyle = "#70e000";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 3.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (type === 1) {
      // Strawberry layered leafy calyx crown
      ctx.fillStyle = "#52b788";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-16, -radius * 0.78);
      ctx.quadraticCurveTo(-12, -radius * 1.18, -5, -radius * 0.95);
      ctx.quadraticCurveTo(0, -radius * 1.25, 5, -radius * 0.95);
      ctx.quadraticCurveTo(12, -radius * 1.18, 16, -radius * 0.78);
      ctx.closePath();
      ctx.fillStyle = "#70e000";
      ctx.fill();
      ctx.stroke();
    } else if (type === 2 || type === 3 || type === 4 || type === 5) {
      // Chunky wood stem + glossy leaf with center vein
      drawRoundedRect(ctx, -3.5, -radius * 1.18, 7, radius * 0.34, 3.5);
      ctx.fillStyle = "#8c4a15";
      ctx.fill();
      ctx.lineWidth = 3.8;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      ctx.save();
      ctx.translate(10, -radius * 0.98);
      ctx.rotate(-0.32);
      const leafGrad = ctx.createLinearGradient(-10, -5, 10, 5);
      leafGrad.addColorStop(0, "#ccff33");
      leafGrad.addColorStop(1, "#38b000");
      ctx.fillStyle = leafGrad;
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.quadraticCurveTo(0, -10, 13, 0);
      ctx.quadraticCurveTo(0, 10, -12, 0);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 3.8;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      // Leaf center vein
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-8, 0);
      ctx.lineTo(8, 0);
      ctx.stroke();
      ctx.restore();
    } else if (type === 6) {
      // Pineapple multi-tiered spiky tropical crown
      ctx.lineJoin = "round";
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = OUTLINE_COLOR;

      // Back fronds
      ctx.fillStyle = "#2b9348";
      ctx.beginPath();
      ctx.moveTo(-26, -radius * 0.80);
      ctx.quadraticCurveTo(-22, -radius * 1.24, -10, -radius * 0.95);
      ctx.quadraticCurveTo(0, -radius * 1.38, 10, -radius * 0.95);
      ctx.quadraticCurveTo(22, -radius * 1.24, 26, -radius * 0.80);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Front bright fronds
      ctx.fillStyle = "#70e000";
      ctx.beginPath();
      ctx.moveTo(-18, -radius * 0.80);
      ctx.quadraticCurveTo(-12, -radius * 1.18, -4, -radius * 0.92);
      ctx.quadraticCurveTo(0, -radius * 1.28, 4, -radius * 0.92);
      ctx.quadraticCurveTo(12, -radius * 1.18, 18, -radius * 0.80);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 7 || type === 8) {
      // Curly cartoon vine tendril on Melon & Watermelon
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 9;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.90);
      ctx.bezierCurveTo(-14, -radius * 1.25, 18, -radius * 1.30, 7, -radius * 1.04);
      ctx.stroke();

      ctx.strokeStyle = "#70e000";
      ctx.lineWidth = 4.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCuteFruit(ctx, x, y, radius, type, angle, scaleX, scaleY, isBlinking, mood) {
    const def = FRUITS[type];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    // 1. Soft Ambient Ground Shadow inside Jar
    ctx.fillStyle = "rgba(15, 8, 0, 0.26)";
    ctx.beginPath();
    ctx.arc(0, 5.5, radius, 0, Math.PI * 2);
    ctx.fill();

    // 2. Top Stems / Leaves / Crown
    drawCrownAndStem(ctx, radius, type);

    // 3. Rich Multi-Stop 3D Radial Body Gradient
    const grad = ctx.createRadialGradient(
      -radius * 0.32,
      -radius * 0.36,
      radius * 0.06,
      0,
      0,
      radius
    );
    grad.addColorStop(0, def.gradTop);
    grad.addColorStop(0.52, def.gradMid);
    grad.addColorStop(0.88, def.gradBot);
    grad.addColorStop(1, def.gradBot);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    // 4. Clipped Surface Art (Belly Patch, Rim Bounce Light, Fruit Textures)
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, radius - 2, 0, Math.PI * 2);
    ctx.clip();

    // chunky cartoon lighter rounded belly patch at bottom
    ctx.fillStyle = def.bellyColor;
    ctx.globalAlpha = 0.72;
    ctx.beginPath();
    ctx.ellipse(0, radius * 0.76, radius * 0.70, radius * 0.44, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Characteristic fruit markings
    if (type === 0) {
      // Cherry subtle cheek dimple arc
      ctx.strokeStyle = "rgba(120, 0, 20, 0.28)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, -radius * 0.55, radius * 0.35, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();
    } else if (type === 1) {
      // Strawberry golden teardrop seeds with dark outlines
      ctx.fillStyle = "#ffdd00";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 1.6;
      const seeds = [[-14, -12], [14, -12], [-18, 4], [18, 4], [-11, 17], [11, 17]];
      for (let i = 0; i < seeds.length; i++) {
        const s = seeds[i];
        ctx.beginPath();
        ctx.ellipse(s[0], s[1], 2.3, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    } else if (type === 2) {
      // Orange textured citrus pores
      ctx.fillStyle = "rgba(155, 50, 0, 0.32)";
      const pores = [[-0.62, -0.18, 3.2], [-0.52, -0.40, 2.2], [0.62, -0.12, 3.4], [0.54, 0.18, 2.4], [-0.58, 0.15, 2.5]];
      for (let i = 0; i < pores.length; i++) {
        ctx.beginPath();
        ctx.arc(radius * pores[i][0], radius * pores[i][1], pores[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === 3) {
      // Apple glossy shoulder stripes
      ctx.strokeStyle = "rgba(255, 190, 190, 0.28)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.78, -0.25 * Math.PI, 0.15 * Math.PI);
      ctx.stroke();
    } else if (type === 4) {
      // Pear botanical speckles
      ctx.fillStyle = "rgba(35, 75, 12, 0.35)";
      ctx.beginPath();
      ctx.arc(-radius * 0.56, 6, 3.2, 0, Math.PI * 2);
      ctx.arc(-radius * 0.45, 20, 2.2, 0, Math.PI * 2);
      ctx.arc(radius * 0.58, 4, 3.6, 0, Math.PI * 2);
      ctx.arc(radius * 0.44, 19, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 5) {
      // Peach soft cleft contour & rosy blush glow
      ctx.strokeStyle = "rgba(180, 20, 75, 0.26)";
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-radius * 0.15, -radius * 0.25, radius * 0.65, -0.55 * Math.PI, -0.15 * Math.PI);
      ctx.stroke();
    } else if (type === 6) {
      // Pineapple diamond scales & berry pips
      ctx.strokeStyle = "rgba(165, 60, 0, 0.30)";
      ctx.lineWidth = 4.2;
      for (let d = -radius; d <= radius; d += 28) {
        ctx.beginPath();
        ctx.moveTo(d - radius, -radius);
        ctx.lineTo(d + radius, radius);
        ctx.moveTo(d + radius, -radius);
        ctx.lineTo(d - radius, radius);
        ctx.stroke();
      }
    } else if (type === 7) {
      // Melon cantaloupe ribs & netted arcs
      ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      ctx.arc(-radius * 0.34, 0, radius * 0.90, -0.85, 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(radius * 0.34, 0, radius * 0.90, Math.PI - 0.85, Math.PI + 0.85);
      ctx.stroke();
    } else if (type === 8) {
      // Watermelon bold dark-green lightning stripes
      ctx.strokeStyle = "#003818";
      ctx.lineWidth = 13;
      ctx.lineCap = "round";
      for (let sx = -radius * 0.68; sx <= radius * 0.68; sx += radius * 0.45) {
        ctx.beginPath();
        ctx.moveTo(sx, -radius);
        ctx.quadraticCurveTo(sx * 1.28, 0, sx, radius);
        ctx.stroke();
      }
    }

    // 3D Bottom Ambient Shadow Crescent
    ctx.strokeStyle = "rgba(0, 0, 0, 0.28)";
    ctx.lineWidth = radius * 0.15;
    ctx.beginPath();
    ctx.arc(0, -radius * 0.05, radius, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();

    // Luminous Bottom-Right Rim Bounce Light
    ctx.strokeStyle = def.rimLight;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = radius * 0.07;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.90, 0.15 * Math.PI, 0.42 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();

    // 5. Dual Glossy Specular Highlights (Top-Left Primary Pill + Secondary Dot)
    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
    ctx.beginPath();
    ctx.ellipse(-radius * 0.35, -radius * 0.38, radius * 0.26, radius * 0.13, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.62)";
    ctx.beginPath();
    ctx.arc(-radius * 0.12, -radius * 0.57, radius * 0.065, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 6. Thick Clean Cartoon Outline Around Body
    const outlineW = Math.max(4.0, Math.min(8.0, radius * 0.115));
    ctx.lineWidth = outlineW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.beginPath();
    ctx.arc(0, 0, radius - outlineW * 0.4, 0, Math.PI * 2);
    ctx.stroke();

    // 7. POLISHED CARTOON FACE (EYE SOCKETS, BIG EYES, SCULPTED BROWS & MOUTH)
    const fs = def.faceScale;
    const eyeSpan = 8.6 * fs;
    const eyeY = 1.6 * fs;
    const eyeRX = 7.6 * fs;
    const eyeRY = 8.6 * fs;

    // Darker Eye Socket Masks Behind Eyes for Character Depth
    ctx.fillStyle = def.eyeSocket;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.ellipse(-eyeSpan * 1.05, eyeY + 1.2 * fs, eyeRX * 1.22, eyeRY * 1.18, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeSpan * 1.05, eyeY + 1.2 * fs, eyeRX * 1.22, eyeRY * 1.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Warm Rosy Cheeks
    ctx.fillStyle = "rgba(255, 45, 95, 0.52)";
    ctx.beginPath();
    ctx.ellipse(-eyeSpan * 1.58, eyeY + 6.8 * fs, 5.0 * fs, 3.2 * fs, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeSpan * 1.58, eyeY + 6.8 * fs, 5.0 * fs, 3.2 * fs, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- BIG EXPRESSIVE EYES ---
    if (mood === "happy") {
      // Joyful cheering curved eye arcs (^ ^) on merge
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.8, 3.4 * fs);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-eyeSpan, eyeY + 1.2 * fs, 5.6 * fs, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(eyeSpan, eyeY + 1.2 * fs, 5.6 * fs, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    } else if (isBlinking && mood === "normal") {
      // Crisp closed eyelid line
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.6, 3.1 * fs);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-eyeSpan - eyeRX * 0.82, eyeY);
      ctx.lineTo(-eyeSpan + eyeRX * 0.82, eyeY);
      ctx.moveTo(eyeSpan - eyeRX * 0.82, eyeY);
      ctx.lineTo(eyeSpan + eyeRX * 0.82, eyeY);
      ctx.stroke();
    } else {
      // Sclera with subtle top eyelid shading
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(-eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      ctx.ellipse(eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      const eyeGrad = ctx.createLinearGradient(0, eyeY - eyeRY, 0, eyeY + eyeRY);
      eyeGrad.addColorStop(0, "#e2e8f0");
      eyeGrad.addColorStop(0.25, "#ffffff");
      eyeGrad.addColorStop(1, "#ffffff");
      ctx.fillStyle = eyeGrad;
      ctx.fill();

      // Lower eyelid expression line inside eye clip
      ctx.save();
      ctx.clip();
      if (mood === "normal" && (def.browStyle === "angry" || def.browStyle === "boss")) {
        ctx.fillStyle = def.eyeSocket;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(-eyeSpan * 3, eyeY + eyeRY * 0.62, eyeSpan * 6, eyeRY);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      // Bold eye outlines
      ctx.lineWidth = Math.max(2.3, 2.7 * fs);
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.beginPath();
      ctx.ellipse(-eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      if (mood === "dizzy") {
        // Spinning googly pupils on bounce!
        const spin = performance.now() * 0.022;
        const pR = 3.0 * fs;
        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(-eyeSpan + Math.cos(spin) * 2.6 * fs, eyeY + Math.sin(spin) * 2.6 * fs, pR, 0, Math.PI * 2);
        ctx.arc(eyeSpan - Math.cos(spin) * 2.6 * fs, eyeY - Math.sin(spin) * 2.6 * fs, pR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-eyeSpan + Math.cos(spin) * 2.6 * fs - 1, eyeY + Math.sin(spin) * 2.6 * fs - 1, pR * 0.38, 0, Math.PI * 2);
        ctx.arc(eyeSpan - Math.cos(spin) * 2.6 * fs - 1, eyeY - Math.sin(spin) * 2.6 * fs - 1, pR * 0.38, 0, Math.PI * 2);
        ctx.fill();
      } else if (mood === "worried") {
        // Shrunk jittering pupils looking up at the danger line + sweat drop!
        const jitterX = (Math.random() - 0.5) * 1.6 * fs;
        const pR = 2.4 * fs;
        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(-eyeSpan + jitterX, eyeY - 2.2 * fs, pR, 0, Math.PI * 2);
        ctx.arc(eyeSpan + jitterX, eyeY - 2.2 * fs, pR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-eyeSpan + jitterX - 0.8 * fs, eyeY - 3.0 * fs, pR * 0.45, 0, Math.PI * 2);
        ctx.arc(eyeSpan + jitterX - 0.8 * fs, eyeY - 3.0 * fs, pR * 0.45, 0, Math.PI * 2);
        ctx.fill();

        // Glossy cartoon sweat drop
        ctx.fillStyle = "#48cae4";
        ctx.strokeStyle = OUTLINE_COLOR;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(eyeSpan * 1.95, eyeY - 9.5 * fs);
        ctx.quadraticCurveTo(eyeSpan * 2.32, eyeY - 2 * fs, eyeSpan * 1.95, eyeY - 0.8 * fs);
        ctx.quadraticCurveTo(eyeSpan * 1.58, eyeY - 2 * fs, eyeSpan * 1.95, eyeY - 9.5 * fs);
        ctx.fill();
        ctx.stroke();
      } else {
        // Focused glossy pupils with dual catchlights
        const pR = 3.8 * fs;
        const pxL = -eyeSpan * 0.76;
        const pxR = eyeSpan * 0.76;
        const py = eyeY + 0.5 * fs;

        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(pxL, py, pR, 0, Math.PI * 2);
        ctx.arc(pxR, py, pR, 0, Math.PI * 2);
        ctx.fill();

        // Primary bright catchlight
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(pxL - pR * 0.36, py - pR * 0.36, pR * 0.44, 0, Math.PI * 2);
        ctx.arc(pxR - pR * 0.36, py - pR * 0.36, pR * 0.44, 0, Math.PI * 2);
        ctx.fill();

        // Secondary tiny catchlight
        ctx.beginPath();
        ctx.arc(pxL + pR * 0.32, py + pR * 0.32, pR * 0.18, 0, Math.PI * 2);
        ctx.arc(pxR + pR * 0.32, py + pR * 0.32, pR * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // --- SCULPTED TAPERED ANGRY/CUTE EYEBROWS ---
    ctx.save();
    ctx.fillStyle = def.browColor;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = Math.max(2.0, 2.2 * fs);
    ctx.lineJoin = "round";

    const browW = 11.4 * fs;
    const browH = 4.2 * fs;
    let leftBrowAngle = 0.34;
    let rightBrowAngle = -0.34;
    let browOffsetY = -eyeRY - 1.2 * fs;

    if (mood === "worried") {
      leftBrowAngle = -0.38;
      rightBrowAngle = 0.38;
      browOffsetY -= 2.4 * fs;
    } else if (mood === "happy") {
      leftBrowAngle = -0.16;
      rightBrowAngle = 0.16;
      browOffsetY -= 3.6 * fs;
    } else if (mood === "dizzy") {
      leftBrowAngle = -0.30;
      rightBrowAngle = -0.22;
      browOffsetY -= 1.6 * fs;
    } else {
      if (def.browStyle === "angry") {
        leftBrowAngle = 0.35;
        rightBrowAngle = -0.35;
      } else if (def.browStyle === "boss") {
        leftBrowAngle = 0.44;
        rightBrowAngle = -0.44;
        browOffsetY += 1.4 * fs;
      } else if (def.browStyle === "cheeky") {
        leftBrowAngle = 0.30;
        rightBrowAngle = -0.08;
      } else {
        leftBrowAngle = 0.22;
        rightBrowAngle = -0.22;
      }
    }

    // Left Sculpted Tapered Eyebrow
    ctx.save();
    ctx.translate(-eyeSpan, eyeY + browOffsetY);
    ctx.rotate(leftBrowAngle);
    ctx.beginPath();
    ctx.moveTo(-browW * 0.58, -browH * 0.65);
    ctx.lineTo(browW * 0.48, -browH * 0.38);
    ctx.lineTo(browW * 0.44, browH * 0.50);
    ctx.lineTo(-browW * 0.52, browH * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Right Sculpted Tapered Eyebrow
    ctx.save();
    ctx.translate(eyeSpan, eyeY + browOffsetY);
    ctx.rotate(rightBrowAngle);
    ctx.beginPath();
    ctx.moveTo(-browW * 0.48, -browH * 0.38);
    ctx.lineTo(browW * 0.58, -browH * 0.65);
    ctx.lineTo(browW * 0.52, browH * 0.55);
    ctx.lineTo(-browW * 0.44, browH * 0.50);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.restore();

    // --- EXPRESSIVE CARTOON MOUTH ---
    const mouthY = eyeY + eyeRY + 3.4 * fs;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = Math.max(2.2, 2.6 * fs);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (mood === "happy") {
      // Big cheering open laugh with upper teeth & pink tongue!
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, mouthY - 1.2 * fs, 7.2 * fs, 0, Math.PI);
      ctx.closePath();
      ctx.fillStyle = "#590d22";
      ctx.fill();

      ctx.save();
      ctx.clip();
      // White teeth bar at top
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-8 * fs, mouthY - 2.5 * fs, 16 * fs, 3.4 * fs);
      // Pink tongue at bottom
      ctx.fillStyle = "#ff4d6d";
      ctx.beginPath();
      ctx.arc(0, mouthY + 5.5 * fs, 5.2 * fs, Math.PI, 0);
      ctx.fill();
      ctx.restore();

      ctx.stroke();
      ctx.restore();
    } else if (mood === "worried") {
      // Quivering panicked oval mouth with tongue
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, mouthY + 1 * fs, 4.5 * fs, 5.5 * fs, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#590d22";
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = "#ff4d6d";
      ctx.beginPath();
      ctx.arc(0, mouthY + 5.5 * fs, 3.8 * fs, Math.PI, 0);
      ctx.fill();
      ctx.restore();
      ctx.stroke();
      ctx.restore();
    } else if (mood === "dizzy") {
      // Wobbly dazed squiggle mouth
      ctx.beginPath();
      ctx.moveTo(-6.2 * fs, mouthY + 1 * fs);
      ctx.quadraticCurveTo(-3 * fs, mouthY - 2.8 * fs, 0, mouthY + 1 * fs);
      ctx.quadraticCurveTo(3 * fs, mouthY + 4.8 * fs, 6.2 * fs, mouthY + 1 * fs);
      ctx.stroke();
    } else {
      // Character-specific normal feisty/cute mouths
      if (def.mouthType === "grit" || def.mouthType === "big_grin") {
        // Bold chunky-cartoon clenched toothy grin
        const mw = (def.mouthType === "big_grin" ? 7.8 : 6.4) * fs;
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, mouthY - 1.6 * fs, mw, 0.04 * Math.PI, 0.96 * Math.PI);
        ctx.closePath();
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        // Tooth divider lines
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = OUTLINE_COLOR;
        ctx.lineWidth = Math.max(1.4, 1.6 * fs);
        ctx.beginPath();
        ctx.moveTo(-mw * 0.38, mouthY - 2 * fs);
        ctx.lineTo(-mw * 0.38, mouthY + mw);
        ctx.moveTo(0, mouthY - 2 * fs);
        ctx.lineTo(0, mouthY + mw);
        ctx.moveTo(mw * 0.38, mouthY - 2 * fs);
        ctx.lineTo(mw * 0.38, mouthY + mw);
        ctx.stroke();
        ctx.restore();

        ctx.stroke();
        ctx.restore();
      } else if (def.mouthType === "toothy") {
        // Cheeky smirk with a cute little fang/tooth
        ctx.beginPath();
        ctx.arc(0, mouthY - 1 * fs, 5.2 * fs, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(2.2 * fs, mouthY + 2.8 * fs);
        ctx.lineTo(4.6 * fs, mouthY + 1.8 * fs);
        ctx.lineTo(3.8 * fs, mouthY + 5.2 * fs);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, 1.8 * fs);
        ctx.stroke();
      } else {
        // Confident feisty smirk
        ctx.beginPath();
        ctx.arc(0, mouthY - 1 * fs, 5.0 * fs, 0.14 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawStrokedText(ctx, text, x, y, font, fill, strokeW) {
    ctx.save();
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;

    ctx.fillStyle = OUTLINE_COLOR;
    ctx.fillText(text, x, y + 3.5);

    ctx.lineWidth = strokeW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.strokeText(text, x, y);

    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();

    // 1. Score Wooden Plank Sign (Top-Left)
    drawPolishedWoodBox(ctx, 20, 16, 146, 76, 18);
    drawStrokedText(ctx, "SCORE", 93, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);
    drawStrokedText(ctx, String(displayScore), 93, 76, "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ffdd00", 6.5);

    // 2. Best Score Wooden Plank Sign
    drawPolishedWoodBox(ctx, 178, 16, 132, 76, 18);
    drawStrokedText(ctx, "BEST", 244, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);
    drawStrokedText(ctx, String(bestScore), 244, 76, "900 28px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ff9f1c", 6.5);

    // 3. Next Fruit Wooden Box
    drawPolishedWoodBox(ctx, 322, 16, 92, 76, 18);
    drawStrokedText(ctx, "NEXT", 368, 36, "900 13px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fffdf5", 4.5);

    const previewRadius = Math.min(20, FRUITS[nextFruitType].radius * 0.72);
    const scaleRatio = previewRadius / FRUITS[nextFruitType].radius;
    drawCuteFruit(ctx, 368, 65, FRUITS[nextFruitType].radius, nextFruitType, 0, scaleRatio, scaleRatio, false, "normal");

    ctx.restore();
  }

  function drawJarBack() {
    ctx.save();

    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // 1. Sturdy Carved Wooden Timber Posts Framing the Jar
    const postW = 19;
    drawPolishedWoodBox(ctx, x - postW + 4, y - 4, postW, h + 12, 9);
    drawPolishedWoodBox(ctx, x + w - 4, y - 4, postW, h + 12, 9);

    // Heavy Wooden Platform Stage Under the Jar
    drawPolishedWoodBox(ctx, 18, y + h - 8, STAGE_W - 36, 35, 13);

    // Foreground Grass Tufts Overlapping the Wooden Base
    drawPolishedGrassTuft(ctx, 68, y + h + 25, 0.76, false);
    drawPolishedGrassTuft(ctx, 412, y + h + 25, 0.78, true);

    // 2. Translucent Glossy Glass Jar Interior
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y);
    ctx.closePath();

    const glassGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.55)");
    glassGrad.addColorStop(0.5, "rgba(225, 250, 255, 0.35)");
    glassGrad.addColorStop(1, "rgba(255, 255, 255, 0.60)");
    ctx.fillStyle = glassGrad;
    ctx.fill();

    // 3. Top Danger Dashed Line
    const dangerPulse = dangerTimer > 0 ? 0.55 + 0.45 * Math.sin(performance.now() * 0.02) : 0.6;
    ctx.save();
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = dangerTimer > 0 ? 7.5 : 5.5;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(JAR.x + JAR.wall + 4, JAR.dangerY);
    ctx.lineTo(JAR.x + JAR.w - JAR.wall - 4, JAR.dangerY);
    ctx.stroke();

    ctx.strokeStyle = dangerTimer > 0
      ? `rgba(255, 22, 53, ${dangerPulse})`
      : "rgba(255, 65, 95, 0.8)";
    ctx.lineWidth = dangerTimer > 0 ? 4.5 : 2.8;
    ctx.stroke();
    ctx.restore();

    // Warning progress bar if fruits are above danger line
    if (dangerTimer > 0.1) {
      const pct = Math.min(1, dangerTimer / 2.0);
      drawRoundedRect(ctx, JAR.x + 80, JAR.dangerY - 26, JAR.w - 160, 14, 7);
      ctx.fillStyle = OUTLINE_COLOR;
      ctx.fill();

      drawRoundedRect(ctx, JAR.x + 82, JAR.dangerY - 24, (JAR.w - 164) * pct, 10, 5);
      ctx.fillStyle = "#ff1635";
      ctx.fill();
    }

    ctx.restore();
  }

  function drawJarFront() {
    ctx.save();
    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // Crisp Glossy Vertical Reflections on Glass
    ctx.fillStyle = "rgba(255, 255, 255, 0.46)";
    drawRoundedRect(ctx, x + 20, y + 32, 16, h - 85, 8);
    ctx.fill();
    drawRoundedRect(ctx, x + w - 34, y + 55, 10, h - 120, 5);
    ctx.fill();

    // Chunky Jar Rim / Lip at Top with Thick Outline
    drawRoundedRect(ctx, x - 10, y - 15, w + 20, 19, 9.5);
    const rimGrad = ctx.createLinearGradient(x, y - 15, x, y + 4);
    rimGrad.addColorStop(0, "#ffffff");
    rimGrad.addColorStop(0.5, "#caf0f8");
    rimGrad.addColorStop(1, "#90e0ef");
    ctx.fillStyle = rimGrad;
    ctx.fill();
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Rim glossy specular bar
    ctx.fillStyle = "#ffffff";
    drawRoundedRect(ctx, x + 14, y - 12, w - 28, 5, 2.5);
    ctx.fill();

    // Outer Thick Dark Outline Around the Glass Jar
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y + 4);

    ctx.lineWidth = 11.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    ctx.lineWidth = 4.2;
    ctx.strokeStyle = "#ade8f4";
    ctx.stroke();

    // Wooden Evolution Guide Strip Along Bottom
    const stripY = STAGE_H - 28;
    drawPolishedWoodBox(ctx, 46, stripY - 19, STAGE_W - 92, 36, 18);

    const startX = 80;
    const gap = 40;
    for (let i = 0; i < FRUITS.length; i++) {
      const cx = startX + i * gap;
      const dotR = 7 + i * 0.7;
      const g = ctx.createRadialGradient(cx - dotR * 0.3, stripY - 1 - dotR * 0.3, 1, cx, stripY - 1, dotR);
      g.addColorStop(0, FRUITS[i].gradTop);
      g.addColorStop(1, FRUITS[i].gradBot);
      ctx.fillStyle = g;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(cx, stripY - 1, dotR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.arc(cx - dotR * 0.3, stripY - 1 - dotR * 0.3, dotR * 0.28, 0, Math.PI * 2);
      ctx.fill();

      if (i < FRUITS.length - 1) {
        ctx.fillStyle = "#fffdf5";
        ctx.font = "900 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("›", cx + gap * 0.5, stripY + 3);
      }
    }

    ctx.restore();
  }

  function drawDropper() {
    if (gameState !== "PLAYING" || !canDrop) return;

    const x = clampDropperX(dropperX, currentFruitType);
    const y = JAR.dropY;
    const r = FRUITS[currentFruitType].radius;

    // Slingshot-style trajectory dotted line
    ctx.save();
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 6.5;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x, JAR.y + JAR.h - 16);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3.2;
    ctx.stroke();
    ctx.restore();

    // Fluffy Cloud Holder Above Fruit
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.arc(x - 15, y - r - 4, 10, 0, Math.PI * 2);
    ctx.arc(x, y - r - 9, 13.5, 0, Math.PI * 2);
    ctx.arc(x + 15, y - r - 4, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Current fruit waiting to drop
    drawCuteFruit(ctx, x, y, r, currentFruitType, 0, 1, 1, false, "normal");
  }

  function drawComicEffects() {
    // 1. Dust Puffs on Landing/Bounce
    for (let i = 0; i < dustPuffs.length; i++) {
      const dp = dustPuffs[i];
      const alpha = Math.max(0, dp.life / dp.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#fffdf5";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.arc(dp.x, dp.y, dp.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 2. Expanding Impact Rings on Merge
    for (let i = 0; i < impactRings.length; i++) {
      const ir = impactRings[i];
      const alpha = Math.max(0, ir.life / ir.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 9.5 * alpha;
      ctx.beginPath();
      ctx.arc(ir.x, ir.y, ir.currentR || ir.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4.8 * alpha;
      ctx.stroke();
      ctx.restore();
    }

    // 3. Comic Starbursts ("POW!", "POP!", "BAM!")
    for (let i = 0; i < starbursts.length; i++) {
      const sb = starbursts[i];
      const alpha = Math.min(1, (sb.life / sb.maxLife) * 2);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(sb.x, sb.y);
      ctx.rotate(sb.rot);
      ctx.scale(sb.scale, sb.scale);

      const spikes = 12;
      const outerR = 55;
      const innerR = 30;
      ctx.beginPath();
      for (let s = 0; s < spikes * 2; s++) {
        const rad = s % 2 === 0 ? outerR : innerR;
        const ang = (s * Math.PI) / spikes;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

      ctx.fillStyle = sb.color;
      ctx.fill();
      ctx.lineWidth = 4.8;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      ctx.beginPath();
      for (let s = 0; s < spikes * 2; s++) {
        const rad = s % 2 === 0 ? outerR * 0.65 : innerR * 0.65;
        const ang = (s * Math.PI) / spikes;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "#fffdf5";
      ctx.fill();

      drawStrokedText(ctx, sb.word, 0, 7, "900 20px 'Fredoka', 'Impact', sans-serif", "#ff1635", 5.5);
      ctx.restore();
    }

    // 4. Outlined Comic Particles & Stars
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.6;

      if (p.isStar) {
        ctx.beginPath();
        for (let s = 0; s < 10; s++) {
          const rad = s % 2 === 0 ? p.r * 1.35 : p.r * 0.55;
          const ang = (s * Math.PI) / 5;
          const px = Math.cos(ang) * rad;
          const py = Math.sin(ang) * rad;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 5. Confetti with dark comic borders
    for (let i = 0; i < confetti.length; i++) {
      const c = confetti[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.2;
      ctx.fillRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.strokeRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.restore();
    }

    // 6. Floating Merge Score Popups
    for (let i = 0; i < floatingTexts.length; i++) {
      const ft = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      drawStrokedText(
        ctx,
        ft.text,
        ft.x,
        ft.y,
        "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif",
        ft.color,
        6.5
      );
      ctx.restore();
    }
  }

  function getFruitMood(f) {
    if (f.happyTimer > 0) return "happy";
    if (f.dizzyTimer > 0) return "dizzy";
    if (f.age > 0.65 && (f.y - f.radius < JAR.dangerY + 58 || dangerTimer > 0.15)) {
      return "worried";
    }
    return "normal";
  }

  function render() {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    // 1. Sky, Sunbeams, Outlined Clouds & Rolling Grass Hills
    drawSkyAndBackdrop();

    // 2. Wooden Signboard HUD
    drawHUD();

    // 3. Wooden Frame, Jar Back & Aiming Dropper
    drawJarBack();
    drawDropper();

    // 4. Glossy Expressive Fruits inside the Jar
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      const mood = getFruitMood(f);
      drawCuteFruit(
        ctx,
        f.x,
        f.y,
        f.radius,
        f.type,
        f.angle,
        f.scaleX,
        f.scaleY,
        f.blinkTimer < 0,
        mood
      );
    }

    // 5. Jar Front Glass Highlights, Rim & Evolution Plank
    drawJarFront();

    // 6. Comic Pop Effects (Dust, Impact Rings, POW Starbursts, Particles, Confetti)
    drawComicEffects();
  }

  /* ==========================================
     INPUT CONTROLS (MOUSE & TOUCH)
  ========================================== */
  function clientToStageX(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return STAGE_W / 2;
    return ((clientX - rect.left) / rect.width) * STAGE_W;
  }

  let isPointerDown = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (gameState !== "PLAYING") return;
    e.preventDefault();
    ensureAudio();
    isPointerDown = true;
    targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    dropperX = targetDropperX;
  });

  window.addEventListener("pointermove", (e) => {
    if (gameState !== "PLAYING") return;
    if (isPointerDown || e.pointerType === "mouse") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    }
  });

  window.addEventListener("pointerup", (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    if (gameState === "PLAYING") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
      dropperX = targetDropperX;
      dropCurrentFruit();
    }
  });

  window.addEventListener("contextmenu", (e) => e.preventDefault());

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  replayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  /* ==========================================
     RESPONSIVE STAGE SCALING
  ========================================== */
  function handleResize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scaleX = vw / STAGE_W;
    const scaleY = vh / STAGE_H;
    stageScale = Math.min(scaleX, scaleY) * 0.98;
    gameStage.style.transform = `scale(${stageScale})`;
  }

  window.addEventListener("resize", handleResize);

  /* ==========================================
     MAIN 60FPS GAME LOOP
  ========================================== */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    try {
      if (gameState === "PLAYING") {
        updatePhysics(dt);
      }
      updateEffects(dt);
      render();
    } catch (err) {
      // Crash-proof recovery
    }

    requestAnimationFrame(loop);
  }

  // Initialize
  loadStorage();
  initBgClouds();
  handleResize();
  requestAnimationFrame(loop);
})();
</script>
