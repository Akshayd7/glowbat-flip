<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Pop Merge</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: linear-gradient(180deg, #1b9aaa 0%, #48cae4 45%, #ade8f4 80%, #70e000 80%, #38b000 100%);
    font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Comic Sans MS', 'Impact', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #game-stage {
    position: relative;
    width: 480px;
    height: 820px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 18px;
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
  }

  /* Mute Button Always Visible Top-Right */
  #mute-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffd166 0%, #f77f00 100%);
    border: 5px solid #1f1300;
    box-shadow: 0 6px 0 #1f1300, inset 0 4px 0 rgba(255,255,255,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 200;
    transition: transform 0.1s ease;
  }

  #mute-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1f1300, inset 0 3px 0 rgba(255,255,255,0.5);
  }

  #mute-btn svg {
    width: 30px;
    height: 30px;
    fill: #1f1300;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.5));
  }

  /* Overlay Screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(15, 25, 40, 0.65);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 100;
    transition: opacity 0.25s ease;
    border-radius: 18px;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Chunky Wooden Plank Modal */
  .modal-card {
    width: 390px;
    background: repeating-linear-gradient(
      0deg,
      #d48b45 0px,
      #d48b45 44px,
      #a86428 44px,
      #a86428 48px,
      #c67d3b 48px,
      #c67d3b 92px
    );
    border-radius: 30px;
    border: 7px solid #1f1300;
    box-shadow: 
      0 12px 0 #1f1300,
      0 22px 40px rgba(0, 0, 0, 0.55),
      inset 0 6px 0 rgba(255, 230, 180, 0.55),
      inset 0 -8px 0 rgba(70, 35, 5, 0.65);
    padding: 28px 24px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .game-title {
    font-size: 48px;
    line-height: 1.02;
    font-weight: 900;
    color: #ffbe0b;
    -webkit-text-stroke: 3px #1f1300;
    text-shadow: 
      -3px -3px 0 #1f1300,
       3px -3px 0 #1f1300,
      -3px  3px 0 #1f1300,
       3px  3px 0 #1f1300,
       0px  7px 0 #1f1300;
    margin-bottom: 10px;
    letter-spacing: 1.5px;
    transform: rotate(-2deg);
  }

  .subtitle {
    font-size: 18px;
    color: #fff8e6;
    font-weight: 900;
    text-shadow: 
      -2px -2px 0 #1f1300,
       2px -2px 0 #1f1300,
      -2px  2px 0 #1f1300,
       2px  2px 0 #1f1300,
       0px  4px 0 #1f1300;
    margin-bottom: 18px;
  }

  .fruit-parade {
    display: flex;
    gap: 7px;
    justify-content: center;
    align-items: center;
    background: #fdf0d5;
    border: 5px solid #1f1300;
    box-shadow: inset 0 4px 0 rgba(0,0,0,0.12), 0 4px 0 rgba(0,0,0,0.25);
    border-radius: 22px;
    padding: 12px 12px;
    margin-bottom: 24px;
    width: 100%;
  }

  .parade-dot {
    border-radius: 50%;
    border: 3px solid #1f1300;
    box-shadow: inset -2px -3px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.6);
  }

  .btn-primary {
    background: linear-gradient(180deg, #80ed99 0%, #38b000 45%, #008000 100%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 900;
    padding: 15px 40px;
    border-radius: 50px;
    border: 6px solid #1f1300;
    box-shadow: 0 8px 0 #1f1300, 0 14px 20px rgba(0, 0, 0, 0.4), inset 0 5px 0 rgba(255,255,255,0.65);
    cursor: pointer;
    -webkit-text-stroke: 1.5px #1f1300;
    text-shadow: 
      -2px -2px 0 #1f1300,
       2px -2px 0 #1f1300,
      -2px  2px 0 #1f1300,
       2px  2px 0 #1f1300,
       0 4px 0 #1f1300;
    letter-spacing: 1.5px;
    transition: transform 0.1s;
    animation: pulseBtn 1.4s infinite ease-in-out;
  }

  .btn-primary:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #1f1300, inset 0 3px 0 rgba(255,255,255,0.5);
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06) rotate(1deg); }
  }

  .score-box-group {
    display: flex;
    gap: 14px;
    width: 100%;
    margin: 12px 0 26px;
  }

  .score-card {
    flex: 1;
    background: #fdf0d5;
    border: 5px solid #1f1300;
    box-shadow: 0 5px 0 #1f1300, inset 0 -4px 0 #e6ccb2;
    border-radius: 20px;
    padding: 12px 8px;
  }

  .score-card.best {
    background: #fff3b0;
    box-shadow: 0 5px 0 #1f1300, inset 0 -4px 0 #f4a261;
  }

  .score-label {
    font-size: 15px;
    font-weight: 900;
    color: #7f4f24;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .score-card.best .score-label {
    color: #b54500;
  }

  .score-val {
    font-size: 34px;
    font-weight: 900;
    color: #ff2a55;
    text-shadow: 
      -2px -2px 0 #1f1300,
       2px -2px 0 #1f1300,
      -2px  2px 0 #1f1300,
       2px  2px 0 #1f1300,
       0 3px 0 #1f1300;
  }

  .score-card.best .score-val {
    color: #ff9f1c;
  }
</style>
</head>
<body>

<div id="app-wrapper">
  <!-- Mute Button Top-Right -->
  <button id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <div id="game-stage">
    <canvas id="game-canvas" width="480" height="820"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
      <div class="modal-card">
        <div class="game-title">BERRY POP<br>MERGE!</div>
        <div class="subtitle">Drop &amp; smash feisty fruits in the jar!</div>
        <div class="fruit-parade">
          <div class="parade-dot" style="width:14px;height:14px;background:#ff1e42;"></div>
          <div class="parade-dot" style="width:18px;height:18px;background:#ff4d6d;"></div>
          <div class="parade-dot" style="width:22px;height:22px;background:#ff9100;"></div>
          <div class="parade-dot" style="width:26px;height:26px;background:#d90429;"></div>
          <div class="parade-dot" style="width:30px;height:30px;background:#8ac926;"></div>
          <div class="parade-dot" style="width:34px;height:34px;background:#ff758f;"></div>
          <div class="parade-dot" style="width:38px;height:38px;background:#ffbe0b;"></div>
          <div class="parade-dot" style="width:42px;height:42px;background:#52b788;"></div>
          <div class="parade-dot" style="width:48px;height:48px;background:#2b9348;"></div>
        </div>
        <button id="start-btn" class="btn-primary">TAP TO PLAY</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="modal-card">
        <div class="game-title" style="font-size:44px;">GAME OVER</div>
        <div class="subtitle" style="margin-bottom:6px;">The jar is overflowing!</div>
        <div class="score-box-group">
          <div class="score-card">
            <div class="score-label">Score</div>
            <div id="final-score" class="score-val">0</div>
          </div>
          <div class="score-card best">
            <div class="score-label">Best</div>
            <div id="final-best" class="score-val">0</div>
          </div>
        </div>
        <button id="replay-btn" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ==========================================
     CONFIGURATION & FRUIT DEFINITIONS
  ========================================== */
  const STORAGE_KEY = "berrypop_v1";
  const MUTE_KEY = "berrypop_mute_v1";

  const STAGE_W = 480;
  const STAGE_H = 820;
  const OUTLINE_COLOR = "#1f1300";

  // Jar boundaries (Unchanged physics dimensions)
  const JAR = {
    x: 45,
    y: 195,
    w: 390,
    h: 565,
    wall: 12,
    bottomRadius: 38,
    dangerY: 225,
    dropY: 148
  };

  // 9 Bold Feisty Cartoon Fruit Tiers
  // browStyle: 'angry' (V-shaped scowl), 'determined' (flat/intense), 'cheeky' (one raised), 'boss' (heavy furrowed)
  const FRUITS = [
    {

      gradTop: "#ff6b81",
      gradMid: "#ff1635",
      gradBot: "#a30018",

      score: 2,
      faceScale: 0.68,
      browStyle: "angry",
      browColor: "#3d0008"
    },
    {
      name: "Strawberry",
      radius: 28,
      color: "#ff3355",
      gradTop: "#ff758f",
      gradMid: "#ff2a55",
      gradBot: "#b5092b",
      bellyColor: "#ffe5ec",
      score: 4,
      faceScale: 0.8,
      browStyle: "cheeky",
      browColor: "#4a0514"
    },
    {
      name: "Orange",
      radius: 38,
      color: "#ff8800",
      gradTop: "#ffbe0b",
      gradMid: "#ff8800",
      gradBot: "#c45100",
      bellyColor: "#fff3b0",
      score: 8,
      faceScale: 0.92,
      browStyle: "angry",
      browColor: "#4a1c00"
    },
    {
      name: "Apple",
      radius: 49,
      color: "#e6192e",
      gradTop: "#ff5964",
      gradMid: "#d90429",
      gradBot: "#780000",
      bellyColor: "#ffd6d6",
      score: 16,
      faceScale: 1.06,
      browStyle: "boss",
      browColor: "#2b0000"
    },
    {
      name: "Pear",
      radius: 61,
      color: "#80b918",
      gradTop: "#d4fc79",
      gradMid: "#80b918",
      gradBot: "#386641",
      bellyColor: "#e9f5db",
      score: 32,
      faceScale: 1.2,
      browStyle: "determined",
      browColor: "#1b3a10"
    },
    {
      name: "Peach",
      radius: 75,
      color: "#ff7096",
      gradTop: "#ffccd5",
      gradMid: "#ff7096",
      gradBot: "#c9184a",
      bellyColor: "#fff0f3",
      score: 64,
      faceScale: 1.38,
      browStyle: "cheeky",
      browColor: "#590d22"
    },
    {
      name: "Pineapple",
      radius: 90,
      color: "#ffb703",
      gradTop: "#ffee70",
      gradMid: "#ffb703",
      gradBot: "#cc5803",
      bellyColor: "#fff8cc",
      score: 128,
      faceScale: 1.56,
      browStyle: "boss",
      browColor: "#471d00"
    },
    {
      name: "Melon",
      radius: 107,
      color: "#52b788",
      gradTop: "#b7e4c7",
      gradMid: "#52b788",
      gradBot: "#1b4332",
      bellyColor: "#d8f3dc",
      score: 256,
      faceScale: 1.76,
      browStyle: "angry",
      browColor: "#081c15"
    },
    {
      name: "Watermelon",
      radius: 126,
      color: "#2b9348",
      gradTop: "#80ed99",
      gradMid: "#2b9348",
      gradBot: "#004b23",
      bellyColor: "#b7efc5",
      score: 512,
      faceScale: 2.0,
      browStyle: "boss",
      browColor: "#00240f"
    }
  ];

  const COMIC_WORDS = ["POW!", "POP!", "BAM!", "SMASH!", "ZAP!", "BOOM!"];

  /* ==========================================
     STATE VARIABLES
  ========================================== */
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const gameStage = document.getElementById("game-stage");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const startBtn = document.getElementById("start-btn");
  const replayBtn = document.getElementById("replay-btn");
  const muteBtn = document.getElementById("mute-btn");
  const iconSoundOn = document.getElementById("icon-sound-on");
  const iconSoundOff = document.getElementById("icon-sound-off");
  const finalScoreEl = document.getElementById("final-score");
  const finalBestEl = document.getElementById("final-best");

  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let displayScore = 0;
  let bestScore = 0;
  let isMuted = false;

  let fruits = [];
  let particles = [];
  let floatingTexts = [];
  let confetti = [];
  let bgClouds = [];
  let starbursts = [];
  let impactRings = [];
  let dustPuffs = [];

  let currentFruitType = 0;
  let nextFruitType = 0;
  let dropperX = STAGE_W / 2;
  let targetDropperX = STAGE_W / 2;
  let canDrop = true;
  let dropCooldown = 0;
  let dangerTimer = 0; // seconds fruits stay above top line
  let nextFruitId = 1;
  let stageScale = 1;

  /* ==========================================
     LOCAL STORAGE HELPERS (CRASH-PROOF)
  ========================================== */
  function loadStorage() {
    try {
      const savedBest = localStorage.getItem(STORAGE_KEY);
      if (savedBest !== null) {
        bestScore = parseInt(savedBest, 10) || 0;
      }
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedMute !== null) {
        isMuted = savedMute === "1";
      }
    } catch (e) {
      bestScore = 0;
    }
    updateMuteUI();
  }

  function saveBestScore() {
    try {
      localStorage.setItem(STORAGE_KEY, String(bestScore));
    } catch (e) {}
  }

  function saveMuteState() {
    try {
      localStorage.setItem(MUTE_KEY, isMuted ? "1" : "0");
    } catch (e) {}
  }

  /* ==========================================
     WEBAUDIO SYNTHESIS & BACKGROUND MUSIC
  ========================================== */
  let audioCtx = null;
  let bgmTimer = null;
  let bgmStep = 0;

  const MELODY_NOTES = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 587.33
  ];

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playDropSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) {}
  }

  function playMergeSound(tier) {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const baseFreq = 320 + tier * 55;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.75, now + 0.14);
      gain1.gain.setValueAtTime(0.24, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.17);

      if (tier >= 3) {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.06);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.28);
        gain2.gain.setValueAtTime(0.16, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.31);
      }
    } catch (e) {}
  }

  function playGameOverSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const notes = [440, 392, 349.23, 293.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.15);
        gain.gain.setValueAtTime(0.2, now + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.15);
        osc.stop(now + idx * 0.15 + 0.26);
      });
    } catch (e) {}
  }

  function startSoftMusic() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (isMuted || gameState !== "PLAYING" || !audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const freq = MELODY_NOTES[bgmStep % MELODY_NOTES.length];
        bgmStep++;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.038, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }, 380);
  }

  function updateMuteUI() {
    if (isMuted) {
      iconSoundOn.style.display = "none";
      iconSoundOff.style.display = "block";
    } else {
      iconSoundOn.style.display = "block";
      iconSoundOff.style.display = "none";
    }
  }

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    ensureAudio();
    isMuted = !isMuted;
    updateMuteUI();
    saveMuteState();
  });

  /* ==========================================
     GLOBAL GAME OVER FUNCTION (REQUIRED)
  ========================================== */
  function triggerGameOver() {
    if (gameState === "GAMEOVER") return;
    gameState = "GAMEOVER";
    playGameOverSound();

    if (score > bestScore) {
      bestScore = score;
      saveBestScore();
    }

    finalScoreEl.textContent = String(score);
    finalBestEl.textContent = String(bestScore);
    gameoverScreen.classList.remove("hidden");
  }
  window.triggerGameOver = triggerGameOver;

  /* ==========================================
     GAMEPLAY & PHYSICS INITIALIZATION
  ========================================== */
  function initBgClouds() {
    bgClouds = [
      { x: 75, y: 120, scale: 0.9, speed: 0.18 },
      { x: 260, y: 85, scale: 1.15, speed: 0.12 },
      { x: 420, y: 155, scale: 0.78, speed: 0.22 },
      { x: 160, y: 210, scale: 0.65, speed: 0.15 }
    ];
  }

  function randomSpawnFruitType() {
    const weights = [0.38, 0.32, 0.20, 0.10];
    const r = Math.random();
    let sum = 0;
    for (let i = 0; i < weights.length; i++) {
      sum += weights[i];
      if (r <= sum) return i;
    }
    return 0;
  }

  function resetGame() {
    ensureAudio();
    startSoftMusic();

    fruits = [];
    particles = [];
    floatingTexts = [];
    confetti = [];
    starbursts = [];
    impactRings = [];
    dustPuffs = [];
    score = 0;
    displayScore = 0;
    dangerTimer = 0;
    canDrop = true;
    dropCooldown = 0;
    dropperX = STAGE_W / 2;
    targetDropperX = STAGE_W / 2;

    currentFruitType = randomSpawnFruitType();
    nextFruitType = randomSpawnFruitType();

    gameState = "PLAYING";
    startScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
  }

  function clampDropperX(x, type) {
    const r = FRUITS[type].radius;
    const minX = JAR.x + JAR.wall + r + 2;
    const maxX = JAR.x + JAR.w - JAR.wall - r - 2;
    return Math.max(minX, Math.min(maxX, x));
  }

  function spawnFruit(x, y, type, isMerged) {
    const def = FRUITS[type];
    const fruit = {
      id: nextFruitId++,
      type: type,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 0.6,
      vy: isMerged ? -2.2 : 1.5,
      radius: def.radius,
      angle: 0,
      va: 0,
      scaleX: isMerged ? 1.42 : 0.85,
      scaleY: isMerged ? 0.64 : 1.18,
      blinkTimer: 100 + Math.random() * 240,
      happyTimer: isMerged ? 0.95 : 0, // Happy cheering face on merge!
      dizzyTimer: 0,                   // Dizzy eyes on hard bounce!
      hasLanded: isMerged,
      isMerged: !!isMerged,
      age: 0,
      mergedFlag: false
    };
    fruits.push(fruit);
    return fruit;
  }

  function dropCurrentFruit() {
    if (gameState !== "PLAYING" || !canDrop) return;
    ensureAudio();

    const spawnX = clampDropperX(dropperX, currentFruitType);
    spawnFruit(spawnX, JAR.dropY, currentFruitType, false);
    playDropSound();

    canDrop = false;
    dropCooldown = 0.42;

    currentFruitType = nextFruitType;
    nextFruitType = randomSpawnFruitType();
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
  }

  /* ==========================================
     COMIC POP EFFECTS (POW, RINGS, DUST, CONFETTI)
  ========================================== */
  function createDustPuff(x, y, radius, intensity) {
    const count = Math.min(8, Math.max(4, Math.floor(radius * 0.14)));
    for (let i = 0; i < count; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const spdX = dir * (1.2 + Math.random() * 2.8) * intensity;
      const spdY = -0.5 - Math.random() * 1.4;
      dustPuffs.push({
        x: x + dir * (Math.random() * radius * 0.35),
        y: y,
        vx: spdX,
        vy: spdY,
        r: (6 + Math.random() * 7) * Math.min(1.4, intensity),
        life: 0.32 + Math.random() * 0.18,
        maxLife: 0.5
      });
    }
  }

  function createMergeBurst(x, y, type) {
    const def = FRUITS[type];

    // 1. Expanding Comic Impact Ring
    impactRings.push({
      x: x,
      y: y,
      r: def.radius * 0.4,
      maxR: def.radius * 2.15,
      color: def.gradTop,
      life: 0.32,
      maxLife: 0.32
    });

    // 2. Jagged Comic Starburst ("POW!", "POP!", "BAM!")
    const word = COMIC_WORDS[(type + Math.floor(Math.random() * 3)) % COMIC_WORDS.length];
    starbursts.push({
      x: x,
      y: y,
      scale: 0.25,
      targetScale: 0.85 + type * 0.12,
      rot: (Math.random() - 0.5) * 0.35,
      color: type % 2 === 0 ? "#ffbe0b" : "#ff5964",
      word: word,
      life: 0.42,
      maxLife: 0.42
    });

    // 3. Comic Droplets & Star Particles
    const count = 14 + type * 3;
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const spd = 2.5 + Math.random() * 6.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.4,
        r: 5 + Math.random() * (4.5 + type * 0.8),
        color: i % 3 === 0 ? "#ffbe0b" : (i % 2 === 0 ? def.gradTop : "#ffffff"),
        isStar: i % 4 === 0,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        alpha: 1,
        life: 0.48 + Math.random() * 0.25
      });
    }

    // 4. Floating Comic Score Text
    floatingTexts.push({
      x: x,
      y: y - 16,
      text: "+" + def.score,
      color: "#ffbe0b",
      alpha: 1,
      vy: -1.9,
      scale: 1.3
    });

    // 5. Big Merge Confetti
    if (type >= 4) {
      const confettiColors = ["#ff1635", "#ffbe0b", "#38b000", "#00bbf9", "#ff8800", "#9b5de5"];
      const cCount = type >= 6 ? 48 : 26;
      for (let i = 0; i < cCount; i++) {
        confetti.push({
          x: x,
          y: y - 20,
          vx: (Math.random() - 0.5) * 12,
          vy: -4.5 - Math.random() * 7.5,
          w: 9 + Math.random() * 6,
          h: 6 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.28,
          color: confettiColors[i % confettiColors.length],
          life: 1.25 + Math.random() * 0.6
        });
      }
    }
  }

  /* ==========================================
     PHYSICS & MERGE UPDATE STEP
  ========================================== */
  function updatePhysics(dt) {
    const subSteps = 6;
    const gravity = 0.46;
    const innerLeft = JAR.x + JAR.wall;
    const innerRight = JAR.x + JAR.w - JAR.wall;
    const innerBottom = JAR.y + JAR.h - JAR.wall;

    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      f.age += dt;
      f.scaleX += (1 - f.scaleX) * 0.18;
      f.scaleY += (1 - f.scaleY) * 0.18;

      if (f.happyTimer > 0) f.happyTimer = Math.max(0, f.happyTimer - dt);
      if (f.dizzyTimer > 0) f.dizzyTimer = Math.max(0, f.dizzyTimer - dt);

      f.blinkTimer--;
      if (f.blinkTimer < -8) {
        f.blinkTimer = 120 + Math.random() * 220;
      }
    }

    const mergesToProcess = [];

    for (let step = 0; step < subSteps; step++) {
      // 1. Apply forces & move
      for (let i = 0; i < fruits.length; i++) {
        const f = fruits[i];
        f.vy += gravity / subSteps;
        f.vx *= 0.996;
        f.vy *= 0.996;

        f.x += f.vx / subSteps;
        f.y += f.vy / subSteps;
        f.angle += f.va / subSteps;
        f.va *= 0.96;

        // Wall boundaries
        if (f.x - f.radius < innerLeft) {
          f.x = innerLeft + f.radius;
          if (f.vx < -2.6 && step === 0) {
            f.dizzyTimer = 0.45;
            createDustPuff(innerLeft + 4, f.y, f.radius * 0.6, 0.7);
          }
          if (f.vx < 0) f.vx = -f.vx * 0.25;
        } else if (f.x + f.radius > innerRight) {
          f.x = innerRight - f.radius;
          if (f.vx > 2.6 && step === 0) {
            f.dizzyTimer = 0.45;
            createDustPuff(innerRight - 4, f.y, f.radius * 0.6, 0.7);
          }
          if (f.vx > 0) f.vx = -f.vx * 0.25;
        }

        // Floor boundary
        if (f.y + f.radius > innerBottom) {
          f.y = innerBottom - f.radius;
          if (f.vy > 1.8 && step === 0) {
            const squash = Math.min(0.24, f.vy * 0.022);
            f.scaleX = 1 + squash;
            f.scaleY = 1 - squash;

            if (!f.hasLanded || f.vy > 3.2) {
              f.hasLanded = true;
              createDustPuff(f.x, innerBottom - 2, f.radius, Math.min(1.4, f.vy * 0.22));
            }
            if (f.vy > 4.2) {
              f.dizzyTimer = 0.5;
            }
          }
          if (f.vy > 0) f.vy = -f.vy * 0.18;
          f.vx *= 0.92;
          f.va = f.vx * 0.015;
        }
      }

      // 2. Circle-to-Circle Collisions
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.mergedFlag) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.mergedFlag) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = a.radius + b.radius;
          const distSq = dx * dx + dy * dy;

          if (distSq < minDist * minDist) {
            // Check for same-fruit merge
            if (a.type === b.type) {
              a.mergedFlag = true;
              b.mergedFlag = true;
              mergesToProcess.push({ a, b });
              break;
            }

            const dist = Math.sqrt(distSq) || 0.001;
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            const totalR = a.radius + b.radius;
            const weightA = b.radius / totalR;
            const weightB = a.radius / totalR;

            a.x -= nx * overlap * weightA * 0.85;
            a.y -= ny * overlap * weightA * 0.85;
            b.x += nx * overlap * weightB * 0.85;
            b.y += ny * overlap * weightB * 0.85;

            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const restitution = 0.15;
              const impulse = -(1 + restitution) * velAlongNormal;
              a.vx -= impulse * nx * weightA;
              a.vy -= impulse * ny * weightA;
              b.vx += impulse * nx * weightB;
              b.vy += impulse * ny * weightB;

              const tangentX = -ny;
              const tangentY = nx;
              const slip = rvx * tangentX + rvy * tangentY;
              a.va -= slip * 0.0012;
              b.va += slip * 0.0012;

              // Hard impact: squash, dust puff & dizzy expression!
              if (Math.abs(velAlongNormal) > 3.1 && step === 0) {
                a.scaleX = 1.12; a.scaleY = 0.88;
                b.scaleX = 1.12; b.scaleY = 0.88;

                if (!a.hasLanded || !b.hasLanded || Math.abs(velAlongNormal) > 4.2) {
                  a.hasLanded = true;
                  b.hasLanded = true;
                  const cx = a.x + nx * a.radius;
                  const cy = a.y + ny * a.radius;
                  createDustPuff(cx, cy, Math.min(a.radius, b.radius) * 0.85, 0.85);
                }

                if (Math.abs(velAlongNormal) > 3.6) {
                  a.dizzyTimer = 0.55;
                  b.dizzyTimer = 0.55;
                }
              }
            }
          }
        }
      }
    }

    // 3. Execute Merges
    if (mergesToProcess.length > 0) {
      fruits = fruits.filter(f => !f.mergedFlag);

      for (let i = 0; i < mergesToProcess.length; i++) {
        const { a, b } = mergesToProcess[i];
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const nextType = Math.min(FRUITS.length - 1, a.type + 1);

        const gained = FRUITS[nextType].score;
        score += gained;
        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }

        if (a.type < FRUITS.length - 1) {
          const newF = spawnFruit(mx, my, nextType, true);
          newF.x = clampDropperX(newF.x, nextType);
        } else {
          score += 500;
        }

        // Nearby fruits cheer happily when a merge happens close to them!
        for (let k = 0; k < fruits.length; k++) {
          const other = fruits[k];
          const d = Math.hypot(other.x - mx, other.y - my);
          if (d < 150) {
            other.happyTimer = Math.max(other.happyTimer, 0.55);
          }
        }

        playMergeSound(nextType);
        createMergeBurst(mx, my, nextType);
      }
    }

    // 4. Check Danger Line (Fruits staying above JAR.dangerY for 2 seconds)
    let anyAboveLine = false;
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      if (f.age > 0.65 && (f.y - f.radius) < JAR.dangerY) {
        anyAboveLine = true;
        break;
      }
    }

    if (anyAboveLine) {
      dangerTimer += dt;
      if (dangerTimer >= 2.0) {
        triggerGameOver();
      }
    } else {
      dangerTimer = Math.max(0, dangerTimer - dt * 2.2);
    }
  }

  function updateEffects(dt) {
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
    dropperX += (targetDropperX - dropperX) * 0.35;

    if (!canDrop) {
      dropCooldown -= dt;
      if (dropCooldown <= 0) {
        canDrop = true;
      }
    }

    if (displayScore < score) {
      displayScore += Math.ceil((score - displayScore) * 0.2);
    }

    // Drifting cartoon clouds
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      c.x += c.speed;
      if (c.x - 90 > STAGE_W) {
        c.x = -90;
      }
    }

    // Dust puffs
    for (let i = dustPuffs.length - 1; i >= 0; i--) {
      const dp = dustPuffs[i];
      dp.x += dp.vx;
      dp.y += dp.vy;
      dp.vx *= 0.92;
      dp.r += dt * 16;
      dp.life -= dt;
      if (dp.life <= 0) dustPuffs.splice(i, 1);
    }

    // Impact rings
    for (let i = impactRings.length - 1; i >= 0; i--) {
      const ir = impactRings[i];
      ir.life -= dt;
      const progress = 1 - Math.max(0, ir.life / ir.maxLife);
      ir.currentR = ir.r + (ir.maxR - ir.r) * (1 - Math.pow(1 - progress, 3));
      if (ir.life <= 0) impactRings.splice(i, 1);
    }

    // Comic Starbursts
    for (let i = starbursts.length - 1; i >= 0; i--) {
      const sb = starbursts[i];
      sb.life -= dt;
      sb.scale += (sb.targetScale - sb.scale) * 0.35;
      if (sb.life <= 0) starbursts.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22;
      p.rot += p.vRot;
      p.life -= dt;
      p.alpha = Math.max(0, p.life * 2.2);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating score texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.alpha -= dt * 1.1;
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.24;
      c.vx *= 0.98;
      c.rot += c.vRot;
      c.life -= dt;
      if (c.life <= 0) confetti.splice(i, 1);
    }
  }

  /* ==========================================
     BOLD COMIC-CARTOON DRAWING ROUTINES
  ========================================== */
  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawWoodPlankBox(ctx, x, y, w, h, r) {
    ctx.save();
    // Drop shadow
    drawRoundedRect(ctx, x, y + 5, w, h, r);
    ctx.fillStyle = OUTLINE_COLOR;
    ctx.fill();

    // Base wood fill
    drawRoundedRect(ctx, x, y, w, h, r);
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, "#e09f5a");
    grad.addColorStop(0.5, "#c67d3b");
    grad.addColorStop(1, "#9c5a25");
    ctx.fillStyle = grad;
    ctx.fill();

    // Wood grain lines inside clip
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "rgba(85, 40, 5, 0.32)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.35);
    ctx.bezierCurveTo(x + w * 0.3, y + h * 0.25, x + w * 0.7, y + h * 0.45, x + w, y + h * 0.32);
    ctx.moveTo(x, y + h * 0.72);
    ctx.bezierCurveTo(x + w * 0.4, y + h * 0.82, x + w * 0.65, y + h * 0.62, x + w, y + h * 0.75);
    ctx.stroke();

    // Top highlight bevel
    ctx.fillStyle = "rgba(255, 235, 195, 0.45)";
    ctx.fillRect(x, y, w, 6);
    ctx.restore();

    // Thick cartoon outline
    drawRoundedRect(ctx, x, y, w, h, r);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Corner rivets/nails
    const nails = [
      [x + 10, y + 10],
      [x + w - 10, y + 10],
      [x + 10, y + h - 10],
      [x + w - 10, y + h - 10]
    ];
    for (let i = 0; i < nails.length; i++) {
      ctx.fillStyle = "#5c4d3c";
      ctx.beginPath();
      ctx.arc(nails[i][0], nails[i][1], 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCartoonCloud(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.beginPath();
    ctx.arc(-36, 8, 22, Math.PI * 0.5, Math.PI * 1.45);
    ctx.arc(-12, -10, 28, Math.PI * 1.05, Math.PI * 1.9);
    ctx.arc(22, -4, 25, Math.PI * 1.15, Math.PI * 1.95);
    ctx.arc(44, 10, 18, Math.PI * 1.4, Math.PI * 0.5);
    ctx.closePath();

    // Soft blue bottom tint
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.lineWidth = 4.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineJoin = "round";
    ctx.stroke();

    // Inner highlight puff
    ctx.fillStyle = "#e0f7fa";
    ctx.beginPath();
    ctx.ellipse(0, 14, 42, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawGrassTuft(ctx, x, y, scale, flip) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -scale : scale, scale);

    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.quadraticCurveTo(-26, -18, -34, -26);
    ctx.quadraticCurveTo(-16, -18, -10, -6);
    ctx.quadraticCurveTo(-8, -26, -2, -36);
    ctx.quadraticCurveTo(4, -22, 6, -6);
    ctx.quadraticCurveTo(16, -22, 28, -24);
    ctx.quadraticCurveTo(22, -10, 18, 0);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, -36, 0, 0);
    grad.addColorStop(0, "#aacc00");
    grad.addColorStop(1, "#2b9348");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();
    ctx.restore();
  }

  function drawSkyAndBackdrop() {
    ctx.save();

    // 1. Bright Blue Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, STAGE_H);
    skyGrad.addColorStop(0, "#189ab4");
    skyGrad.addColorStop(0.45, "#64dfdf");
    skyGrad.addColorStop(0.75, "#caf0f8");
    skyGrad.addColorStop(1, "#90e0ef");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);

    // Subtle comic sunbeams radiating from center
    ctx.save();
    ctx.translate(STAGE_W * 0.5, JAR.y + 200);
    ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
    for (let i = 0; i < 12; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = (i * Math.PI * 2) / 12;
      const a2 = a1 + Math.PI / 12;
      ctx.arc(0, 0, 650, a1, a2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 2. Soft Cartoon Clouds with Thick Outlines
    for (let i = 0; i < bgClouds.length; i++) {
      const c = bgClouds[i];
      drawCartoonCloud(ctx, c.x, c.y, c.scale);
    }

    // 3. Distant Rolling Green Hills Behind the Jar
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 655);
    ctx.quadraticCurveTo(120, 600, 260, 650);
    ctx.quadraticCurveTo(380, 690, STAGE_W + 10, 635);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    ctx.fillStyle = "#55a630";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Foreground Vibrant Grass Hill
    ctx.beginPath();
    ctx.moveTo(-10, STAGE_H);
    ctx.lineTo(-10, 715);
    ctx.quadraticCurveTo(240, 680, STAGE_W + 10, 715);
    ctx.lineTo(STAGE_W + 10, STAGE_H);
    ctx.closePath();
    const grassGrad = ctx.createLinearGradient(0, 690, 0, STAGE_H);
    grassGrad.addColorStop(0, "#80ed99");
    grassGrad.addColorStop(0.25, "#57cc99");
    grassGrad.addColorStop(1, "#2b9348");
    ctx.fillStyle = grassGrad;
    ctx.fill();
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Grass Tufts flanking the jar
    drawGrassTuft(ctx, 28, 725, 0.9, false);
    drawGrassTuft(ctx, 452, 725, 0.95, true);

    ctx.restore();
  }

  /* ==========================================
     FEISTY / EXPRESSIVE FRUIT CHARACTERS
  ========================================== */
  function drawCuteFruit(ctx, x, y, radius, type, angle, scaleX, scaleY, isBlinking, mood) {
    const def = FRUITS[type];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    // 1. Bold Drop Shadow inside jar
    ctx.fillStyle = "rgba(20, 10, 0, 0.25)";
    ctx.beginPath();
    ctx.arc(0, 5, radius, 0, Math.PI * 2);
    ctx.fill();

    // 2. Top Stems / Leaves / Crown Drawn Behind or Top of Body
    ctx.save();
    if (type === 0) {
      // Cherry curved stem + leaf
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 7.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.82);
      ctx.quadraticCurveTo(6, -radius * 1.48, 14, -radius * 1.6);
      ctx.stroke();

      ctx.strokeStyle = "#55a630";
      ctx.lineWidth = 3.5;
      ctx.stroke();
    } else if (type === 1) {
      // Strawberry spiky green leaf crown
      ctx.fillStyle = "#55a630";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-14, -radius * 0.82);
      ctx.lineTo(-6, -radius * 1.15);
      ctx.lineTo(0, -radius * 0.92);
      ctx.lineTo(6, -radius * 1.15);
      ctx.lineTo(14, -radius * 0.82);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 2 || type === 3 || type === 4 || type === 5) {
      // Chunky cartoon leaf + stem
      ctx.fillStyle = "#6a4c93";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3.5;
      drawRoundedRect(ctx, -3, -radius * 1.16, 6, radius * 0.3, 3);
      ctx.fillStyle = "#7f4f24";
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(8, -radius * 0.98);
      ctx.rotate(-0.35);
      ctx.fillStyle = "#70e000";
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();
      ctx.restore();
    } else if (type === 6) {
      // Pineapple bold spiky crown
      ctx.fillStyle = "#38b000";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 4.5;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-24, -radius * 0.82);
      ctx.lineTo(-16, -radius * 1.22);
      ctx.lineTo(-6, -radius * 0.96);
      ctx.lineTo(0, -radius * 1.32);
      ctx.lineTo(6, -radius * 0.96);
      ctx.lineTo(16, -radius * 1.22);
      ctx.lineTo(24, -radius * 0.82);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (type === 7 || type === 8) {
      // Curly vine tendril on top of Melon & Watermelon
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.92);
      ctx.bezierCurveTo(-12, -radius * 1.22, 16, -radius * 1.28, 6, -radius * 1.05);
      ctx.stroke();
      ctx.strokeStyle = "#55a630";
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.restore();

    // 3. Glossy Saturated Round Body
    const grad = ctx.createRadialGradient(
      -radius * 0.28,
      -radius * 0.35,
      radius * 0.08,
      0,
      0,
      radius
    );
    grad.addColorStop(0, def.gradTop);
    grad.addColorStop(0.55, def.gradMid);
    grad.addColorStop(1, def.gradBot);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    // 4. Clipped Character Details (Belly Patch, Stripes, Seeds, Rim Lighting)
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, radius - 2, 0, Math.PI * 2);
    ctx.clip();

    // Lighter cartoon belly patch at bottom (Angry-Birds-like round character styling)
    ctx.fillStyle = def.bellyColor;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.ellipse(0, radius * 0.78, radius * 0.72, radius * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (type === 1) {
      // Strawberry bold seeds
      ctx.fillStyle = "#ffbe0b";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 1.6;
      const seeds = [[-13, -12], [13, -12], [-17, 5], [17, 5], [-10, 17], [10, 17]];
      for (let s of seeds) {
        ctx.beginPath();
        ctx.ellipse(s[0], s[1], 2.4, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    } else if (type === 2) {
      // Orange dimple spots
      ctx.fillStyle = "rgba(140, 50, 0, 0.32)";
      ctx.beginPath();
      ctx.arc(-radius * 0.58, -radius * 0.15, 3, 0, Math.PI * 2);
      ctx.arc(-radius * 0.48, -radius * 0.38, 2.2, 0, Math.PI * 2);
      ctx.arc(radius * 0.58, -radius * 0.1, 3.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 4) {
      // Pear speckles
      ctx.fillStyle = "rgba(45, 85, 20, 0.35)";
      ctx.beginPath();
      ctx.arc(-radius * 0.52, 8, 3, 0, Math.PI * 2);
      ctx.arc(radius * 0.55, 4, 3.5, 0, Math.PI * 2);
      ctx.arc(radius * 0.42, 18, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 6) {
      // Pineapple bold crosshatch
      ctx.strokeStyle = "rgba(160, 65, 0, 0.32)";
      ctx.lineWidth = 4;
      for (let d = -radius; d <= radius; d += 28) {
        ctx.beginPath();
        ctx.moveTo(d - radius, -radius);
        ctx.lineTo(d + radius, radius);
        ctx.moveTo(d + radius, -radius);
        ctx.lineTo(d - radius, radius);
        ctx.stroke();
      }
    } else if (type === 7) {
      // Melon cantaloupe ribs
      ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(-radius * 0.32, 0, radius * 0.88, -0.85, 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(radius * 0.32, 0, radius * 0.88, Math.PI - 0.85, Math.PI + 0.85);
      ctx.stroke();
    } else if (type === 8) {
      // Watermelon jagged dark stripes
      ctx.strokeStyle = "#003d1b";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      for (let sx = -radius * 0.68; sx <= radius * 0.68; sx += radius * 0.45) {
        ctx.beginPath();
        ctx.moveTo(sx, -radius);
        ctx.quadraticCurveTo(sx * 1.28, 0, sx, radius);
        ctx.stroke();
      }
    }

    // Inner bottom rim shadow for 3D depth
    ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
    ctx.lineWidth = radius * 0.14;
    ctx.beginPath();
    ctx.arc(0, -radius * 0.06, radius, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.restore();

    // 5. Crisp Glossy Highlight Bean (Top-Left)
    ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
    ctx.beginPath();
    ctx.ellipse(-radius * 0.34, -radius * 0.38, radius * 0.25, radius * 0.13, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
    ctx.beginPath();
    ctx.arc(-radius * 0.12, -radius * 0.56, radius * 0.06, 0, Math.PI * 2);
    ctx.fill();

    // 6. Thick Dark Cartoon Outline Around Body
    const outlineW = Math.max(3.8, Math.min(7.5, radius * 0.11));
    ctx.lineWidth = outlineW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.beginPath();
    ctx.arc(0, 0, radius - outlineW * 0.4, 0, Math.PI * 2);
    ctx.stroke();

    // 7. EXPRESSIVE CARTOON EYES, EYEBROWS & MOUTH!
    const fs = def.faceScale;
    const eyeSpan = 8.8 * fs;
    const eyeY = 1.5 * fs;
    const eyeRX = 7.4 * fs;
    const eyeRY = 8.4 * fs;

    // Rosy/Punchy Cheeks
    ctx.fillStyle = "rgba(255, 50, 90, 0.48)";
    ctx.beginPath();
    ctx.ellipse(-eyeSpan * 1.55, eyeY + 6.5 * fs, 4.8 * fs, 3 * fs, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeSpan * 1.55, eyeY + 6.5 * fs, 4.8 * fs, 3 * fs, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- EYES ---
    if (mood === "happy") {
      // Happy cheering curved arcs (^ ^) on merge
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.5, 3.2 * fs);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-eyeSpan, eyeY + 1 * fs, 5.5 * fs, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(eyeSpan, eyeY + 1 * fs, 5.5 * fs, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else if (isBlinking && mood === "normal") {
      // Closed blink line
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.5, 3.0 * fs);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-eyeSpan - eyeRX * 0.8, eyeY);
      ctx.lineTo(-eyeSpan + eyeRX * 0.8, eyeY);
      ctx.moveTo(eyeSpan - eyeRX * 0.8, eyeY);
      ctx.lineTo(eyeSpan + eyeRX * 0.8, eyeY);
      ctx.stroke();
    } else {
      // Big expressive white scleras touching/close together
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = Math.max(2.2, 2.6 * fs);

      // Left eye
      ctx.beginPath();
      ctx.ellipse(-eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Right eye
      ctx.beginPath();
      ctx.ellipse(eyeSpan, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (mood === "dizzy") {
        // Goofy cross-eyed / spinning pupils on bounce!
        const spin = performance.now() * 0.02;
        const pR = 2.8 * fs;
        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(-eyeSpan + Math.cos(spin) * 2.5 * fs, eyeY + Math.sin(spin) * 2.5 * fs, pR, 0, Math.PI * 2);
        ctx.arc(eyeSpan - Math.cos(spin) * 2.5 * fs, eyeY - Math.sin(spin) * 2.5 * fs, pR, 0, Math.PI * 2);
        ctx.fill();
      } else if (mood === "worried") {
        // Tiny jittering panicked pupils looking up at the danger line!
        const jitterX = (Math.random() - 0.5) * 1.5 * fs;
        const pR = 2.3 * fs;
        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(-eyeSpan + jitterX, eyeY - 2 * fs, pR, 0, Math.PI * 2);
        ctx.arc(eyeSpan + jitterX, eyeY - 2 * fs, pR, 0, Math.PI * 2);
        ctx.fill();

        // Sweat drop on side of forehead
        ctx.fillStyle = "#48cae4";
        ctx.strokeStyle = OUTLINE_COLOR;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(eyeSpan * 1.9, eyeY - 9 * fs);
        ctx.quadraticCurveTo(eyeSpan * 2.25, eyeY - 2 * fs, eyeSpan * 1.9, eyeY - 1 * fs);
        ctx.quadraticCurveTo(eyeSpan * 1.55, eyeY - 2 * fs, eyeSpan * 1.9, eyeY - 9 * fs);
        ctx.fill();
        ctx.stroke();
      } else {
        // Bold focused pupils
        const pR = 3.5 * fs;
        ctx.fillStyle = OUTLINE_COLOR;
        ctx.beginPath();
        ctx.arc(-eyeSpan * 0.78, eyeY + 0.5 * fs, pR, 0, Math.PI * 2);
        ctx.arc(eyeSpan * 0.78, eyeY + 0.5 * fs, pR, 0, Math.PI * 2);
        ctx.fill();

        // Crisp eye shine dots
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-eyeSpan * 0.78 - pR * 0.35, eyeY - pR * 0.35, pR * 0.42, 0, Math.PI * 2);
        ctx.arc(eyeSpan * 0.78 - pR * 0.35, eyeY - pR * 0.35, pR * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // --- THICK REACTIVE EYEBROWS ---
    ctx.save();
    ctx.fillStyle = def.browColor;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = Math.max(1.8, 2.0 * fs);
    ctx.lineJoin = "round";

    const browW = 10.5 * fs;
    const browH = 3.8 * fs;
    let leftBrowAngle = 0.32;
    let rightBrowAngle = -0.32;
    let browOffsetY = -eyeRY - 1.5 * fs;

    if (mood === "worried") {
      // Slanted UP in the middle (/ \) for worried panic!
      leftBrowAngle = -0.38;
      rightBrowAngle = 0.38;
      browOffsetY -= 2.2 * fs;
    } else if (mood === "happy") {
      // High arched happy brows
      leftBrowAngle = -0.15;
      rightBrowAngle = 0.15;
      browOffsetY -= 3.5 * fs;
    } else if (mood === "dizzy") {
      // Wonky asymmetric dizzy brows
      leftBrowAngle = -0.28;
      rightBrowAngle = -0.22;
      browOffsetY -= 1.5 * fs;
    } else {
      // Default feisty character brow personality
      if (def.browStyle === "angry") {
        leftBrowAngle = 0.34;
        rightBrowAngle = -0.34;
      } else if (def.browStyle === "boss") {
        leftBrowAngle = 0.42;
        rightBrowAngle = -0.42;
        browOffsetY += 1.2 * fs;
      } else if (def.browStyle === "cheeky") {
        leftBrowAngle = 0.28;
        rightBrowAngle = -0.08;
      } else {
        leftBrowAngle = 0.20;
        rightBrowAngle = -0.20;
      }
    }

    // Left Eyebrow Block
    ctx.save();
    ctx.translate(-eyeSpan, eyeY + browOffsetY);
    ctx.rotate(leftBrowAngle);
    ctx.fillRect(-browW * 0.55, -browH * 0.5, browW, browH);
    ctx.strokeRect(-browW * 0.55, -browH * 0.5, browW, browH);
    ctx.restore();

    // Right Eyebrow Block
    ctx.save();
    ctx.translate(eyeSpan, eyeY + browOffsetY);
    ctx.rotate(rightBrowAngle);
    ctx.fillRect(-browW * 0.45, -browH * 0.5, browW, browH);
    ctx.strokeRect(-browW * 0.45, -browH * 0.5, browW, browH);
    ctx.restore();
    ctx.restore();

    // --- EXPRESSIVE MOUTH ---
    const mouthY = eyeY + eyeRY + 3.2 * fs;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = Math.max(2.2, 2.5 * fs);
    ctx.lineCap = "round";

    if (mood === "happy") {
      // Big open joyful laugh with tongue!
      ctx.fillStyle = "#590d22";
      ctx.beginPath();
      ctx.arc(0, mouthY - 1 * fs, 6.8 * fs, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ff4d6d";
      ctx.beginPath();
      ctx.arc(0, mouthY + 2.5 * fs, 3.6 * fs, Math.PI, 0);
      ctx.fill();
    } else if (mood === "worried") {
      // Wavy/quivering "O" mouth
      ctx.fillStyle = "#590d22";
      ctx.beginPath();
      ctx.ellipse(0, mouthY + 1 * fs, 4.2 * fs, 5.2 * fs, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (mood === "dizzy") {
      // Squiggly dazed mouth
      ctx.beginPath();
      ctx.moveTo(-6 * fs, mouthY + 1 * fs);
      ctx.quadraticCurveTo(-3 * fs, mouthY - 2.5 * fs, 0, mouthY + 1 * fs);
      ctx.quadraticCurveTo(3 * fs, mouthY + 4.5 * fs, 6 * fs, mouthY + 1 * fs);
      ctx.stroke();
    } else {
      // Feisty toothy grin or determined smirk
      if (type >= 3) {
        // Bold clenched-teeth grin
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, mouthY - 1.5 * fs, 6.2 * fs, 0.05 * Math.PI, 0.95 * Math.PI);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        // Cute feisty smirk
        ctx.beginPath();
        ctx.arc(0, mouthY - 1 * fs, 4.8 * fs, 0.15 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawStrokedText(ctx, text, x, y, font, fill, strokeW) {
    ctx.save();
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;

    // Drop shadow
    ctx.fillStyle = OUTLINE_COLOR;
    ctx.fillText(text, x, y + 3);

    ctx.lineWidth = strokeW;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.strokeText(text, x, y);

    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();

    // 1. Score Wooden Plank Sign (Top-Left)
    drawWoodPlankBox(ctx, 20, 16, 146, 76, 18);
    drawStrokedText(ctx, "SCORE", 93, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fff8e6", 4);
    drawStrokedText(ctx, String(displayScore), 93, 76, "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ffbe0b", 6);

    // 2. Best Score Wooden Plank Sign
    drawWoodPlankBox(ctx, 178, 16, 132, 76, 18);
    drawStrokedText(ctx, "BEST", 244, 40, "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fff8e6", 4);
    drawStrokedText(ctx, String(bestScore), 244, 76, "900 28px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#ff9f1c", 6);

    // 3. Next Fruit Wooden Box
    drawWoodPlankBox(ctx, 322, 16, 92, 76, 18);
    drawStrokedText(ctx, "NEXT", 368, 36, "900 13px 'Fredoka', 'Arial Rounded MT Bold', sans-serif", "#fff8e6", 4);

    // Draw scaled preview of next fruit
    const previewRadius = Math.min(20, FRUITS[nextFruitType].radius * 0.72);
    const scaleRatio = previewRadius / FRUITS[nextFruitType].radius;
    drawCuteFruit(ctx, 368, 65, FRUITS[nextFruitType].radius, nextFruitType, 0, scaleRatio, scaleRatio, false, "normal");

    ctx.restore();
  }

  function drawJarBack() {
    ctx.save();

    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // 1. Sturdy Slingshot-Style Wooden Timber Posts Framing the Jar
    const postW = 18;
    // Left Wooden Post
    drawWoodPlankBox(ctx, x - postW + 4, y - 4, postW, h + 12, 8);
    // Right Wooden Post
    drawWoodPlankBox(ctx, x + w - 4, y - 4, postW, h + 12, 8);

    // Heavy Wooden Platform Beam Under the Jar
    drawWoodPlankBox(ctx, 18, y + h - 8, STAGE_W - 36, 34, 12);

    // Foreground Grass Tufts Overlapping the Wooden Base
    drawGrassTuft(ctx, 68, y + h + 24, 0.75, false);
    drawGrassTuft(ctx, 412, y + h + 24, 0.78, true);

    // 2. Translucent Glossy Glass Jar Interior
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y);
    ctx.closePath();

    const glassGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.52)");
    glassGrad.addColorStop(0.5, "rgba(220, 248, 255, 0.34)");
    glassGrad.addColorStop(1, "rgba(255, 255, 255, 0.58)");
    ctx.fillStyle = glassGrad;
    ctx.fill();

    // 3. Top Danger Dashed Line (Comic Red/Yellow Hazard Strip feel)
    const dangerPulse = dangerTimer > 0 ? 0.55 + 0.45 * Math.sin(performance.now() * 0.02) : 0.55;
    ctx.save();
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = dangerTimer > 0 ? 7 : 5;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(JAR.x + JAR.wall + 4, JAR.dangerY);
    ctx.lineTo(JAR.x + JAR.w - JAR.wall - 4, JAR.dangerY);
    ctx.stroke();

    ctx.strokeStyle = dangerTimer > 0
      ? `rgba(255, 22, 53, ${dangerPulse})`
      : "rgba(255, 65, 95, 0.75)";
    ctx.lineWidth = dangerTimer > 0 ? 4 : 2.5;
    ctx.stroke();
    ctx.restore();

    // Warning progress bar if fruits are above danger line
    if (dangerTimer > 0.1) {
      const pct = Math.min(1, dangerTimer / 2.0);
      drawRoundedRect(ctx, JAR.x + 80, JAR.dangerY - 26, JAR.w - 160, 14, 7);
      ctx.fillStyle = OUTLINE_COLOR;
      ctx.fill();

      drawRoundedRect(ctx, JAR.x + 82, JAR.dangerY - 24, (JAR.w - 164) * pct, 10, 5);
      ctx.fillStyle = "#ff1635";
      ctx.fill();
    }

    ctx.restore();
  }

  function drawJarFront() {
    ctx.save();
    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // Crisp Glossy Reflections on Glass
    ctx.fillStyle = "rgba(255, 255, 255, 0.42)";
    drawRoundedRect(ctx, x + 20, y + 32, 16, h - 85, 8);
    ctx.fill();
    drawRoundedRect(ctx, x + w - 34, y + 55, 10, h - 120, 5);
    ctx.fill();

    // Chunky Jar Rim / Lip at Top with Thick Outline
    drawRoundedRect(ctx, x - 10, y - 15, w + 20, 19, 9);
    ctx.fillStyle = "#e0fbfc";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    // Rim glossy highlight
    ctx.fillStyle = "#ffffff";
    drawRoundedRect(ctx, x + 12, y - 12, w - 24, 5, 2.5);
    ctx.fill();

    // Outer Thick Dark Outline Around the Glass Jar
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y + 4);

    ctx.lineWidth = 11;
    ctx.lineCap = "round";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.strokeStyle = "#90e0ef";
    ctx.stroke();

    // Wooden Evolution Guide Strip Along Bottom
    const stripY = STAGE_H - 28;
    drawWoodPlankBox(ctx, 46, stripY - 19, STAGE_W - 92, 36, 18);

    const startX = 80;
    const gap = 40;
    for (let i = 0; i < FRUITS.length; i++) {
      const cx = startX + i * gap;
      ctx.fillStyle = FRUITS[i].color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(cx, stripY - 1, 7 + i * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Tiny highlight dot
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.beginPath();
      ctx.arc(cx - 2, stripY - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      if (i < FRUITS.length - 1) {
        ctx.fillStyle = "#fff8e6";
        ctx.font = "900 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("›", cx + gap * 0.5, stripY + 3);
      }
    }

    ctx.restore();
  }

  function drawDropper() {
    if (gameState !== "PLAYING" || !canDrop) return;

    const x = clampDropperX(dropperX, currentFruitType);
    const y = JAR.dropY;
    const r = FRUITS[currentFruitType].radius;

    // Slingshot-style trajectory dotted line
    ctx.save();
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 6;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x, JAR.y + JAR.h - 16);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    // Wooden Slingshot Gripper / Cloud Holder Above Fruit
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x - 15, y - r - 4, 10, 0, Math.PI * 2);
    ctx.arc(x, y - r - 9, 13, 0, Math.PI * 2);
    ctx.arc(x + 15, y - r - 4, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Current fruit waiting to drop
    drawCuteFruit(ctx, x, y, r, currentFruitType, 0, 1, 1, false, "normal");
  }

  function drawComicEffects() {
    // 1. Dust Puffs on Landing/Bounce
    for (let i = 0; i < dustPuffs.length; i++) {
      const dp = dustPuffs[i];
      const alpha = Math.max(0, dp.life / dp.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#fff8e6";
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(dp.x, dp.y, dp.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 2. Expanding Impact Rings on Merge
    for (let i = 0; i < impactRings.length; i++) {
      const ir = impactRings[i];
      const alpha = Math.max(0, ir.life / ir.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 9 * alpha;
      ctx.beginPath();
      ctx.arc(ir.x, ir.y, ir.currentR || ir.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4.5 * alpha;
      ctx.stroke();
      ctx.restore();
    }

    // 3. Comic Starbursts ("POW!", "POP!", "BAM!")
    for (let i = 0; i < starbursts.length; i++) {
      const sb = starbursts[i];
      const alpha = Math.min(1, (sb.life / sb.maxLife) * 2);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(sb.x, sb.y);
      ctx.rotate(sb.rot);
      ctx.scale(sb.scale, sb.scale);

      // Jagged 12-point comic star polygon
      const spikes = 12;
      const outerR = 54;
      const innerR = 30;
      ctx.beginPath();
      for (let s = 0; s < spikes * 2; s++) {
        const rad = s % 2 === 0 ? outerR : innerR;
        const ang = (s * Math.PI) / spikes;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

      ctx.fillStyle = sb.color;
      ctx.fill();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.stroke();

      // Inner white burst
      ctx.beginPath();
      for (let s = 0; s < spikes * 2; s++) {
        const rad = s % 2 === 0 ? outerR * 0.65 : innerR * 0.65;
        const ang = (s * Math.PI) / spikes;
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "#fff8e6";
      ctx.fill();

      // Comic Word inside starburst
      drawStrokedText(ctx, sb.word, 0, 7, "900 20px 'Fredoka', 'Impact', sans-serif", "#ff1635", 5);
      ctx.restore();
    }

    // 4. Outlined Comic Particles & Stars
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2.5;

      if (p.isStar) {
        ctx.beginPath();
        for (let s = 0; s < 10; s++) {
          const rad = s % 2 === 0 ? p.r * 1.35 : p.r * 0.55;
          const ang = (s * Math.PI) / 5;
          const px = Math.cos(ang) * rad;
          const py = Math.sin(ang) * rad;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 5. Confetti with dark comic borders
    for (let i = 0; i < confetti.length; i++) {
      const c = confetti[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.strokeStyle = OUTLINE_COLOR;
      ctx.lineWidth = 2;
      ctx.fillRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.strokeRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.restore();
    }

    // 6. Floating Merge Score Popups
    for (let i = 0; i < floatingTexts.length; i++) {
      const ft = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      drawStrokedText(
        ctx,
        ft.text,
        ft.x,
        ft.y,
        "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif",
        ft.color,
        6
      );
      ctx.restore();
    }
  }

  function getFruitMood(f) {
    if (f.happyTimer > 0) return "happy";
    if (f.dizzyTimer > 0) return "dizzy";
    // Worried expression when settled near the top danger line or when danger timer is active
    if (f.age > 0.65 && (f.y - f.radius < JAR.dangerY + 58 || dangerTimer > 0.15)) {
      return "worried";
    }
    return "normal";
  }

  function render() {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    // 1. Sky, Sunbeams, Outlined Clouds & Rolling Grass Hills
    drawSkyAndBackdrop();

    // 2. Wooden Signboard HUD
    drawHUD();

    // 3. Wooden Frame, Jar Back & Aiming Dropper
    drawJarBack();
    drawDropper();

    // 4. Feisty Expressive Fruits inside the Jar
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      const mood = getFruitMood(f);
      drawCuteFruit(
        ctx,
        f.x,
        f.y,
        f.radius,
        f.type,
        f.angle,
        f.scaleX,
        f.scaleY,
        f.blinkTimer < 0,
        mood
      );
    }

    // 5. Jar Front Glass Highlights, Rim & Evolution Plank
    drawJarFront();

    // 6. Comic Pop Effects (Dust, Impact Rings, POW Starbursts, Particles, Confetti)
    drawComicEffects();
  }

  /* ==========================================
     INPUT CONTROLS (MOUSE & TOUCH)
  ========================================== */
  function clientToStageX(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return STAGE_W / 2;
    return ((clientX - rect.left) / rect.width) * STAGE_W;
  }

  let isPointerDown = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (gameState !== "PLAYING") return;
    e.preventDefault();
    ensureAudio();
    isPointerDown = true;
    targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    dropperX = targetDropperX;
  });

  window.addEventListener("pointermove", (e) => {
    if (gameState !== "PLAYING") return;
    if (isPointerDown || e.pointerType === "mouse") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    }
  });

  window.addEventListener("pointerup", (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    if (gameState === "PLAYING") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
      dropperX = targetDropperX;
      dropCurrentFruit();
    }
  });

  window.addEventListener("contextmenu", (e) => e.preventDefault());

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  replayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  /* ==========================================
     RESPONSIVE STAGE SCALING
  ========================================== */
  function handleResize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scaleX = vw / STAGE_W;
    const scaleY = vh / STAGE_H;
    stageScale = Math.min(scaleX, scaleY) * 0.98;
    gameStage.style.transform = `scale(${stageScale})`;
  }

  window.addEventListener("resize", handleResize);

  /* ==========================================
     MAIN 60FPS GAME LOOP
  ========================================== */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    try {
      if (gameState === "PLAYING") {
        updatePhysics(dt);
      }
      updateEffects(dt);
      render();
    } catch (err) {
      // Crash-proof recovery
    }

    requestAnimationFrame(loop);
  }

  // Initialize
  loadStorage();
  initBgClouds();
  handleResize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
