<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Pop Merge</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: linear-gradient(180deg, #74d4ff 0%, #b8f2e6 65%, #d8f8e1 100%);
    font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Comic Sans MS', 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Decorative background clouds/bubbles */
  .bg-cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.45);
    border-radius: 50px;
    pointer-events: none;
    filter: blur(1px);
  }

  #game-stage {
    position: relative;
    width: 480px;
    height: 820px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Mute Button Always Visible Top-Right */
  #mute-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #386641;
    box-shadow: 0 5px 0 #386641, 0 8px 15px rgba(0,0,0,0.18);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 200;
    transition: transform 0.1s ease, background 0.2s;
  }

  #mute-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #386641;
  }

  #mute-btn svg {
    width: 28px;
    height: 28px;
    fill: #386641;
  }

  /* Overlay Screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(25, 65, 85, 0.48);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 100;
    transition: opacity 0.25s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .modal-card {
    width: 380px;
    background: #fffdf7;
    border-radius: 36px;
    border: 6px solid #4a7c59;
    box-shadow: 0 12px 0 #386641, 0 20px 35px rgba(0, 0, 0, 0.28);
    padding: 28px 24px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .game-title {
    font-size: 46px;
    line-height: 1.05;
    font-weight: 900;
    color: #ff4769;
    text-shadow: 
      -3px -3px 0 #fff,
       3px -3px 0 #fff,
      -3px  3px 0 #fff,
       3px  3px 0 #fff,
       0px  6px 0 #c9184a;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 18px;
    color: #52796f;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .fruit-parade {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    background: #e8f8f5;
    border: 3px dashed #76c893;
    border-radius: 22px;
    padding: 12px 14px;
    margin-bottom: 24px;
    width: 100%;
  }

  .parade-dot {
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.2);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,0.15);
  }

  .btn-primary {
    background: linear-gradient(180deg, #ff758f 0%, #ff4769 100%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 900;
    padding: 16px 42px;
    border-radius: 50px;
    border: 5px solid #ffffff;
    box-shadow: 0 7px 0 #c9184a, 0 12px 20px rgba(255, 71, 105, 0.45);
    cursor: pointer;
    text-shadow: 0 2px 0 #c9184a;
    letter-spacing: 1px;
    transition: transform 0.1s;
    animation: pulseBtn 1.6s infinite ease-in-out;
  }

  .btn-primary:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #c9184a;
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .score-box-group {
    display: flex;
    gap: 16px;
    width: 100%;
    margin: 14px 0 26px;
  }

  .score-card {
    flex: 1;
    background: #eef9f3;
    border: 4px solid #76c893;
    border-radius: 24px;
    padding: 12px 8px;
  }

  .score-card.best {
    background: #fff8e6;
    border-color: #ffb703;
  }

  .score-label {
    font-size: 15px;
    font-weight: 800;
    color: #52796f;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .score-card.best .score-label {
    color: #d48b00;
  }

  .score-val {
    font-size: 34px;
    font-weight: 900;
    color: #2d6a4f;
  }

  .score-card.best .score-val {
    color: #fb8500;
  }
</style>
</head>
<body>

<div id="app-wrapper">
  <!-- Mute Button Top-Right -->
  <button id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <div id="game-stage">
    <canvas id="game-canvas" width="480" height="820"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
      <div class="modal-card">
        <div class="game-title">BERRY POP<br>MERGE!</div>
        <div class="subtitle">Drop &amp; match cute fruits in the jar!</div>
        <div class="fruit-parade">
          <div class="parade-dot" style="width:14px;height:14px;background:#ff3b56;"></div>
          <div class="parade-dot" style="width:18px;height:18px;background:#ff6584;"></div>
          <div class="parade-dot" style="width:22px;height:22px;background:#ff9f1c;"></div>
          <div class="parade-dot" style="width:26px;height:26px;background:#e63946;"></div>
          <div class="parade-dot" style="width:30px;height:30px;background:#a7c957;"></div>
          <div class="parade-dot" style="width:34px;height:34px;background:#ff9ebb;"></div>
          <div class="parade-dot" style="width:38px;height:38px;background:#ffd166;"></div>
          <div class="parade-dot" style="width:42px;height:42px;background:#70e000;"></div>
          <div class="parade-dot" style="width:48px;height:48px;background:#2ec4b6;"></div>
        </div>
        <button id="start-btn" class="btn-primary">TAP TO PLAY</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="modal-card">
        <div class="game-title" style="font-size:42px;">GAME OVER</div>
        <div class="subtitle" style="margin-bottom:6px;">The jar is overflowing!</div>
        <div class="score-box-group">
          <div class="score-card">
            <div class="score-label">Score</div>
            <div id="final-score" class="score-val">0</div>
          </div>
          <div class="score-card best">
            <div class="score-label">Best</div>
            <div id="final-best" class="score-val">0</div>
          </div>
        </div>
        <button id="replay-btn" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ==========================================
     CONFIGURATION & FRUIT DEFINITIONS
  ========================================== */
  const STORAGE_KEY = "berrypop_v1";
  const MUTE_KEY = "berrypop_mute_v1";

  const STAGE_W = 480;
  const STAGE_H = 820;

  // Jar boundaries
  const JAR = {
    x: 45,
    y: 195,
    w: 390,
    h: 565,
    wall: 12,
    bottomRadius: 38,
    dangerY: 225,
    dropY: 148
  };

  // 9 Cute Fruit Tiers
  const FRUITS = [
    {
      name: "Cherry",
      radius: 20,
      color: "#ff2a55",
      gradTop: "#ff5c7c",
      gradBot: "#d90429",
      stroke: "#800f2f",
      score: 2,
      faceScale: 0.65
    },
    {
      name: "Strawberry",
      radius: 28,
      color: "#ff5d73",
      gradTop: "#ff8598",
      gradBot: "#e63956",
      stroke: "#9e1931",
      score: 4,
      faceScale: 0.78
    },
    {
      name: "Orange",
      radius: 38,
      color: "#ff9f1c",
      gradTop: "#ffbf69",
      gradBot: "#f77f00",
      stroke: "#9c4f00",
      score: 8,
      faceScale: 0.9
    },
    {
      name: "Apple",
      radius: 49,
      color: "#e63946",
      gradTop: "#ff6b6b",
      gradBot: "#c1121f",
      stroke: "#780000",
      score: 16,
      faceScale: 1.05
    },
    {
      name: "Pear",
      radius: 61,
      color: "#a7c957",
      gradTop: "#c7e576",
      gradBot: "#6a994e",
      stroke: "#386641",
      score: 32,
      faceScale: 1.2
    },
    {
      name: "Peach",
      radius: 75,
      color: "#ff9ebb",
      gradTop: "#ffc2d4",
      gradBot: "#ff6b9d",
      stroke: "#a3335c",
      score: 64,
      faceScale: 1.38
    },
    {
      name: "Pineapple",
      radius: 90,
      color: "#ffd166",
      gradTop: "#ffe396",
      gradBot: "#f4a261",
      stroke: "#9c5a1a",
      score: 128,
      faceScale: 1.55
    },
    {
      name: "Melon",
      radius: 107,
      color: "#80ed99",
      gradTop: "#b7efc5",
      gradBot: "#57cc99",
      stroke: "#22577a",
      score: 256,
      faceScale: 1.75
    },
    {
      name: "Watermelon",
      radius: 126,
      color: "#38b000",
      gradTop: "#70e000",
      gradBot: "#007200",
      stroke: "#004b23",
      score: 512,
      faceScale: 2.0
    }
  ];

  /* ==========================================
     STATE VARIABLES
  ========================================== */
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const gameStage = document.getElementById("game-stage");
  const startScreen = document.getElementById("start-screen");
  const gameoverScreen = document.getElementById("gameover-screen");
  const startBtn = document.getElementById("start-btn");
  const replayBtn = document.getElementById("replay-btn");
  const muteBtn = document.getElementById("mute-btn");
  const iconSoundOn = document.getElementById("icon-sound-on");
  const iconSoundOff = document.getElementById("icon-sound-off");
  const finalScoreEl = document.getElementById("final-score");
  const finalBestEl = document.getElementById("final-best");

  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let displayScore = 0;
  let bestScore = 0;
  let isMuted = false;

  let fruits = [];
  let particles = [];
  let floatingTexts = [];
  let confetti = [];
  let bgBubbles = [];

  let currentFruitType = 0;
  let nextFruitType = 0;
  let dropperX = STAGE_W / 2;
  let targetDropperX = STAGE_W / 2;
  let canDrop = true;
  let dropCooldown = 0;
  let dangerTimer = 0; // seconds fruits stay above top line
  let nextFruitId = 1;
  let stageScale = 1;

  /* ==========================================
     LOCAL STORAGE HELPERS (CRASH-PROOF)
  ========================================== */
  function loadStorage() {
    try {
      const savedBest = localStorage.getItem(STORAGE_KEY);
      if (savedBest !== null) {
        bestScore = parseInt(savedBest, 10) || 0;
      }
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedMute !== null) {
        isMuted = savedMute === "1";
      }
    } catch (e) {
      bestScore = 0;
    }
    updateMuteUI();
  }

  function saveBestScore() {
    try {
      localStorage.setItem(STORAGE_KEY, String(bestScore));
    } catch (e) {}
  }

  function saveMuteState() {
    try {
      localStorage.setItem(MUTE_KEY, isMuted ? "1" : "0");
    } catch (e) {}
  }

  /* ==========================================
     WEBAUDIO SYNTHESIS & BACKGROUND MUSIC
  ========================================== */
  let audioCtx = null;
  let bgmTimer = null;
  let bgmStep = 0;

  const MELODY_NOTES = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 587.33
  ];

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (e) {}
  }

  function playDropSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) {}
  }

  function playMergeSound(tier) {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const baseFreq = 320 + tier * 55;

      // Pop sound
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.75, now + 0.14);
      gain1.gain.setValueAtTime(0.24, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.17);

      // Sparkle chime for bigger merges
      if (tier >= 3) {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.06);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.28);
        gain2.gain.setValueAtTime(0.16, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.31);
      }
    } catch (e) {}
  }

  function playGameOverSound() {
    if (isMuted || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const notes = [440, 392, 349.23, 293.66];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.15);
        gain.gain.setValueAtTime(0.2, now + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.15);
        osc.stop(now + idx * 0.15 + 0.26);
      });
    } catch (e) {}
  }

  function startSoftMusic() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (isMuted || gameState !== "PLAYING" || !audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const freq = MELODY_NOTES[bgmStep % MELODY_NOTES.length];
        bgmStep++;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.038, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }, 380);
  }

  function updateMuteUI() {
    if (isMuted) {
      iconSoundOn.style.display = "none";
      iconSoundOff.style.display = "block";
    } else {
      iconSoundOn.style.display = "block";
      iconSoundOff.style.display = "none";
    }
  }

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    ensureAudio();
    isMuted = !isMuted;
    updateMuteUI();
    saveMuteState();
  });

  /* ==========================================
     GLOBAL GAME OVER FUNCTION (REQUIRED)
  ========================================== */
  function triggerGameOver() {
    if (gameState === "GAMEOVER") return;
    gameState = "GAMEOVER";
    playGameOverSound();

    if (score > bestScore) {
      bestScore = score;
      saveBestScore();
    }

    finalScoreEl.textContent = String(score);
    finalBestEl.textContent = String(bestScore);
    gameoverScreen.classList.remove("hidden");
  }
  window.triggerGameOver = triggerGameOver;

  /* ==========================================
     GAMEPLAY & PHYSICS INITIALIZATION
  ========================================== */
  function initBgBubbles() {
    bgBubbles = [];
    for (let i = 0; i < 14; i++) {
      bgBubbles.push({
        x: Math.random() * STAGE_W,
        y: Math.random() * STAGE_H,
        r: 12 + Math.random() * 28,
        vy: -0.25 - Math.random() * 0.4,
        alpha: 0.15 + Math.random() * 0.25
      });
    }
  }

  function randomSpawnFruitType() {
    // Drop first 4 smaller fruit types (Cherry, Strawberry, Orange, Apple)
    const weights = [0.38, 0.32, 0.20, 0.10];
    const r = Math.random();
    let sum = 0;
    for (let i = 0; i < weights.length; i++) {
      sum += weights[i];
      if (r <= sum) return i;
    }
    return 0;
  }

  function resetGame() {
    ensureAudio();
    startSoftMusic();

    fruits = [];
    particles = [];
    floatingTexts = [];
    confetti = [];
    score = 0;
    displayScore = 0;
    dangerTimer = 0;
    canDrop = true;
    dropCooldown = 0;
    dropperX = STAGE_W / 2;
    targetDropperX = STAGE_W / 2;

    currentFruitType = randomSpawnFruitType();
    nextFruitType = randomSpawnFruitType();

    gameState = "PLAYING";
    startScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
  }

  function clampDropperX(x, type) {
    const r = FRUITS[type].radius;
    const minX = JAR.x + JAR.wall + r + 2;
    const maxX = JAR.x + JAR.w - JAR.wall - r - 2;
    return Math.max(minX, Math.min(maxX, x));
  }

  function spawnFruit(x, y, type, isMerged) {
    const def = FRUITS[type];
    const fruit = {
      id: nextFruitId++,
      type: type,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 0.6,
      vy: isMerged ? -2.2 : 1.5,
      radius: def.radius,
      angle: 0,
      va: 0,
      scaleX: isMerged ? 1.38 : 0.85,
      scaleY: isMerged ? 0.68 : 1.18,
      blinkTimer: 100 + Math.random() * 240,
      isMerged: !!isMerged,
      age: 0,
      mergedFlag: false
    };
    fruits.push(fruit);
    return fruit;
  }

  function dropCurrentFruit() {
    if (gameState !== "PLAYING" || !canDrop) return;
    ensureAudio();

    const spawnX = clampDropperX(dropperX, currentFruitType);
    spawnFruit(spawnX, JAR.dropY, currentFruitType, false);
    playDropSound();

    canDrop = false;
    dropCooldown = 0.42; // seconds until next fruit ready

    currentFruitType = nextFruitType;
    nextFruitType = randomSpawnFruitType();
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
  }

  /* ==========================================
     PARTICLES, CONFETTI & VISUAL EFFECTS
  ========================================== */
  function createMergeBurst(x, y, type) {
    const def = FRUITS[type];
    const count = 14 + type * 3;
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const spd = 2 + Math.random() * 5.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        r: 4 + Math.random() * (4 + type * 0.8),
        color: i % 2 === 0 ? def.gradTop : "#ffffff",
        alpha: 1,
        life: 0.45 + Math.random() * 0.25
      });
    }

    // Floating score text
    floatingTexts.push({
      x: x,
      y: y - 10,
      text: "+" + def.score,
      color: def.gradTop,
      stroke: def.stroke,
      alpha: 1,
      vy: -1.6,
      scale: 1.25
    });

    // Big merge confetti (Orange or bigger, especially Peach/Pineapple/Melon/Watermelon)
    if (type >= 4) {
      const confettiColors = ["#ff4769", "#ffd166", "#06d6a0", "#118ab2", "#ff9f1c", "#b5179e"];
      const cCount = type >= 6 ? 45 : 24;
      for (let i = 0; i < cCount; i++) {
        confetti.push({
          x: x,
          y: y - 20,
          vx: (Math.random() - 0.5) * 11,
          vy: -4 - Math.random() * 7,
          w: 8 + Math.random() * 6,
          h: 5 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          color: confettiColors[i % confettiColors.length],
          life: 1.2 + Math.random() * 0.6
        });
      }
    }
  }

  /* ==========================================
     PHYSICS & MERGE UPDATE STEP
  ========================================== */
  function updatePhysics(dt) {
    // Sub-stepping for rock-solid stacking & circle collisions
    const subSteps = 6;
    const gravity = 0.46;
    const innerLeft = JAR.x + JAR.wall;
    const innerRight = JAR.x + JAR.w - JAR.wall;
    const innerBottom = JAR.y + JAR.h - JAR.wall;

    // Update fruit ages and springy squash-and-stretch
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      f.age += dt;
      f.scaleX += (1 - f.scaleX) * 0.18;
      f.scaleY += (1 - f.scaleY) * 0.18;

      f.blinkTimer--;
      if (f.blinkTimer < -8) {
        f.blinkTimer = 120 + Math.random() * 220;
      }
    }

    const mergesToProcess = [];

    for (let step = 0; step < subSteps; step++) {
      // 1. Apply forces & move
      for (let i = 0; i < fruits.length; i++) {
        const f = fruits[i];
        f.vy += gravity / subSteps;
        f.vx *= 0.996;
        f.vy *= 0.996;

        f.x += f.vx / subSteps;
        f.y += f.vy / subSteps;
        f.angle += f.va / subSteps;
        f.va *= 0.96;

        // Wall boundaries
        if (f.x - f.radius < innerLeft) {
          f.x = innerLeft + f.radius;
          if (f.vx < 0) f.vx = -f.vx * 0.25;
        } else if (f.x + f.radius > innerRight) {
          f.x = innerRight - f.radius;
          if (f.vx > 0) f.vx = -f.vx * 0.25;
        }

        // Floor boundary
        if (f.y + f.radius > innerBottom) {
          f.y = innerBottom - f.radius;
          if (f.vy > 1.8 && step === 0) {
            const squash = Math.min(0.22, f.vy * 0.02);
            f.scaleX = 1 + squash;
            f.scaleY = 1 - squash;
          }
          if (f.vy > 0) f.vy = -f.vy * 0.18;
          f.vx *= 0.92;
          f.va = f.vx * 0.015;
        }
      }

      // 2. Circle-to-Circle Collisions
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.mergedFlag) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.mergedFlag) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = a.radius + b.radius;
          const distSq = dx * dx + dy * dy;

          if (distSq < minDist * minDist) {
            // Check for same-fruit merge
            if (a.type === b.type) {
              a.mergedFlag = true;
              b.mergedFlag = true;
              mergesToProcess.push({ a, b });
              break;
            }

            const dist = Math.sqrt(distSq) || 0.001;
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            // Mass-weighted positional correction
            const totalR = a.radius + b.radius;
            const weightA = b.radius / totalR;
            const weightB = a.radius / totalR;

            a.x -= nx * overlap * weightA * 0.85;
            a.y -= ny * overlap * weightA * 0.85;
            b.x += nx * overlap * weightB * 0.85;
            b.y += ny * overlap * weightB * 0.85;

            // Velocity impulse
            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const restitution = 0.15;
              const impulse = -(1 + restitution) * velAlongNormal;
              a.vx -= impulse * nx * weightA;
              a.vy -= impulse * ny * weightA;
              b.vx += impulse * nx * weightB;
              b.vy += impulse * ny * weightB;

              // Subtle roll torque
              const tangentX = -ny;
              const tangentY = nx;
              const slip = rvx * tangentX + rvy * tangentY;
              a.va -= slip * 0.0012;
              b.va += slip * 0.0012;

              // Gentle squash on hard impact
              if (Math.abs(velAlongNormal) > 3.5 && step === 0) {
                a.scaleX = 1.1; a.scaleY = 0.9;
                b.scaleX = 1.1; b.scaleY = 0.9;
              }
            }
          }
        }
      }
    }

    // 3. Execute Merges
    if (mergesToProcess.length > 0) {
      fruits = fruits.filter(f => !f.mergedFlag);

      for (let i = 0; i < mergesToProcess.length; i++) {
        const { a, b } = mergesToProcess[i];
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const nextType = Math.min(FRUITS.length - 1, a.type + 1);

        // Add score
        const gained = FRUITS[nextType].score;
        score += gained;
        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }

        // Spawn next tier fruit (or pop two watermelons for huge bonus!)
        if (a.type < FRUITS.length - 1) {
          const newF = spawnFruit(mx, my, nextType, true);
          newF.x = clampDropperX(newF.x, nextType);
        } else {
          // Two Watermelons merged! Extra celebration bonus
          score += 500;
        }

        playMergeSound(nextType);
        createMergeBurst(mx, my, nextType);
      }
    }

    // 4. Check Danger Line (Fruits staying above JAR.dangerY for 2 seconds)
    let anyAboveLine = false;
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      // Ignore newly dropped fruit until it has settled or lived > 0.65s
      if (f.age > 0.65 && (f.y - f.radius) < JAR.dangerY) {
        anyAboveLine = true;
        break;
      }
    }

    if (anyAboveLine) {
      dangerTimer += dt;
      if (dangerTimer >= 2.0) {
        triggerGameOver();
      }
    } else {
      dangerTimer = Math.max(0, dangerTimer - dt * 2.2);
    }
  }

  function updateEffects(dt) {
    // Smooth dropper movement
    targetDropperX = clampDropperX(targetDropperX, currentFruitType);
    dropperX += (targetDropperX - dropperX) * 0.35;

    // Cooldown for dropping
    if (!canDrop) {
      dropCooldown -= dt;
      if (dropCooldown <= 0) {
        canDrop = true;
      }
    }

    // Smooth score counter
    if (displayScore < score) {
      displayScore += Math.ceil((score - displayScore) * 0.2);
    }

    // Background bubbles
    for (let i = 0; i < bgBubbles.length; i++) {
      const b = bgBubbles[i];
      b.y += b.vy;
      if (b.y + b.r < 0) {
        b.y = STAGE_H + b.r;
        b.x = Math.random() * STAGE_W;
      }
    }

    // Burst particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= dt;
      p.alpha = Math.max(0, p.life * 2);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating score texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.alpha -= dt * 1.1;
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.22;
      c.vx *= 0.98;
      c.rot += c.vRot;
      c.life -= dt;
      if (c.life <= 0) confetti.splice(i, 1);
    }
  }

  /* ==========================================
     CARTOON DRAWING ROUTINES
  ========================================== */
  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCuteFruit(ctx, x, y, radius, type, angle, scaleX, scaleY, isBlinking) {
    const def = FRUITS[type];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    // Soft drop shadow
    ctx.fillStyle = "rgba(0, 40, 30, 0.14)";
    ctx.beginPath();
    ctx.arc(0, 4, radius, 0, Math.PI * 2);
    ctx.fill();

    // Main circular body gradient
    const grad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.35, radius * 0.1, 0, 0, radius);
    grad.addColorStop(0, def.gradTop);
    grad.addColorStop(1, def.gradBot);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    // Fruit-specific cute patterns/textures clipped inside circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, radius - 2, 0, Math.PI * 2);
    ctx.clip();

    if (type === 1) {
      // Strawberry seeds
      ctx.fillStyle = "rgba(255, 240, 170, 0.75)";
      const seeds = [[-10, -8], [10, -8], [-14, 6], [14, 6], [0, 14]];
      for (let s of seeds) {
        ctx.beginPath();
        ctx.arc(s[0], s[1], 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === 2) {
      // Orange pores
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.beginPath();
      ctx.arc(radius * 0.45, radius * 0.3, 3, 0, Math.PI * 2);
      ctx.arc(radius * 0.55, radius * 0.1, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 5) {
      // Peach blush cleft
      ctx.strokeStyle = "rgba(215, 65, 115, 0.35)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -radius * 0.3, radius * 0.65, -Math.PI * 0.7, -Math.PI * 0.3);
      ctx.stroke();
    } else if (type === 6) {
      // Pineapple crosshatch
      ctx.strokeStyle = "rgba(210, 115, 20, 0.25)";
      ctx.lineWidth = 3;
      for (let d = -radius; d <= radius; d += 26) {
        ctx.beginPath();
        ctx.moveTo(d - radius, -radius);
        ctx.lineTo(d + radius, radius);
        ctx.moveTo(d + radius, -radius);
        ctx.lineTo(d - radius, radius);
        ctx.stroke();
      }
    } else if (type === 7) {
      // Melon net lines
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(-radius * 0.3, 0, radius * 0.85, -0.8, 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(radius * 0.3, 0, radius * 0.85, Math.PI - 0.8, Math.PI + 0.8);
      ctx.stroke();
    } else if (type === 8) {
      // Watermelon dark green stripes
      ctx.strokeStyle = "#004b23";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      for (let sx = -radius * 0.65; sx <= radius * 0.65; sx += radius * 0.42) {
        ctx.beginPath();
        ctx.moveTo(sx, -radius);
        ctx.quadraticCurveTo(sx * 1.25, 0, sx, radius);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Chunky cartoon outline
    ctx.lineWidth = Math.max(3, radius * 0.085);
    ctx.strokeStyle = def.stroke;
    ctx.beginPath();
    ctx.arc(0, 0, radius - ctx.lineWidth * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // Glossy top-left highlight
    ctx.fillStyle = "rgba(255, 255, 255, 0.48)";
    ctx.beginPath();
    ctx.ellipse(-radius * 0.35, -radius * 0.38, radius * 0.24, radius * 0.13, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // Top stems / leaves per fruit
    ctx.save();
    if (type === 0) {
      // Cherry long stem
      ctx.strokeStyle = "#4f772d";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.85);
      ctx.quadraticCurveTo(6, -radius * 1.45, 12, -radius * 1.55);
      ctx.stroke();
    } else if (type === 1) {
      // Strawberry leafy crown
      ctx.fillStyle = "#52b788";
      ctx.strokeStyle = "#2d6a4f";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -radius * 0.88, 11, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (type === 3 || type === 4 || type === 2) {
      // Little green leaf on top
      ctx.fillStyle = "#70e000";
      ctx.strokeStyle = "#2b9348";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(7, -radius * 0.92, 9, 5, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (type === 6) {
      // Pineapple tuft
      ctx.fillStyle = "#38b000";
      ctx.strokeStyle = "#006400";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, -radius * 0.95, 16, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    // Cute Cartoon Face!
    const fs = def.faceScale;
    const eyeX = 9.5 * fs;
    const eyeY = -1.5 * fs;
    const eyeR = 3.8 * fs;

    // Rosy cheeks
    ctx.fillStyle = "rgba(255, 105, 135, 0.55)";
    ctx.beginPath();
    ctx.ellipse(-eyeX * 1.38, eyeY + 5 * fs, 5 * fs, 3.2 * fs, 0, 0, Math.PI * 2);
    ctx.ellipse(eyeX * 1.38, eyeY + 5 * fs, 5 * fs, 3.2 * fs, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "#2b192e";
    ctx.strokeStyle = "#2b192e";
    if (isBlinking) {
      ctx.lineWidth = 2.5 * fs;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-eyeX - eyeR, eyeY);
      ctx.lineTo(-eyeX + eyeR, eyeY);
      ctx.moveTo(eyeX - eyeR, eyeY);
      ctx.lineTo(eyeX + eyeR, eyeY);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fill();

      // White eye sparkles
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-eyeX - eyeR * 0.3, eyeY - eyeR * 0.3, eyeR * 0.38, 0, Math.PI * 2);
      ctx.arc(eyeX - eyeR * 0.3, eyeY - eyeR * 0.3, eyeR * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    // Happy mouth
    ctx.strokeStyle = "#2b192e";
    ctx.lineWidth = Math.max(2, 2.3 * fs);
    ctx.lineCap = "round";
    ctx.beginPath();
    if (type >= 6) {
      // Big open smile for large fruits
      ctx.fillStyle = "#d90429";
      ctx.arc(0, eyeY + 3 * fs, 6.5 * fs, 0, Math.PI);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.arc(0, eyeY + 2 * fs, 5 * fs, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawHUD() {
    // 1. Score Badge (Top-Left)
    ctx.save();
    drawRoundedRect(ctx, 22, 18, 146, 76, 22);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#386641";
    ctx.stroke();

    ctx.fillStyle = "#52796f";
    ctx.font = "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("SCORE", 95, 41);

    ctx.fillStyle = "#ff4769";
    ctx.font = "900 30px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
    ctx.fillText(String(displayScore), 95, 76);

    // 2. Best Score Badge (Top-Center-Left)
    drawRoundedRect(ctx, 180, 18, 130, 76, 22);
    ctx.fillStyle = "#fff8e6";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#e09f3e";
    ctx.stroke();

    ctx.fillStyle = "#d48b00";
    ctx.font = "900 14px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
    ctx.fillText("BEST", 245, 41);

    ctx.fillStyle = "#fb8500";
    ctx.font = "900 28px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
    ctx.fillText(String(bestScore), 245, 76);

    // 3. Next Fruit Preview Bubble
    drawRoundedRect(ctx, 322, 18, 92, 76, 22);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#386641";
    ctx.stroke();

    ctx.fillStyle = "#52796f";
    ctx.font = "900 13px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
    ctx.fillText("NEXT", 368, 37);

    // Draw scaled preview of next fruit
    const previewRadius = Math.min(20, FRUITS[nextFruitType].radius * 0.72);
    const scaleRatio = previewRadius / FRUITS[nextFruitType].radius;
    drawCuteFruit(ctx, 368, 65, FRUITS[nextFruitType].radius, nextFruitType, 0, scaleRatio, scaleRatio, false);

    ctx.restore();
  }

  function drawJarBack() {
    ctx.save();

    // Wooden/Mint Table Surface under Jar
    drawRoundedRect(ctx, 20, JAR.y + JAR.h - 8, STAGE_W - 40, 32, 16);
    ctx.fillStyle = "#76c893";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#386641";
    ctx.stroke();

    // Translucent Glass Interior
    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y);
    ctx.closePath();

    const glassGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.52)");
    glassGrad.addColorStop(0.5, "rgba(240, 252, 255, 0.35)");
    glassGrad.addColorStop(1, "rgba(255, 255, 255, 0.58)");
    ctx.fillStyle = glassGrad;
    ctx.fill();

    // Top Danger Dashed Line
    const dangerPulse = dangerTimer > 0 ? 0.55 + 0.45 * Math.sin(performance.now() * 0.018) : 0.45;
    ctx.save();
    ctx.strokeStyle = dangerTimer > 0
      ? `rgba(255, 42, 85, ${dangerPulse})`
      : "rgba(255, 95, 125, 0.45)";
    ctx.lineWidth = dangerTimer > 0 ? 5 : 3;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(JAR.x + JAR.wall + 4, JAR.dangerY);
    ctx.lineTo(JAR.x + JAR.w - JAR.wall - 4, JAR.dangerY);
    ctx.stroke();
    ctx.restore();

    // Warning timer bar if fruits are above danger line
    if (dangerTimer > 0.1) {
      const pct = Math.min(1, dangerTimer / 2.0);
      ctx.fillStyle = "rgba(255, 42, 85, 0.85)";
      drawRoundedRect(ctx, JAR.x + 80, JAR.dangerY - 24, (JAR.w - 160) * pct, 12, 6);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawJarFront() {
    ctx.save();
    const x = JAR.x;
    const y = JAR.y;
    const w = JAR.w;
    const h = JAR.h;
    const r = JAR.bottomRadius;

    // Glossy vertical reflection streak on glass
    ctx.fillStyle = "rgba(255, 255, 255, 0.36)";
    drawRoundedRect(ctx, x + 22, y + 35, 16, h - 85, 8);
    ctx.fill();
    drawRoundedRect(ctx, x + w - 34, y + 60, 10, h - 120, 5);
    ctx.fill();

    // Jar Rim / Lip at Top
    drawRoundedRect(ctx, x - 8, y - 14, w + 16, 18, 9);
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#386641";
    ctx.stroke();

    // Outer Thick Jar Wall Border
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x, y + h - r);
    ctx.quadraticCurveTo(x, y + h, x + r, y + h);
    ctx.lineTo(x + w - r, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    ctx.lineTo(x + w, y + 4);

    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#386641";
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.strokeStyle = "#95d5b2";
    ctx.stroke();

    // Cute Evolution Guide Strip along bottom
    const stripY = STAGE_H - 30;
    ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
    drawRoundedRect(ctx, 52, stripY - 18, STAGE_W - 104, 34, 17);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#52b788";
    ctx.stroke();

    const startX = 82;
    const gap = 39.5;
    for (let i = 0; i < FRUITS.length; i++) {
      const cx = startX + i * gap;
      ctx.fillStyle = FRUITS[i].color;
      ctx.strokeStyle = FRUITS[i].stroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, stripY - 1, 7 + i * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (i < FRUITS.length - 1) {
        ctx.fillStyle = "#52796f";
        ctx.font = "900 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("›", cx + gap * 0.5, stripY + 3);
      }
    }

    ctx.restore();
  }

  function drawDropper() {
    if (gameState !== "PLAYING" || !canDrop) return;

    const x = clampDropperX(dropperX, currentFruitType);
    const y = JAR.dropY;
    const r = FRUITS[currentFruitType].radius;

    // Aiming dotted guide line
    ctx.save();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
    ctx.lineWidth = 3.5;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x, JAR.y + JAR.h - 16);
    ctx.stroke();
    ctx.restore();

    // Cute little cloud holder
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#386641";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(x - 14, y - r - 4, 10, 0, Math.PI * 2);
    ctx.arc(x, y - r - 8, 13, 0, Math.PI * 2);
    ctx.arc(x + 14, y - r - 4, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Current fruit waiting to drop
    drawCuteFruit(ctx, x, y, r, currentFruitType, 0, 1, 1, false);
  }

  function render() {
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);

    // 1. Background floating bubbles
    ctx.save();
    for (let i = 0; i < bgBubbles.length; i++) {
      const b = bgBubbles[i];
      ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 2. HUD
    drawHUD();

    // 3. Jar Back & Aiming Dropper
    drawJarBack();
    drawDropper();

    // 4. Fruits inside the Jar
    for (let i = 0; i < fruits.length; i++) {
      const f = fruits[i];
      drawCuteFruit(
        ctx,
        f.x,
        f.y,
        f.radius,
        f.type,
        f.angle,
        f.scaleX,
        f.scaleY,
        f.blinkTimer < 0
      );
    }

    // 5. Jar Front Glass Highlights & Rim
    drawJarFront();

    // 6. Particle Bursts
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 7. Confetti
    for (let i = 0; i < confetti.length; i++) {
      const c = confetti[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
      ctx.restore();
    }

    // 8. Floating Merge Score Popups
    for (let i = 0; i < floatingTexts.length; i++) {
      const ft = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.font = "900 28px 'Fredoka', 'Arial Rounded MT Bold', sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#ffffff";
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = "#ff2a55";
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
  }

  /* ==========================================
     INPUT CONTROLS (MOUSE & TOUCH)
  ========================================== */
  function clientToStageX(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return STAGE_W / 2;
    return ((clientX - rect.left) / rect.width) * STAGE_W;
  }

  let isPointerDown = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (gameState !== "PLAYING") return;
    e.preventDefault();
    ensureAudio();
    isPointerDown = true;
    targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    dropperX = targetDropperX;
  });

  window.addEventListener("pointermove", (e) => {
    if (gameState !== "PLAYING") return;
    if (isPointerDown || e.pointerType === "mouse") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
    }
  });

  window.addEventListener("pointerup", (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    if (gameState === "PLAYING") {
      targetDropperX = clampDropperX(clientToStageX(e.clientX), currentFruitType);
      dropperX = targetDropperX;
      dropCurrentFruit();
    }
  });

  // Prevent context menu or accidental gestures
  window.addEventListener("contextmenu", (e) => e.preventDefault());

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  replayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    resetGame();
  });

  /* ==========================================
     RESPONSIVE STAGE SCALING
  ========================================== */
  function handleResize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scaleX = vw / STAGE_W;
    const scaleY = vh / STAGE_H;
    stageScale = Math.min(scaleX, scaleY) * 0.98;
    gameStage.style.transform = `scale(${stageScale})`;
  }

  window.addEventListener("resize", handleResize);

  /* ==========================================
     MAIN 60FPS GAME LOOP
  ========================================== */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    try {
      if (gameState === "PLAYING") {
        updatePhysics(dt);
      }
      updateEffects(dt);
      render();
    } catch (err) {
      // Crash-proof recovery
    }

    requestAnimationFrame(loop);
  }

  // Initialize
  loadStorage();
  initBgBubbles();
  handleResize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
