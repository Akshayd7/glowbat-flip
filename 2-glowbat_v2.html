      function spawnPatternCluster() {
        // Difficulty ramps smoothly from 0s to 55s
        const ramp = Math.min(1, gameState.elapsed / 55);
        const startX = gameState.nextClusterX;

        // Choose lane: 1 = floor, -1 = ceiling
        // Alternate with occasional double-checks so player flips often
        const lane = Math.random() < 0.5 ? 1 : -1;

        // Cluster size: 1-3 spikes/chompers
        let count = 1;
        const r = Math.random();
        if (ramp < 0.25) {
          count = r < 0.7 ? 1 : 2;
        } else if (ramp < 0.65) {
          count = r < 0.35 ? 1 : r < 0.82 ? 2 : 3;
        } else {
          count = r < 0.2 ? 1 : r < 0.6 ? 2 : 3;
        }

        const spacing = 42;
        for (let i = 0; i < count; i++) {
          const hx = startX + i * spacing;
          const isChomper = (i === Math.floor(count / 2)) || Math.random() < 0.45;
          gameState.hazards.push({
            x: hx,
            lane: lane, // 1 = rises from floor, -1 = hangs from ceiling
            width: 36,
            height: isChomper ? 62 : 52,
            type: isChomper ? 'CHOMPER' : 'THORN',
            phase: Math.random() * Math.PI * 2,
            passed: false
          });
        }

        const clusterWidth = (count - 1) * spacing;
        const clusterCenterX = startX + clusterWidth * 0.5;

        // Place collectible Golden Acorns on the SAFE lane opposite the hazard
        const safeLane = -lane;
        const safeY = safeLane === 1 ? FLOOR_Y - 30 : CEIL_Y + 30;
        const safeAcornCount = Math.max(2, count);
        for (let i = 0; i < safeAcornCount; i++) {
          const ax = clusterCenterX + (i - (safeAcornCount - 1) / 2) * 44;
          gameState.acorns.push({
            x: ax,
            y: safeY,
            collected: false,
            bobOffset: i * 0.7,
            sparklePhase: Math.random() * 6.28
          });
        }

        // Place risky center-arc Golden Acorns between clusters so flipping mid-gap is rewarded
        const gapDistance = 245 - ramp * 78 + Math.random() * 45;
        const midGapX = startX + clusterWidth + gapDistance * 0.52;
        const centerY = (CEIL_Y + FLOOR_Y) * 0.5;
        const arcDir = Math.random() < 0.5 ? -1 : 1;
        for (let i = -1; i <= 1; i++) {
          gameState.acorns.push({
            x: midGapX + i * 38,
            y: centerY + (i === 0 ? arcDir * 36 : 0),
            collected: false,
            bobOffset: (i + 2) * 0.9,
            sparklePhase: Math.random() * 6.28
          });
        }

        gameState.nextClusterX = startX + clusterWidth + gapDistance;

        // Occasionally spawn a floating Power-Up bubble in the mid-gap
        if (gameState.nextClusterX >= gameState.nextPowerupX) {
          const keys = Object.keys(POWERUP_TYPES);
          // Slightly favor non-shield if player already has shield
          const pool = gameState.hasShield
            ? ['MAGNET', 'SLOWMO', 'DOUBLE']
            : keys;
          const chosenKey = pool[Math.floor(Math.random() * pool.length)];

          gameState.powerups.push({
            x: midGapX,
            y: centerY - arcDir * 44,
            type: chosenKey,
            bobPhase: Math.random() * 6.28,
            collected: false
          });

          gameState.nextPowerupX = gameState.nextClusterX + 760 + Math.random() * 420;
        }
      }

      /* =====================================================================
         COLLISION, PICKUPS & GAME OVER LOGIC
      ===================================================================== */
      function addFloatingText(x, y, text, color) {
        gameState.floatingTexts.push({
          x,
          y,
          text,
          color: color || '#ffe14d',
          life: 0.85,
          maxLife: 0.85
        });
      }

      function spawnBurstParticles(x, y, color, count, speed = 130) {
        for (let i = 0; i < count; i++) {
          const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const spd = speed * (0.45 + Math.random() * 0.75);
          gameState.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 4 + Math.random() * 5,
            color,
            life: 0.45 + Math.random() * 0.2,
            maxLife: 0.65
          });
        }
      }

      function handleGameOver() {
        gameState.mode = 'GAMEOVER';
        gameState.gameOverTimestamp = performance.now();
        gameState.shakeTime = 0.35;
        gameState.shakeMag = 10;

        sound.stopMusic();
        sound.playGameOver();

        const finalScore = Math.floor(gameState.score);
        let isNewBest = false;
        if (finalScore > gameState.bestScore) {
          gameState.bestScore = finalScore;
          isNewBest = true;
        }
        saveBestScore(gameState.bestScore);

        updateHUDText();
        startBestEl.textContent = String(gameState.bestScore);

        goScoreEl.textContent = String(finalScore);
        goBestEl.textContent = String(gameState.bestScore);
        goOrbsEl.textContent = String(gameState.orbs);
        goComboEl.textContent = 'x' + gameState.maxCombo;
        newBestBadge.style.display = isNewBest ? 'inline-block' : 'none';

        gameoverScreen.classList.remove('hidden');
      }

      /* =====================================================================
         MAIN UPDATE STEP
      ===================================================================== */
      function update(dt) {
        // Animate background clouds even on Start screen
        const slowFactor = gameState.slowmoTimer > 0 ? 0.6 : 1.0;

        parallax.cloudsFar.forEach((c) => {
          c.x -= c.speed * slowFactor * dt;
          if (c.x < -90) c.x = VW + 90;
        });
        parallax.cloudsNear.forEach((c) => {
          c.x -= c.speed * slowFactor * dt;
          if (c.x < -110) c.x = VW + 110;
        });

        if (gameState.shakeTime > 0) {
          gameState.shakeTime = Math.max(0, gameState.shakeTime - dt);
        }

        // Update particles & floating texts
        for (let i = gameState.particles.length - 1; i >= 0; i--) {
          const p = gameState.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) gameState.particles.splice(i, 1);
        }

        for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
          const ft = gameState.floatingTexts[i];
          ft.y -= 42 * dt;
          ft.life -= dt;
          if (ft.life <= 0) gameState.floatingTexts.splice(i, 1);
        }

        // Blink timer for expressive eyes
        const b = gameState.bat;
        b.blinkTimer -= dt;
        if (b.blinkTimer <= -0.14) {
          b.blinkTimer = 2.4 + Math.random() * 2.2;
        }

        if (gameState.mode !== 'PLAYING' || gameState.paused) {
          // Gentle idle animation on Start screen
          b.flapPhase += dt * 9;
          b.runPhase += dt * 4.5;
          return;
        }

        // Advance active gameplay clock
        gameState.elapsed += dt;

        // Tick down timed power-ups
        let puChanged = false;
        if (gameState.magnetTimer > 0) {
          gameState.magnetTimer = Math.max(0, gameState.magnetTimer - dt);
          puChanged = true;
        }
        if (gameState.slowmoTimer > 0) {
          gameState.slowmoTimer = Math.max(0, gameState.slowmoTimer - dt);
          puChanged = true;
        }
        if (gameState.doubleTimer > 0) {
          gameState.doubleTimer = Math.max(0, gameState.doubleTimer - dt);
          puChanged = true;
        }
        if (puChanged || gameState.hasShield) {
          updatePowerupHUD();
        }

        if (b.hurtTimer > 0) b.hurtTimer = Math.max(0, b.hurtTimer - dt);
        if (b.invulnTimer > 0) b.invulnTimer = Math.max(0, b.invulnTimer - dt);

        // Speed ramps over ~55s from 240 px/s to 455 px/s, scaled by Slow-Mo Clock (40% slower -> 0.6x)
        const ramp = Math.min(1, gameState.elapsed / 55);
        const baseSpeed = 240 + ramp * 215;
        const speed = baseSpeed * (gameState.slowmoTimer > 0 ? 0.6 : 1.0);
        const moveDx = speed * dt;

        gameState.worldDistance += moveDx;
        parallax.mountainOffset = (parallax.mountainOffset + moveDx * 0.12) % VW;
        parallax.hillFarOffset = (parallax.hillFarOffset + moveDx * 0.26) % VW;
        parallax.hillNearOffset = (parallax.hillNearOffset + moveDx * 0.48) % VW;
        parallax.platformScroll = (parallax.platformScroll + moveDx) % 64;

        // Distance score (x2 if Double Star active)
        const doubleMult = gameState.doubleTimer > 0 ? 2 : 1;
        gameState.score += (moveDx * 0.12) * doubleMult;
        if (gameState.score > gameState.bestScore) {
          gameState.bestScore = Math.floor(gameState.score);
        }

        // Update Bat Flip Trajectory & Squash-Stretch
        b.flapPhase += dt * (b.isFlipping ? 22 : 11);
        b.runPhase += dt * (speed * 0.045);

        if (b.isFlipping) {
          const flipDuration = 0.26; // Snappy 260ms gravity flip
          b.flipProgress += dt / flipDuration;
          if (b.flipProgress >= 1) {
            b.flipProgress = 1;
            b.isFlipping = false;
            b.y = b.flipTargetY;
            b.rotation = 0;
            // Squash on landing!
            b.scaleX = 1.32;
            b.scaleY = 0.72;
            // Landing grass/dust puffs
            for (let i = 0; i < 5; i++) {
              gameState.particles.push({
                x: b.x + (Math.random() - 0.5) * 20,
                y: b.lane === 1 ? FLOOR_Y - 3 : CEIL_Y + 3,
                vx: -30 + (Math.random() - 0.5) * 60,
                vy: b.lane === 1 ? -20 - Math.random() * 35 : 20 + Math.random() * 35,
                r: 3.5 + Math.random() * 4,
                color: '#80ed99',
                life: 0.28,
                maxLife: 0.28
              });
            }
          } else {
            // Smooth S-curve with snappy forward-leaning arc
            const t = b.flipProgress;
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            b.y = b.flipStartY + (b.flipTargetY - b.flipStartY) * ease;
            b.rotation = Math.sin(t * Math.PI) * 0.45 * b.flipArcDir;
          }
        } else {
          // Idle / running bob on the platform
          const bob = Math.sin(b.runPhase * 2) * 2.5;
          b.y = (b.lane === 1 ? FLOOR_Y - BAT_RADIUS : CEIL_Y + BAT_RADIUS) + bob * (b.lane === 1 ? -1 : 1);
          b.rotation = 0;
        }

        // Elastic recovery of squash-and-stretch
        b.scaleX += (1 - b.scaleX) * Math.min(1, dt * 14);
        b.scaleY += (1 - b.scaleY) * Math.min(1, dt * 14);

        // Update gentle glow trail behind the bat
        b.trail.unshift({
          x: b.x - 10,
          y: b.y,
          r: 13
        });
        for (let i = b.trail.length - 1; i >= 0; i--) {
          b.trail[i].x -= moveDx * 0.85;
          b.trail[i].r *= 0.92;
          if (b.trail[i].r < 1.8 || i > 14) {
            b.trail.splice(i, 1);
          }
        }

        // Double Star golden aura sparkles
        if (gameState.doubleTimer > 0 && Math.random() < 0.45) {
          gameState.particles.push({
            x: b.x + (Math.random() - 0.5) * 38,
            y: b.y + (Math.random() - 0.5) * 38,
            vx: -30,
            vy: -25 + Math.random() * 50,
            r: 3.5,
            color: '#ffea00',
            life: 0.35,
            maxLife: 0.35
          });
        }

        // Spawn upcoming clusters
        gameState.nextClusterX -= moveDx;
        gameState.nextPowerupX -= moveDx;
        while (gameState.nextClusterX < VW + 260) {
          spawnPatternCluster();
        }

        // Update & check Acorns (Orbs)
        for (let i = gameState.acorns.length - 1; i >= 0; i--) {
          const ac = gameState.acorns[i];
          ac.x -= moveDx;
          ac.bobOffset += dt * 4.2;
          ac.sparklePhase += dt * 5;

          // Acorn Magnet curves nearby acorns toward the bat
          if (gameState.magnetTimer > 0 && !ac.collected) {
            const dx = b.x - ac.x;
            const dy = b.y - ac.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 220) {
              const pull = (1 - dist / 220) * 520 + 180;
              ac.x += (dx / Math.max(1, dist)) * pull * dt;
              ac.y += (dy / Math.max(1, dist)) * pull * dt;
            }
          }

          const distToBat = Math.hypot(ac.x - b.x, ac.y - b.y);
          if (!ac.collected && distToBat < BAT_RADIUS + 16) {
            ac.collected = true;
            gameState.orbs += 1;
            gameState.comboStreak += 1;
            // Grow combo multiplier with consecutive acorn pickups (x1 to x8+)
            gameState.combo = Math.min(12, 1 + gameState.comboStreak);
            if (gameState.combo > gameState.maxCombo) {
              gameState.maxCombo = gameState.combo;
            }

            const pts = 15 * gameState.combo * (gameState.doubleTimer > 0 ? 2 : 1);
            gameState.score += pts;
            if (gameState.score > gameState.bestScore) {
              gameState.bestScore = Math.floor(gameState.score);
            }

            sound.playAcornPickup(gameState.combo);
            bumpComboPill();
            spawnBurstParticles(ac.x, ac.y, '#ffcf33', 8, 120);
            addFloatingText(ac.x, ac.y - 12, '+' + pts, gameState.combo >= 4 ? '#ff4769' : '#ffcf33');
          }

          if (ac.collected || ac.x < -60) {
            gameState.acorns.splice(i, 1);
          }
        }

        // Update & check Power-Ups
        for (let i = gameState.powerups.length - 1; i >= 0; i--) {
          const pu = gameState.powerups[i];
          pu.x -= moveDx;
          pu.bobPhase += dt * 3.8;
          const py = pu.y + Math.sin(pu.bobPhase) * 9;

          if (!pu.collected && Math.hypot(pu.x - b.x, py - b.y) < BAT_RADIUS + 22) {
            pu.collected = true;
            const meta = POWERUP_TYPES[pu.type];
            if (pu.type === 'SHIELD') {
              gameState.hasShield = true;
            } else if (pu.type === 'MAGNET') {
              gameState.magnetTimer = meta.duration;
            } else if (pu.type === 'SLOWMO') {
              gameState.slowmoTimer = meta.duration;
            } else if (pu.type === 'DOUBLE') {
              gameState.doubleTimer = meta.duration;
            }
            sound.playPowerupChirp();
            spawnBurstParticles(pu.x, py, meta.color, 14, 155);
            addFloatingText(pu.x, py - 16, meta.name, meta.color);
            updatePowerupHUD();
          }

          if (pu.collected || pu.x < -60) {
            gameState.powerups.splice(i, 1);
          }
        }

        // Update & check Hazards (Chompers & Thorns)
        for (let i = gameState.hazards.length - 1; i >= 0; i--) {
          const hz = gameState.hazards[i];
          hz.x -= moveDx;
          hz.phase += dt * 7.5;

          // Forgiving cartoon hitbox around the hazard
          const bounceH = hz.height + Math.sin(hz.phase) * 4;
          const hzLeft = hz.x - hz.width * 0.34;
          const hzRight = hz.x + hz.width * 0.34;
          let hzTop, hzBottom;
          if (hz.lane === 1) {
            hzBottom = FLOOR_Y;
            hzTop = FLOOR_Y - bounceH + 8;
          } else {
            hzTop = CEIL_Y;
            hzBottom = CEIL_Y + bounceH - 8;
          }

          // Circle-box overlap check with bat
          if (b.invulnTimer <= 0) {
            const closestX = Math.max(hzLeft, Math.min(b.x, hzRight));
            const closestY = Math.max(hzTop, Math.min(b.y, hzBottom));
            const distSq = (b.x - closestX) ** 2 + (b.y - closestY) ** 2;
            const hitRadius = BAT_RADIUS * 0.72;

            if (distSq < hitRadius * hitRadius) {
              // Hitting a hazard resets consecutive combo multiplier to x1
              gameState.comboStreak = 0;
              gameState.combo = 1;

              if (gameState.hasShield) {
                // Leaf Shield absorbs one hit!
                gameState.hasShield = false;
                b.hurtTimer = 0.45;
                b.invulnTimer = 0.85;
                gameState.shakeTime = 0.22;
                gameState.shakeMag = 7;
                sound.playShieldBreak();
                spawnBurstParticles(b.x, b.y, '#4cd964', 18, 175);
                addFloatingText(b.x, b.y - 20, 'SHIELD SAVED!', '#4cd964');
                updatePowerupHUD();
              } else {
                b.hurtTimer = 0.6;
                spawnBurstParticles(b.x, b.y, '#ff4769', 20, 180);
                handleGameOver();
                return;
              }
            }
          }

          if (hz.x < -80) {
            gameState.hazards.splice(i, 1);
          }
        }

        updateHUDText();
      }

      /* =====================================================================
         CARTOON STORYBOOK CANVAS 2D RENDERER
      ===================================================================== */
      function drawSkyAndSun() {
        // Sunny sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, VH);
        skyGrad.addColorStop(0, '#2ec4ff');
        skyGrad.addColorStop(0.48, '#8be9fd');
        skyGrad.addColorStop(0.78, '#fff3b0');
        skyGrad.addColorStop(1, '#ffd166');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, VW, VH);

        // Warm golden sun with gentle rotating sunbeams
        const sunX = 310;
        const sunY = 235;
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.rotate(performance.now() * 0.00018);
        ctx.fillStyle = 'rgba(255, 243, 160, 0.24)';
        for (let i = 0; i < 12; i++) {
          ctx.rotate((Math.PI * 2) / 12);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-18, -220);
          ctx.lineTo(18, -220);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Sun glow rings
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 95);
        sunGlow.addColorStop(0, '#fffbeb');
        sunGlow.addColorStop(0.4, '#ffe14d');
        sunGlow.addColorStop(1, 'rgba(255, 225, 77, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 95, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff9db';
        ctx.strokeStyle = '#ffbe0b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 36, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      function drawPuffyCloud(x, y, scale, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;

        // Soft warm shadow under cloud
        ctx.fillStyle = '#bde0fe';
        ctx.beginPath();
        ctx.roundRect(-48, 2, 96, 24, 12);
        ctx.fill();

        // Main puffy white lobes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-26, 4, 18, 0, Math.PI * 2);
        ctx.arc(0, -6, 24, 0, Math.PI * 2);
        ctx.arc(26, 4, 17, 0, Math.PI * 2);
        ctx.roundRect(-42, 0, 84, 22, 11);
        ctx.fill();

        ctx.restore();
      }

      function drawMountainsAndHills() {
        // Distant rounded storybook mountains
        ctx.save();
        const mOff = -parallax.mountainOffset;
        for (let rep = 0; rep < 2; rep++) {
          const base = mOff + rep * VW;
          const peaks = [
            { x: base + 65, w: 190, h: 255, c: '#74b3ce' },
            { x: base + 205, w: 220, h: 295, c: '#5aa9c6' },
            { x: base + 340, w: 180, h: 240, c: '#74b3ce' }
          ];
          peaks.forEach((p) => {
            ctx.fillStyle = p.c;
            ctx.beginPath();
            ctx.moveTo(p.x - p.w * 0.5, FLOOR_Y);
            ctx.quadraticCurveTo(p.x, FLOOR_Y - p.h * 1.4, p.x + p.w * 0.5, FLOOR_Y);
            ctx.closePath();
            ctx.fill();

            // Warm snow/sunlit cap
            ctx.fillStyle = 'rgba(255, 250, 230, 0.45)';
            ctx.beginPath();
            ctx.moveTo(p.x - p.w * 0.16, FLOOR_Y - p.h * 0.52);
            ctx.quadraticCurveTo(p.x, FLOOR_Y - p.h * 0.92, p.x + p.w * 0.16, FLOOR_Y - p.h * 0.52);
            ctx.quadraticCurveTo(p.x, FLOOR_Y - p.h * 0.45, p.x - p.w * 0.16, FLOOR_Y - p.h * 0.52);
            ctx.fill();
          });
        }
        ctx.restore();

        // Far rolling green hills
        ctx.save();
        const hfOff = -parallax.hillFarOffset;
        for (let rep = 0; rep < 2; rep++) {
          const base = hfOff + rep * VW;
          ctx.fillStyle = '#70e000';
          ctx.strokeStyle = '#38b000';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(base, FLOOR_Y);
          ctx.quadraticCurveTo(base + 95, FLOOR_Y - 170, base + 195, FLOOR_Y - 75);
          ctx.quadraticCurveTo(base + 295, FLOOR_Y - 155, base + 390, FLOOR_Y);
          ctx.lineTo(base, FLOOR_Y);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();

        // Near rolling lush hills with cute round bushes
        ctx.save();
        const hnOff = -parallax.hillNearOffset;
        for (let rep = 0; rep < 2; rep++) {
          const base = hnOff + rep * VW;
          ctx.fillStyle = '#38b000';
          ctx.strokeStyle = '#1b4d24';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(base, FLOOR_Y);
          ctx.quadraticCurveTo(base + 115, FLOOR_Y - 105, base + 220, FLOOR_Y - 40);
          ctx.quadraticCurveTo(base + 310, FLOOR_Y - 95, base + 390, FLOOR_Y);
          ctx.lineTo(base, FLOOR_Y);
          ctx.fill();
          ctx.stroke();

          // Little sunlit daisies on the near hills
          const flowerSpots = [65, 140, 275, 340];
          flowerSpots.forEach((fx, idx) => {
            const fy = FLOOR_Y - (idx % 2 === 0 ? 34 : 24);
            ctx.fillStyle = '#fff9db';
            ctx.beginPath();
            ctx.arc(base + fx, fy, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffbe0b';
            ctx.beginPath();
            ctx.arc(base + fx, fy, 2.2, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();
      }

      function drawCorridorPlatforms() {
        const scroll = parallax.platformScroll;

        // 1. FLOOR SOIL & CHUNKY GRASSY PLATFORM
        const floorSoilGrad = ctx.createLinearGradient(0, FLOOR_Y, 0, VH);
        floorSoilGrad.addColorStop(0, '#8b5a2b');
        floorSoilGrad.addColorStop(0.35, '#6b3e1e');
        floorSoilGrad.addColorStop(1, '#4a2810');
        ctx.fillStyle = floorSoilGrad;
        ctx.fillRect(0, FLOOR_Y, VW, VH - FLOOR_Y);

        // Soil pebbles & stripes
        ctx.fillStyle = 'rgba(58, 30, 10, 0.38)';
        for (let x = -scroll; x < VW + 64; x += 64) {
          ctx.beginPath();
          ctx.roundRect(x + 12, FLOOR_Y + 34, 26, 12, 6);
          ctx.roundRect(x + 42, FLOOR_Y + 62, 18, 10, 5);
          ctx.fill();
        }

        // Chunky rounded grassy turf boulders along the floor lip
        for (let x = -scroll; x < VW + 64; x += 64) {
          // Drop shadow under grass lip
          ctx.fillStyle = 'rgba(45, 22, 6, 0.45)';
          ctx.beginPath();
          ctx.roundRect(x - 2, FLOOR_Y + 6, 68, 22, 11);
          ctx.fill();

          // Main lush green turf cap
          ctx.fillStyle = '#4cd964';
          ctx.strokeStyle = '#1b4d24';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(x - 2, FLOOR_Y - 6, 68, 24, 12);
          ctx.fill();
          ctx.stroke();

          // Top glossy highlight on turf
          ctx.fillStyle = '#9ef01a';
          ctx.beginPath();
          ctx.roundRect(x + 6, FLOOR_Y - 3, 50, 7, 3.5);
          ctx.fill();
        }

        // 2. CEILING SOIL & CHUNKY GRASSY PLATFORM
        const ceilSoilGrad = ctx.createLinearGradient(0, 0, 0, CEIL_Y);
        ceilSoilGrad.addColorStop(0, '#4a2810');
        ceilSoilGrad.addColorStop(0.65, '#6b3e1e');
        ceilSoilGrad.addColorStop(1, '#8b5a2b');
        ctx.fillStyle = ceilSoilGrad;
        ctx.fillRect(0, 0, VW, CEIL_Y);

        ctx.fillStyle = 'rgba(58, 30, 10, 0.38)';
        for (let x = -scroll; x < VW + 64; x += 64) {
          ctx.beginPath();
          ctx.roundRect(x + 18, CEIL_Y - 52, 26, 12, 6);
          ctx.roundRect(x + 44, CEIL_Y - 82, 18, 10, 5);
          ctx.fill();
        }

        for (let x = -scroll; x < VW + 64; x += 64) {
          // Main hanging grassy turf lip
          ctx.fillStyle = '#4cd964';
          ctx.strokeStyle = '#1b4d24';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(x - 2, CEIL_Y - 18, 68, 24, 12);
          ctx.fill();
          ctx.stroke();

          // Glossy highlight
          ctx.fillStyle = '#9ef01a';
          ctx.beginPath();
          ctx.roundRect(x + 6, CEIL_Y - 4, 50, 6, 3);
          ctx.fill();
        }
      }

      function drawHazards() {
        gameState.hazards.forEach((hz) => {
          ctx.save();
          const bounce = Math.sin(hz.phase) * 4;
          const h = hz.height + bounce;

          if (hz.lane === 1) {
            ctx.translate(hz.x, FLOOR_Y);
          } else {
            ctx.translate(hz.x, CEIL_Y);
            ctx.scale(1, -1); // Flip vertically to hang from ceiling
          }

          if (hz.type === 'CHOMPER') {
            // Cute-but-spiky Cartoon Piranha/Chomper Plant with snapping jaws
            // Stem
            ctx.strokeStyle = '#1b4d24';
            ctx.lineWidth = 9;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(Math.sin(hz.phase) * 6, -h * 0.45, 0, -h + 18);
            ctx.stroke();

            ctx.strokeStyle = '#38b000';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(Math.sin(hz.phase) * 6, -h * 0.45, 0, -h + 18);
            ctx.stroke();

            // Base leaves
            ctx.fillStyle = '#4cd964';
            ctx.strokeStyle = '#1b4d24';
            ctx.lineWidth = 2.8;
            [-1, 1].forEach((dir) => {
              ctx.beginPath();
              ctx.ellipse(dir * 11, -4, 11, 5.5, dir * -0.35, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            });

            // Snapping head
            ctx.translate(0, -h + 16);
            const jawAngle = 0.25 + Math.abs(Math.sin(hz.phase * 1.3)) * 0.42;

            // Lower/left jaw
            ctx.save();
            ctx.rotate(-jawAngle);
            ctx.fillStyle = '#ff2a55';
            ctx.strokeStyle = '#4a0e1e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 17, Math.PI * 0.5, Math.PI * 1.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // White spot
            ctx.fillStyle = '#fff0f3';
            ctx.beginPath();
            ctx.arc(-8, -2, 3.5, 0, Math.PI * 2);
            ctx.fill();
            // Cartoon teeth
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(6, -10);
            ctx.lineTo(0, -6);
            ctx.lineTo(6, -2);
            ctx.lineTo(0, 3);
            ctx.fill();
            ctx.restore();

            // Upper/right jaw
            ctx.save();
            ctx.rotate(jawAngle);
            ctx.fillStyle = '#ff4769';
            ctx.strokeStyle = '#4a0e1e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 17, -Math.PI * 0.5, Math.PI * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff0f3';
            ctx.beginPath();
            ctx.arc(8, -2, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -12);
            ctx.lineTo(-6, -8);
            ctx.lineTo(0, -4);
            ctx.lineTo(-6, 0);
            ctx.lineTo(0, 5);
            ctx.fill();
            ctx.restore();
          } else {
            // Spiky Cartoon Bramble Thorn with personality & angry-cute eyes
            ctx.fillStyle = '#9d4edd';
            ctx.strokeStyle = '#3c096c';
            ctx.lineWidth = 3.2;

            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.quadraticCurveTo(-13, -h * 0.55, 0, -h);
            ctx.quadraticCurveTo(13, -h * 0.55, 15, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Glossy highlight stripe
            ctx.fillStyle = '#c77dff';
            ctx.beginPath();
            ctx.moveTo(-6, -6);
            ctx.quadraticCurveTo(-4, -h * 0.55, -1, -h + 10);
            ctx.quadraticCurveTo(-1, -h * 0.5, -2, -6);
            ctx.fill();

            // Side thorns
            ctx.fillStyle = '#ffe14d';
            ctx.strokeStyle = '#3c096c';
            ctx.lineWidth = 2.5;
            [-1, 1].forEach((dir) => {
              ctx.beginPath();
              ctx.moveTo(dir * 10, -h * 0.35);
              ctx.lineTo(dir * 20, -h * 0.48);
              ctx.lineTo(dir * 8, -h * 0.55);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            });

            // Expressive mischievous eyes
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-4.5, -18, 3.8, 0, Math.PI * 2);
            ctx.arc(4.5, -18, 3.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#240046';
            ctx.beginPath();
            ctx.arc(-4.5, -18, 1.8, 0, Math.PI * 2);
            ctx.arc(4.5, -18, 1.8, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        });
      }

      function drawGoldenAcorns() {
        gameState.acorns.forEach((ac) => {
          const ay = ac.y + Math.sin(ac.bobOffset) * 4.5;
          ctx.save();
          ctx.translate(ac.x, ay);
          ctx.rotate(Math.sin(ac.bobOffset * 0.8) * 0.16);

          // Warm outer glow
          const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 22);
          glow.addColorStop(0, 'rgba(255, 230, 80, 0.75)');
          glow.addColorStop(1, 'rgba(255, 200, 0, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fill();

          // Shiny Golden Acorn Body
          const bodyGrad = ctx.createLinearGradient(-9, -6, 9, 12);
          bodyGrad.addColorStop(0, '#fff3b0');
          bodyGrad.addColorStop(0.45, '#ffcf33');
          bodyGrad.addColorStop(1, '#e07a00');
          ctx.fillStyle = bodyGrad;
          ctx.strokeStyle = '#5c3317';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(-10, -2);
          ctx.bezierCurveTo(-11, 8, -5, 13, 0, 15);
          ctx.bezierCurveTo(5, 13, 11, 8, 10, -2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Glossy highlight on acorn shell
          ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.beginPath();
          ctx.ellipse(-4, 4, 2.4, 5, -0.25, 0, Math.PI * 2);
          ctx.fill();

          // Rich brown beret cap
          ctx.fillStyle = '#8b5a2b';
          ctx.strokeStyle = '#4a2810';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.roundRect(-12, -8, 24, 8, 4);
          ctx.fill();
          ctx.stroke();

          // Stem on top of cap
          ctx.beginPath();
          ctx.moveTo(0, -8);
          ctx.lineTo(2, -13);
          ctx.stroke();

          // Twinkling 4-point sparkle star
          const spScale = 0.6 + Math.abs(Math.sin(ac.sparklePhase)) * 0.55;
          ctx.translate(10, -10);
          ctx.scale(spScale, spScale);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(0, -6);
          ctx.lineTo(1.6, -1.6);
          ctx.lineTo(6, 0);
          ctx.lineTo(1.6, 1.6);
          ctx.lineTo(0, 6);
          ctx.lineTo(-1.6, 1.6);
          ctx.lineTo(-6, 0);
          ctx.lineTo(-1.6, -1.6);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        });
      }

      function drawPowerupBubbles() {
        gameState.powerups.forEach((pu) => {
          const py = pu.y + Math.sin(pu.bobPhase) * 9;
          const meta = POWERUP_TYPES[pu.type];
          ctx.save();
          ctx.translate(pu.x, py);

          // Outer iridescent bubble glow
          const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 30);
          glow.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
          glow.addColorStop(0.65, meta.color + '88');
          glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 30, 0, Math.PI * 2);
          ctx.fill();

          // Bubble rim
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.strokeStyle = meta.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Distinct inner icon drawn in Canvas 2D
          if (pu.type === 'SHIELD') {
            ctx.fillStyle = '#28a745';
            ctx.strokeStyle = '#1b4d24';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-9, 8);
            ctx.quadraticCurveTo(-10, -8, 9, -9);
            ctx.quadraticCurveTo(8, 9, -9, 8);
            ctx.fill();
            ctx.stroke();
          } else if (pu.type === 'MAGNET') {
            ctx.strokeStyle = '#0077b6';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(0, 1, 7, 0, Math.PI, false);
            ctx.moveTo(-7, 1);
            ctx.lineTo(-7, -7);
            ctx.moveTo(7, 1);
            ctx.lineTo(7, -7);
            ctx.stroke();
          } else if (pu.type === 'SLOWMO') {
            ctx.fillStyle = '#80ed99';
            ctx.strokeStyle = '#1b4d24';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 0, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(0, 0);
            ctx.lineTo(4, 2);
            ctx.stroke();
          } else if (pu.type === 'DOUBLE') {
            ctx.fillStyle = '#ffcf33';
            ctx.strokeStyle = '#5c3317';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let s = 0; s < 5; s++) {
              const a1 = (s * 2 * Math.PI) / 5 - Math.PI / 2;
              const a2 = a1 + Math.PI / 5;
              ctx.lineTo(Math.cos(a1) * 10, Math.sin(a1) * 10);
              ctx.lineTo(Math.cos(a2) * 4.5, Math.sin(a2) * 4.5);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          // Bubble specular shine
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.ellipse(-7, -8, 4.5, 2.4, -0.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });
      }

      function drawHeroBat(x, y, scaleXVal, scaleYVal, rot, upsideDown, isWavingOnStart) {
        const b = gameState.bat;
        ctx.save();

        // 1. Gentle golden/warm glow trail behind the bat during gameplay
        if (!isWavingOnStart && b.trail.length > 0) {
          for (let i = b.trail.length - 1; i >= 0; i--) {
            const pt = b.trail[i];
            const alpha = (1 - i / b.trail.length) * 0.42;
            ctx.fillStyle = gameState.doubleTimer > 0
              ? `rgba(255, 215, 0, ${alpha})`
              : `rgba(255, 240, 150, ${alpha})`;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.translate(x, y);

        // Active Power-Up visual effects around the bat
        if (!isWavingOnStart) {
          // Acorn Magnet blue swirl effect
          if (gameState.magnetTimer > 0) {
            ctx.save();
            ctx.rotate(performance.now() * 0.006);
            ctx.strokeStyle = 'rgba(56, 182, 255, 0.75)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.arc(0, 0, 34, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Double Star golden sparkle aura
          if (gameState.doubleTimer > 0) {
            const auraGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 38);
            auraGrad.addColorStop(0, 'rgba(255, 230, 80, 0.55)');
            auraGrad.addColorStop(1, 'rgba(255, 180, 0, 0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 38, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.rotate(rot);
        ctx.scale(scaleXVal, scaleYVal * (upsideDown ? -1 : 1));

        // 2. Tiny Fluttering Hero Cape
        const capeWave = Math.sin(b.flapPhase * 0.9) * 5;
        ctx.fillStyle = '#ff3b6b';
        ctx.strokeStyle = '#5c162e';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(-6, 2);
        ctx.quadraticCurveTo(-24, 6 + capeWave, -30, 15 + capeWave);
        ctx.quadraticCurveTo(-20, 20 + capeWave * 0.6, -4, 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 3. Cute Scalloped Bat Wings (flap animation)
        const wingAngle = isWavingOnStart
          ? Math.sin(b.flapPhase * 0.7) * 0.35
          : Math.sin(b.flapPhase) * (b.isFlipping ? 0.65 : 0.32);

        // Left/Back Wing
        ctx.save();
        ctx.translate(-10, -2);
        ctx.rotate(-0.2 + wingAngle);
        ctx.fillStyle = '#5e35b1';
        ctx.strokeStyle = '#240046';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-18, -14, -25, -2);
        ctx.quadraticCurveTo(-18, 6, -12, 8);
        ctx.quadraticCurveTo(-6, 5, 0, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Right/Front Wing (waves on Start Screen!)
        ctx.save();
        ctx.translate(10, -2);
        ctx.rotate(isWavingOnStart ? -0.55 + Math.sin(b.flapPhase * 1.1) * 0.45 : 0.2 - wingAngle);
        ctx.fillStyle = '#7b2cbf';
        ctx.strokeStyle = '#240046';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(18, -14, 25, -2);
        ctx.quadraticCurveTo(18, 6, 12, 8);
        ctx.quadraticCurveTo(6, 5, 0, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 4. Rounded Ears with warm pink inner ears
        [-1, 1].forEach((dir) => {
          ctx.save();
          ctx.translate(dir * 11, -15);
          ctx.rotate(dir * 0.24);
          ctx.fillStyle = b.hurtTimer > 0 ? '#ff6b8b' : '#7b2cbf';
          ctx.strokeStyle = '#240046';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, -6, 7.5, 11, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ff8fab';
          ctx.beginPath();
          ctx.ellipse(0, -5, 4, 6.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // 5. Chubby Little Bat Body
        const bodyGrad = ctx.createRadialGradient(-5, -6, 4, 0, 0, 22);
        if (b.hurtTimer > 0 && Math.floor(b.hurtTimer * 20) % 2 === 0) {
          bodyGrad.addColorStop(0, '#ffffff');
          bodyGrad.addColorStop(1, '#ff4d6d');
        } else {
          bodyGrad.addColorStop(0, '#9d4edd');
          bodyGrad.addColorStop(1, '#5a189a');
        }
        ctx.fillStyle = bodyGrad;
        ctx.strokeStyle = '#240046';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 18.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Soft lavender belly patch
        ctx.fillStyle = '#e0aaff';
        ctx.beginPath();
        ctx.ellipse(2, 6, 11, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute little orange feet
        ctx.fillStyle = '#ff9f1c';
        ctx.strokeStyle = '#5c3317';
        ctx.lineWidth = 2.2;
        [-6, 7].forEach((fx) => {
          ctx.beginPath();
          ctx.ellipse(fx, 18, 4.5, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        // 6. Big Expressive Eyes + Determined Cute Face
        const isBlinking = b.blinkTimer < 0;
        [-5.5, 7.5].forEach((ex) => {
          if (b.hurtTimer > 0) {
            // Cute shocked '>' '<' eyes when hurt
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(ex - 3, -5);
            ctx.lineTo(ex + 2, -2);
            ctx.lineTo(ex - 3, 1);
            ctx.stroke();
          } else if (isBlinking) {
            ctx.strokeStyle = '#240046';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(ex - 4, -2);
            ctx.lineTo(ex + 4, -2);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#240046';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(ex, -2.5, 5.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Dark iris
            ctx.fillStyle = '#10002b';
            ctx.beginPath();
            ctx.arc(ex + 1.2, -2.5, 3.1, 0, Math.PI * 2);
            ctx.fill();

            // Glossy catchlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ex + 2.2, -4.2, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Rosy cheeks
        ctx.fillStyle = 'rgba(255, 117, 143, 0.72)';
        ctx.beginPath();
        ctx.ellipse(-10, 3, 3.5, 2.2, 0, 0, Math.PI * 2);
        ctx.ellipse(12, 3, 3.5, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Happy determined smile with one cute little fang
        ctx.strokeStyle = '#240046';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(1.5, 2, 4.5, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(3.5, 5.2);
        ctx.lineTo(5.2, 8.8);
        ctx.lineTo(6.8, 4.8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // 7. Visible Green Leaf Ring around the bat while LEAF SHIELD is active
        if (!isWavingOnStart && gameState.hasShield) {
          ctx.save();
          ctx.translate(x, y);
          const spin = performance.now() * 0.004;
          ctx.strokeStyle = 'rgba(76, 217, 100, 0.55)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 31, 0, Math.PI * 2);
          ctx.stroke();

          for (let i = 0; i < 6; i++) {
            const a = spin + (i * Math.PI * 2) / 6;
            ctx.save();
            ctx.translate(Math.cos(a) * 31, Math.sin(a) * 31);
            ctx.rotate(a + Math.PI * 0.5);
            ctx.fillStyle = '#4cd964';
            ctx.strokeStyle = '#1b4d24';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.ellipse(0, 0, 6.5, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }
      }

      function drawParticlesAndPopups() {
        gameState.particles.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        gameState.floatingTexts.forEach((ft) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          ctx.font = '900 16px "Trebuchet MS", sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#4a2810';
          ctx.lineWidth = 4;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });
      }

      function render() {
        ctx.save();
        ctx.scale(scaleX, scaleY);

        // Screen shake on hit
        if (gameState.shakeTime > 0) {
          const sx = (Math.random() - 0.5) * gameState.shakeMag;
          const sy = (Math.random() - 0.5) * gameState.shakeMag;
          ctx.translate(sx, sy);
        }

        drawSkyAndSun();

        // Parallax Clouds
        parallax.cloudsFar.forEach((c) => drawPuffyCloud(c.x, c.y, c.s, 0.78));
        drawMountainsAndHills();
        parallax.cloudsNear.forEach((c) => drawPuffyCloud(c.x, c.y, c.s, 0.94));

        drawCorridorPlatforms();

        if (gameState.mode === 'START') {
          // On Start screen, show the adorable chubby bat waving in the center stage!
          const hoverY = 305 + Math.sin(performance.now() * 0.0045) * 9;
          drawHeroBat(VW * 0.5, hoverY, 1.48, 1.48, -0.04, false, true);
        } else {
          drawGoldenAcorns();
          drawPowerupBubbles();
          drawHazards();

          const b = gameState.bat;
          const upsideDown = !b.isFlipping && b.lane === -1;
          drawHeroBat(b.x, b.y, b.scaleX, b.scaleY, b.rotation, upsideDown, false);
          drawParticlesAndPopups();
        }

        // Cool blue tint overlay while SLOW-MO CLOCK is active
        if (gameState.slowmoTimer > 0 && gameState.mode === 'PLAYING') {
          ctx.fillStyle = 'rgba(0, 180, 216, 0.16)';
          ctx.fillRect(0, 0, VW, VH);
        }

        ctx.restore();
      }

      /* =====================================================================
         INPUT BINDINGS & VISIBILITY PAUSE HANDLING
      ===================================================================== */
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.ensureContext();
        sound.setMuted(!sound.muted);
        syncMuteUI();
      });

      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame(false);
      });

      startScreen.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#mute-btn')) return;
        startGame(false);
      });

      restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame(true);
      });

      gameoverScreen.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#mute-btn')) return;
        if (performance.now() - gameState.gameOverTimestamp < 320) return;
        startGame(true);
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sound.ensureContext();
        if (gameState.mode === 'PLAYING') {
          if (gameState.paused) {
            gameState.paused = false;
          } else {
            triggerFlip();
          }
        } else if (gameState.mode === 'START') {
          startGame(false);
        } else if (gameState.mode === 'GAMEOVER') {
          if (performance.now() - gameState.gameOverTimestamp >= 320) {
            startGame(true);
          }
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'Enter') {
          e.preventDefault();
          sound.ensureContext();
          if (gameState.mode === 'PLAYING') {
            if (gameState.paused) {
              gameState.paused = false;
            } else {
              triggerFlip();
            }
          } else if (gameState.mode === 'START') {
            startGame(false);
          } else if (gameState.mode === 'GAMEOVER') {
            if (performance.now() - gameState.gameOverTimestamp >= 320) {
              startGame(true);
            }
          }
        } else if (e.code === 'KeyM') {
          sound.ensureContext();
          sound.setMuted(!sound.muted);
          syncMuteUI();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (gameState.mode === 'PLAYING') {
            gameState.paused = true;
          }
          if (sound.ctx && sound.ctx.state === 'running') {
            sound.ctx.suspend().catch(() => {});
          }
        } else {
          if (gameState.mode === 'PLAYING') {
            gameState.paused = false;
          }
          if (sound.ctx && sound.ctx.state === 'suspended') {
            sound.ctx.resume().catch(() => {});
          }
        }
      });

      /* =====================================================================
         MAIN ANIMATION LOOP
      ===================================================================== */
      let lastFrameTime = performance.now();

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
        lastFrameTime = now;

        update(dt);
        render();

        requestAnimationFrame(loop);
      }

      window.onload = function () {
        resizeCanvas();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
</html>
