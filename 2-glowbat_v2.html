<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GLOWBAT FLIP v2 — Storybook Gravity Runner</title>
  <style>
    :root {
      --sky-top: #38b6ff;
      --sky-bottom: #fff3b0;
      --wood-dark: #5c3317;
      --wood-mid: #8b5a2b;
      --cream: #fff9e6;
      --gold: #ffcf33;
      --gold-deep: #f59e0b;
      --grass: #4cd964;
      --grass-dark: #28a745;
      --berry: #ff4769;
      --berry-dark: #c81e45;
      --teal: #00b4d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #2b6cb0 0%, #1a365d 100%);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", "Nunito", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    /* Outer responsive frame locked to mobile-first portrait 390x844 on desktop, fullscreen on mobile */
    #app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 920px;
      aspect-ratio: 390 / 844;
      background: linear-gradient(180deg, #4cc9f0 0%, #a8e6cf 65%, #ffd3b6 100%);
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45), 0 0 0 6px rgba(255, 255, 255, 0.22);
      border-radius: 28px;
    }

    @media (max-width: 500px), (max-height: 860px) {
      #app-shell {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* HUD OVERLAY */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 14px 0 14px;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-stat-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .hud-pill {
      background: linear-gradient(180deg, #fffdf5 0%, #ffefc2 100%);
      border: 3px solid #6b3e1e;
      border-radius: 999px;
      padding: 5px 12px;
      box-shadow: 0 4px 0 #6b3e1e, 0 6px 12px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: #4a2810;
    }

    .hud-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #9c5a25;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.3px;
      color: #3b1d0a;
      font-variant-numeric: tabular-nums;
    }

    #combo-pill {
      background: linear-gradient(180deg, #ffe066 0%, #ff9f1c 100%);
      border-color: #6b3e1e;
      transform: scale(1);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    #combo-pill.combo-hot {
      background: linear-gradient(180deg, #ff758f 0%, #ff2a55 100%);
      color: #ffffff;
      filter: drop-shadow(0 0 8px rgba(255, 71, 105, 0.65));
    }

    #combo-pill.combo-hot .hud-label,
    #combo-pill.combo-hot .hud-value {
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(107, 15, 38, 0.8);
    }

    #combo-pill.bump {
      transform: scale(1.22);
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #6b3e1e;
      background: linear-gradient(180deg, #fffdf5 0%, #ffe599 100%);
      box-shadow: 0 4px 0 #6b3e1e, 0 6px 12px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #6b3e1e;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: #5c3317;
    }

    /* Active Power-Up Countdown Row */
    #powerup-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      pointer-events: none;
    }

    .pu-badge {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fff3cc 70%, #ffd97d 100%);
      border: 3px solid #5c3317;
      box-shadow: 0 4px 0 #5c3317, 0 6px 12px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: puPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes puPopIn {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .pu-ring-svg {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .pu-ring-bg {
      fill: none;
      stroke: rgba(92, 51, 23, 0.22);
      stroke-width: 4.5;
    }

    .pu-ring-fg {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.08s linear;
    }

    .pu-icon-svg {
      width: 24px;
      height: 24px;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.2));
    }

    /* OVERLAY SCREENS (START / GAME OVER / PAUSE) */
    .overlay-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 30px 20px;
      background: radial-gradient(circle at 50% 38%, rgba(255, 250, 220, 0.12) 0%, rgba(25, 55, 95, 0.42) 100%);
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .overlay-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Bubbly Cartoon Logo */
    .logo-wrap {
      text-align: center;
      margin-top: 12px;
      animation: floatLogo 2.8s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    .logo-ribbon {
      display: inline-block;
      background: linear-gradient(180deg, #4cd964 0%, #249e3d 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 4px 14px;
      border-radius: 999px;
      border: 3px solid #1b4d24;
      box-shadow: 0 3px 0 #1b4d24;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .bubbly-title {
      font-size: 46px;
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffe14d;
      text-transform: uppercase;
      -webkit-text-stroke: 3.5px #5c2d0c;
      paint-order: stroke fill;
      text-shadow:
        0 5px 0 #5c2d0c,
        0 9px 18px rgba(0, 0, 0, 0.35);
      display: block;
    }

    .bubbly-title span.sub-word {
      display: block;
      font-size: 40px;
      color: #ff6b8b;
      -webkit-text-stroke: 3.5px #5c162e;
      text-shadow:
        0 5px 0 #5c162e,
        0 9px 18px rgba(0, 0, 0, 0.35);
      margin-top: 2px;
    }

    /* Center Hero Stage Spacer on Start Screen */
    .hero-stage-spacer {
      height: 175px;
      width: 100%;
      pointer-events: none;
    }

    /* Storybook Card Panel */
    .story-card {
      width: 100%;
      max-width: 342px;
      background: linear-gradient(180deg, #fffdf7 0%, #fff0c7 100%);
      border: 4px solid #6b3e1e;
      border-radius: 26px;
      padding: 18px 18px 20px 18px;
      box-shadow:
        0 8px 0 #6b3e1e,
        0 14px 28px rgba(0, 0, 0, 0.32),
        inset 0 3px 0 #ffffff;
      text-align: center;
      position: relative;
    }

    .how-to-line {
      font-size: 14.5px;
      line-height: 1.38;
      font-weight: 800;
      color: #5c3317;
      margin-bottom: 14px;
    }

    .legend-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      background: rgba(235, 198, 125, 0.32);
      border: 2px dashed #c68b45;
      border-radius: 16px;
      padding: 8px 6px;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 900;
      color: #5c3317;
      letter-spacing: 0.2px;
    }

    .legend-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #5c3317;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #5c3317;
    }

    .best-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #ffe57f 0%, #ffca28 100%);
      border: 3px solid #6b3e1e;
      border-radius: 999px;
      padding: 6px 18px;
      box-shadow: 0 3px 0 #6b3e1e;
      font-weight: 900;
      color: #4a2810;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .cta-btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 999px;
      border: 4px solid #1b4d24;
      background: linear-gradient(180deg, #69f07f 0%, #28b446 55%, #1e9638 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #155220;
      box-shadow:
        0 6px 0 #1b4d24,
        0 10px 20px rgba(0, 0, 0, 0.28),
        inset 0 3px 0 rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      animation: pulseBtn 1.5s ease-in-out infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    .cta-btn:active {
      transform: translateY(4px) scale(0.99);
      box-shadow: 0 2px 0 #1b4d24;
    }

    /* Game Over Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 16px 0;
    }

    .stat-box {
      background: linear-gradient(180deg, #ffffff 0%, #ffefd0 100%);
      border: 3px solid #7c4722;
      border-radius: 18px;
      padding: 10px 8px;
      box-shadow: 0 4px 0 #7c4722;
    }

    .stat-box-label {
      font-size: 11px;
      font-weight: 900;
      color: #9c5a25;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 2px;
    }

    .stat-box-val {
      font-size: 24px;
      font-weight: 900;
      color: #3b1d0a;
      font-variant-numeric: tabular-nums;
    }

    .new-best-tag {
      display: inline-block;
      background: #ff3b6b;
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 4px;
      vertical-align: middle;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <canvas id="game-canvas"></canvas>

    <!-- HUD OVERLAY -->
    <div id="hud">
      <div class="hud-top-row">
        <div class="hud-stat-group">
          <div class="hud-pill" title="Current Score">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="hud-score">0</span>
          </div>
          <div class="hud-pill" title="Best Score">
            <span class="hud-label">Best</span>
            <span class="hud-value" id="hud-best">0</span>
          </div>
          <div class="hud-pill" id="combo-pill" title="Acorn Combo Multiplier">
            <span class="hud-label">Combo</span>
            <span class="hud-value" id="hud-combo">x1</span>
          </div>
        </div>

        <div class="hud-controls">
          <button type="button" class="icon-btn" id="mute-btn" aria-label="Toggle Sound" title="Toggle Sound">
            <svg id="sound-on-icon" viewBox="0 0 24 24">
              <path d="M11 5L6 9H2v6h4l5 4V5zm4.5 7c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM13 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="sound-off-icon" viewBox="0 0 24 24" style="display:none;">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Active Power-Up Countdown Rings -->
      <div id="powerup-bar"></div>
    </div>

    <!-- START OVERLAY -->
    <div id="start-screen" class="overlay-screen">
      <div class="logo-wrap">
        <div class="logo-ribbon">Sunny Storybook Edition</div>
        <h1 class="bubbly-title">
          GLOWBAT
          <span class="sub-word">FLIP</span>
        </h1>
      </div>

      <!-- Leaves space in the middle so the waving cartoon bat on canvas is front and center -->
      <div class="hero-stage-spacer"></div>

      <div class="story-card">
        <p class="how-to-line">
          Tap anywhere to flip between grassy floor and ceiling, dodge snappy chompers, and snatch golden acorns!
        </p>

        <div class="legend-strip">
          <div class="legend-item">
            <div class="legend-dot" style="background:#52b788;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>
            </div>
            <span>SHIELD</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#38b6ff;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 7v6a9 9 0 0 0 18 0V7h-4v6a5 5 0 0 1-10 0V7H3z"/></svg>
            </div>
            <span>MAGNET</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#80ed99;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#1b4d24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11H8v-2h3V6h2z"/></svg>
            </div>
            <span>SLOW-MO</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#ffcf33;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#5c3317"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </div>
            <span>2X STAR</span>
          </div>
        </div>

        <div class="best-banner">
          <span>BEST SCORE:</span>
          <span id="start-best">0</span>
        </div>

        <button type="button" class="cta-btn" id="start-btn">TAP TO START</button>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-screen" class="overlay-screen hidden">
      <div class="logo-wrap" style="margin-top: 24px;">
        <div class="logo-ribbon" style="background:linear-gradient(180deg,#ff758f,#c81e45);border-color:#5c162e;">Ouch! Thorny Chomper!</div>
        <h2 class="bubbly-title" style="font-size:40px;">
          RUN OVER
        </h2>
      </div>

      <div class="story-card" style="margin-bottom: auto; margin-top: 18px;">
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box-label">Score</div>
            <div class="stat-box-val" id="go-score">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Best <span id="new-best-badge" class="new-best-tag" style="display:none;">NEW!</span></div>
            <div class="stat-box-val" id="go-best">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Golden Acorns</div>
            <div class="stat-box-val" id="go-orbs">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Max Combo</div>
            <div class="stat-box-val" id="go-combo">x1</div>
          </div>
        </div>

        <button type="button" class="cta-btn" id="restart-btn">TAP TO RESTART</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* =====================================================================
         STORAGE KEYS & PERSISTENCE (exact key glowbat_flip_best_v1 preserved)
      ===================================================================== */
      const BEST_STORAGE_KEY = 'glowbat_flip_best_v1';
      const MUTE_STORAGE_KEY = 'glowbat_flip_mute_v2';

      function loadBestScore() {
        try {
          const val = parseInt(localStorage.getItem(BEST_STORAGE_KEY), 10);
          return Number.isFinite(val) && val > 0 ? val : 0;
        } catch (e) {
          return 0;
        }
      }

      function saveBestScore(score) {
        try {
          localStorage.setItem(BEST_STORAGE_KEY, String(Math.floor(score)));
        } catch (e) {
          // Ignore storage errors in sandboxed contexts
        }
      }

      function loadMuteState() {
        try {
          return localStorage.getItem(MUTE_STORAGE_KEY) === '1';
        } catch (e) {
          return false;
        }
      }

      function saveMuteState(muted) {
        try {
          localStorage.setItem(MUTE_STORAGE_KEY, muted ? '1' : '0');
        } catch (e) {
          // Ignore storage errors
        }
      }

      /* =====================================================================
         ADAPTIVE WEBAUDIO SYNTHESIZER & SFX ENGINE
         - Zero external audio assets; 100% WebAudio synthesized
         - Evolving chiptune-folk loop across score milestones & combo >= x4
      ===================================================================== */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.muted = loadMuteState();
          this.isPlayingMusic = false;
          this.stepIndex = 0;
          this.nextNoteTime = 0;
          this.schedulerTimer = null;

          // Musical scales (C Major folk pentatonic/diatonic in MIDI notes)
          // Base C4 = 60
          this.bassPattern = [
            48, 55, 52, 55,  53, 60, 57, 60,
            55, 62, 59, 62,  48, 55, 52, 55
          ];
          this.leadPattern = [
            72, null, 74, 76,  79, null, 76, 72,
            77, 76, 74, 72,    74, null, 67, null,
            72, 74, 76, 79,    81, 79, 76, 74,
            79, 76, 74, 71,    72, null, 72, null
          ];
          this.arpChords = [
            [60, 64, 67, 72], // C
            [65, 69, 72, 77], // F
            [67, 71, 74, 79], // G
            [60, 64, 67, 72]  // C
          ];
          this.bellNotes = [84, 88, 91, 96, 93, 91, 88, 84];
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.muted ? 0 : 0.42;
            this.masterGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        setMuted(muted) {
          this.muted = muted;
          saveMuteState(muted);
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setTargetAtTime(muted ? 0 : 0.42, this.ctx.currentTime, 0.02);
          }
        }

        midiToFreq(midi) {
          return 440 * Math.pow(2, (midi - 69) / 12);
        }

        startMusic() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          if (this.isPlayingMusic) return;
          this.isPlayingMusic = true;
          this.stepIndex = 0;
          this.nextNoteTime = ctx.currentTime + 0.05;
          this.schedulerTimer = setInterval(() => this.scheduleMusic(), 40);
        }

        stopMusic() {
          this.isPlayingMusic = false;
          if (this.schedulerTimer) {
            clearInterval(this.schedulerTimer);
            this.schedulerTimer = null;
          }
        }

        scheduleMusic() {
          if (!this.isPlayingMusic || !this.ctx) return;
          const lookAhead = 0.14;
          while (this.nextNoteTime < this.ctx.currentTime + lookAhead) {
            this.playMusicStep(this.stepIndex, this.nextNoteTime);
            // Tempo scales subtly with intensity and combo
            const score = gameState.score;
            const hotCombo = gameState.combo >= 4;
            let bpm = 128;
            if (score >= 1500) bpm = 136;
            if (score >= 3000) bpm = 142;
            if (hotCombo) bpm += 5;
            const sixteenth = (60 / bpm) / 4;
            this.nextNoteTime += sixteenth;
            this.stepIndex = (this.stepIndex + 1) % 32;
          }
        }

        playMusicStep(step, time) {
          if (this.muted || !this.ctx || gameState.mode !== 'PLAYING' || gameState.paused) return;

          const score = gameState.score;
          const combo = gameState.combo;
          // At score >= 3000 shift up a semitone (+1)
          const transpose = score >= 3000 ? 1 : 0;
          const hotCombo = combo >= 4;

          // 1. Plucky Bassline (every 2 sixteenth steps = eighth notes)
          if (step % 2 === 0) {
            const bassIdx = (step / 2) % this.bassPattern.length;
            const midi = this.bassPattern[bassIdx] + transpose;
            this.synthTone(this.midiToFreq(midi), time, 0.13, 'triangle', 0.18, 0.006);
          }

          // 2. Light Percussion (always present; woodblock/shaker)
          if (step % 4 === 2) {
            this.synthNoiseHat(time, 0.035, 0.045);
          }
          if (step % 8 === 4) {
            this.synthWoodblock(time, 780, 0.06);
          }

          // 3. Score >= 250: Cheerful Lead Folk Melody
          if (score >= 250) {
            const leadNote = this.leadPattern[step % this.leadPattern.length];
            if (leadNote !== null) {
              const freq = this.midiToFreq(leadNote + transpose);
              this.synthLead(freq, time, 0.14, 0.11);
            }
          }

          // 4. Score >= 750 or Combo >= x4: Harmony Arpeggios
          if (score >= 750 || hotCombo) {
            const chordGroup = Math.floor(step / 8) % this.arpChords.length;
            const chord = this.arpChords[chordGroup];
            const arpMidi = chord[step % chord.length] + transpose;
            const gain = hotCombo ? 0.075 : 0.055;
            this.synthTone(this.midiToFreq(arpMidi), time, 0.08, 'sine', gain, 0.005);
          }

          // 5. Score >= 1500 or Combo >= x4: Driving Drums
          if (score >= 1500 || hotCombo) {
            if (step % 4 === 0) {
              this.synthKick(time, 0.22);
            }
            if (step % 8 === 4) {
              this.synthSnare(time, 0.12);
            }
            if (hotCombo && step % 2 === 1) {
              this.synthNoiseHat(time, 0.025, 0.055);
            }
          }

          // 6. Score >= 3000: Sparkle Bells
          if (score >= 3000 && step % 2 === 0) {
            const bellMidi = this.bellNotes[(step / 2) % this.bellNotes.length] + transpose;
            this.synthTone(this.midiToFreq(bellMidi), time, 0.18, 'sine', 0.06, 0.003);
          }
        }

        synthTone(freq, time, duration, type, peakGain, attack = 0.008) {
          const ctx = this.ctx;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(peakGain, time + attack);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + duration + 0.01);
        }

        synthLead(freq, time, duration, peakGain) {
          const ctx = this.ctx;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, time);
          // Slight cheerful pitch vibrato
          osc.frequency.linearRampToValueAtTime(freq * 1.006, time + duration * 0.5);
          osc.frequency.linearRampToValueAtTime(freq, time + duration);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1900, time);

          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(peakGain, time + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + duration + 0.01);
        }

        synthWoodblock(time, freq, peakGain) {
          const ctx = this.ctx;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.65, time + 0.045);
          gain.gain.setValueAtTime(peakGain, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.05);
        }

        synthKick(time, peakGain) {
          const ctx = this.ctx;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(135, time);
          osc.frequency.exponentialRampToValueAtTime(42, time + 0.11);
          gain.gain.setValueAtTime(peakGain, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.13);
        }

        synthSnare(time, peakGain) {
          this.synthNoiseHat(time, 0.09, peakGain);
          this.synthWoodblock(time, 220, peakGain * 0.7);
        }

        synthNoiseHat(time, duration, peakGain) {
          const ctx = this.ctx;
          const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(5000, time);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(peakGain, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noise.start(time);
          noise.stop(time + duration + 0.01);
        }

        /* --- DISTINCT SOUND EFFECTS --- */

        // 1. Boingy Flip SFX
        playFlip(toCeiling) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const startF = toCeiling ? 270 : 340;
          const midF = toCeiling ? 590 : 480;
          const endF = toCeiling ? 460 : 310;
          osc.frequency.setValueAtTime(startF, now);
          osc.frequency.exponentialRampToValueAtTime(midF, now + 0.075);
          osc.frequency.exponentialRampToValueAtTime(endF, now + 0.15);

          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        // 2. Plink Acorn Pickup (pitch rises with combo)
        playAcornPickup(combo) {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const semitoneStep = Math.min(16, combo - 1);
          const baseFreq = 587.33 * Math.pow(2, semitoneStep / 12); // D5 upwards
          this.synthTone(baseFreq, now, 0.11, 'sine', 0.26, 0.003);
          this.synthTone(baseFreq * 1.5, now + 0.045, 0.15, 'triangle', 0.22, 0.003);
        }

        // 3. Power-up Happy Chirp
        playPowerupChirp() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
          notes.forEach((f, idx) => {
            this.synthTone(f, now + idx * 0.045, 0.14, 'triangle', 0.25, 0.004);
          });
        }

        // 4. Shield-Break Crunch
        playShieldBreak() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          this.synthNoiseHat(now, 0.22, 0.34);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.24);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.26);
        }

        // 5. Sad Slide-Whistle Game Over
        playGameOver() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(740, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.26);
          osc.frequency.exponentialRampToValueAtTime(165, now + 0.78);

          gain.gain.setValueAtTime(0.28, now);
          gain.gain.linearRampToValueAtTime(0.24, now + 0.55);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.82);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.84);

          // Cartoon comical thud at the end
          this.synthKick(now + 0.72, 0.35);
        }

        // 6. Jaunty Restart Jingle
        playRestartJingle() {
          const ctx = this.ensureContext();
          if (!ctx || this.muted) return;
          const now = ctx.currentTime;
          const jingle = [
            { f: 523.25, t: 0.0, d: 0.09 },

            { f: 783.99, t: 0.14, d: 0.10 },
            { f: 1046.50, t: 0.22, d: 0.22 }
          ];
          jingle.forEach((n) => {
            this.synthTone(n.f, now + n.t, n.d, 'triangle', 0.24, 0.005);
          });
        }

      function updatePowerupHUD() {
        const activeList = [];
        if (gameState.hasShield) {
          activeList.push({ id: 'SHIELD', ratio: 1, color: '#28a745' });
        }
        if (gameState.magnetTimer > 0) {
          activeList.push({
            id: 'MAGNET',
            ratio: Math.max(0, gameState.magnetTimer / POWERUP_TYPES.MAGNET.duration),
            color: '#0096c7'
          });
        }
        if (gameState.slowmoTimer > 0) {
          activeList.push({
            id: 'SLOWMO',
            ratio: Math.max(0, gameState.slowmoTimer / POWERUP_TYPES.SLOWMO.duration),
            color: '#38b000'
          });
        }
        if (gameState.doubleTimer > 0) {
          activeList.push({
            id: 'DOUBLE',
            ratio: Math.max(0, gameState.doubleTimer / POWERUP_TYPES.DOUBLE.duration),
            color: '#f59e0b'
          });
        }

        // Reconcile badges cleanly
        const existingIds = Array.from(powerupBarEl.children).map((el) => el.getAttribute('data-pu'));
        const nextIds = activeList.map((a) => a.id);

        if (existingIds.join(',') !== nextIds.join(',')) {
          powerupBarEl.innerHTML = activeList
            .map((item) => {
              const circumference = 2 * Math.PI * 22;
              const offset = circumference * (1 - item.ratio);
              return `
                <div class="pu-badge" data-pu="${item.id}">
                  <svg class="pu-ring-svg" viewBox="0 0 52 52">
                    <circle class="pu-ring-bg" cx="26" cy="26" r="22"></circle>
                    <circle class="pu-ring-fg" cx="26" cy="26" r="22"
                      stroke="${item.color}"
                      stroke-dasharray="${circumference.toFixed(2)}"
                      stroke-dashoffset="${offset.toFixed(2)}"></circle>
                  </svg>
                  ${getPowerupSvgMarkup(item.id)}
                </div>
              `;
            })
            .join('');
        } else {
          // Update stroke-dashoffset in place
          const circumference = 2 * Math.PI * 22;
          activeList.forEach((item, idx) => {
            const badge = powerupBarEl.children[idx];
            if (!badge) return;
            const fg = badge.querySelector('.pu-ring-fg');
            if (fg) {
              const offset = circumference * (1 - item.ratio);
              fg.setAttribute('stroke-dashoffset', offset.toFixed(2));
            }
          });
        }
